    nav:'<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    theme:'<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18h1.5a2 2 0 0 0 0-4H12a2 2 0 0 1 0-4h3a6 6 0 0 0 0-12h-3Z"/><path d="M7.5 9h.01M10 6.5h.01M6.5 13h.01"/></svg>',
    task:'<svg viewBox="0 0 24 24"><path d="M9 11l2 2 4-5M5 5h14v14H5z"/></svg>',
    habit:'<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
    project:'<svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>',
  };
  return icons[type] || SEARCH_ICON;
}

function renderCommandResults() {
  const input = document.getElementById('command-input');
  const list = document.getElementById('command-results');
  if (!input || !list) return;
  const q = input.value.trim();
  const items = commandPaletteItems()
    .filter(item => fuzzyMatch(`${item.title} ${item.kind}`, q))
    .slice(0, 18);
  renderCommandResults.items = items;
  if (!items.length) {
    list.innerHTML = '<div class="command-empty">Nada encontrado.</div>';
    return;
  }
  list.innerHTML = items.map((item, index) => `
    <button type="button" class="command-item ${index === 0 ? 'active' : ''}" data-command-index="${index}">
      <span class="command-icon">${commandIcon(item.icon)}</span>
      <span class="command-main">
        <span class="command-title">${escapeHTML(item.title)}</span>
        <span class="command-kind">${escapeHTML(item.kind)}</span>
      </span>
    </button>
  `).join('');
  list.querySelectorAll('[data-command-index]').forEach(btn => {
    btn.addEventListener('click', () => runCommandItem(items[parseInt(btn.dataset.commandIndex)]));
  });
}

function runCommandItem(item) {
  if (!item) return;
  closeCommandPalette();
  item.run();
}

function openCommandPalette() {
  const overlay = document.getElementById('command-palette');
  const input = document.getElementById('command-input');
  if (!overlay || !input) return;
  commandOpen = true;
  overlay.classList.add('open');
  input.value = '';
  renderCommandResults();
  window.setTimeout(() => input.focus(), 40);
}

function closeCommandPalette() {
  const overlay = document.getElementById('command-palette');
  if (!overlay) return;
  commandOpen = false;
  overlay.classList.remove('open');
}

function setupCommandPalette() {
  const btn = document.getElementById('global-search-btn');
  const overlay = document.getElementById('command-palette');
  const input = document.getElementById('command-input');
  if (btn) btn.addEventListener('click', openCommandPalette);
  if (overlay) {
    overlay.addEventListener('click', e => {
      if (e.target === overlay) closeCommandPalette();
    });
  }
  if (input) {
    input.addEventListener('input', renderCommandResults);
    input.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.preventDefault(); closeCommandPalette(); }
      if (e.key === 'Enter') {
        e.preventDefault();
        runCommandItem((renderCommandResults.items || [])[0]);
      }
    });
  }
  document.addEventListener('keydown', e => {
    const isShortcut = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k';
    if (isShortcut) {
      e.preventDefault();
      commandOpen ? closeCommandPalette() : openCommandPalette();
      return;
    }
    if (e.key === 'Escape' && commandOpen) closeCommandPalette();
  });
}

// ─── WEEK STRIP CAROUSEL ─────────────────────────────────────────────────────
function buildWeekStrip() {
  const strip = document.getElementById('week-strip');
  const activeDateStr = WEEK_DATES[activeDay];
  const base = parseDateKey(activeDateStr);
  const RANGE = 30;

  const dates = Array.from({length: RANGE * 2 + 1}, (_, i) => {
    const d = new Date(base.getTime());
    d.setDate(d.getDate() + i - RANGE);
    return formatDateKey(d);
  });

  const daysHTML = dates.map(dateStr => {
    const parsed = parseDateKey(dateStr);
    const isActive = dateStr === activeDateStr;
    const isToday  = dateStr === TODAY;
    const dow = (parsed.getDay() + 6) % 7;
    return `<button class="day-btn${isActive?' active':''}${isToday&&!isActive?' today':''}" data-date="${dateStr}">
      <span class="day-letter">${DAYS_LETTER[dow]}</span>
      <span class="day-num">${parsed.getDate()}</span>
      ${isToday && !isActive ? '<span class="day-dot"></span>' : ''}
    </button>`;
  }).join('');

  strip.innerHTML = `
    <button class="week-nav-arrow" id="week-prev">&#8249;</button>
    <div class="week-nav-days" id="week-scroll">${daysHTML}</div>
    <button class="week-nav-arrow" id="week-next">&#8250;</button>`;

  const scrollEl = strip.querySelector('#week-scroll');

  // center active day instantly
  const activeBtn = scrollEl.querySelector('.day-btn.active');
  if (activeBtn) {
    scrollEl.scrollLeft = activeBtn.offsetLeft - scrollEl.offsetWidth / 2 + activeBtn.offsetWidth / 2;
  }

  // arrows jump ±7 days
  strip.querySelector('#week-prev').addEventListener('click', () => {
    navigateToDate(addDays(WEEK_DATES[activeDay], -7));
  });
  strip.querySelector('#week-next').addEventListener('click', () => {
    navigateToDate(addDays(WEEK_DATES[activeDay], 7));
  });

  // click a day
  scrollEl.querySelectorAll('.day-btn').forEach(btn => {
    btn.addEventListener('click', () => navigateToDate(btn.dataset.date));
  });

  // scroll settle → detect centred day (day view only — week view doesn't have a "selected day")
  let t;
  scrollEl.addEventListener('scroll', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      if (currentView !== 'dia') return;
      const center = scrollEl.scrollLeft + scrollEl.offsetWidth / 2;
      let best = null, bestDist = Infinity;
      scrollEl.querySelectorAll('.day-btn').forEach(btn => {
        const dist = Math.abs(btn.offsetLeft + btn.offsetWidth / 2 - center);
        if (dist < bestDist) { bestDist = dist; best = btn; }
      });
      if (best && best.dataset.date !== WEEK_DATES[activeDay]) {
        navigateToDate(best.dataset.date, false);
      }
    }, 80);
  }, { passive: true });
}

function syncWeekStripMode() {
  const strip = document.getElementById('week-strip');
  if (!strip) return;
  strip.classList.toggle('week-mode', currentView === 'semana');
}

function navigateToDate(dateStr, smooth = true) {
  const idx = ensureDateInWeek(dateStr);
  activeDay = idx;

  const scrollEl = document.getElementById('week-scroll');
  const btn = scrollEl && scrollEl.querySelector(`[data-date="${dateStr}"]`);

  if (btn) {
    // update classes in place — no DOM rebuild
    scrollEl.querySelectorAll('.day-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.date === dateStr);
      b.classList.toggle('today', b.dataset.date === TODAY && b.dataset.date !== dateStr);
    });
    if (smooth) btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  } else {
    buildWeekStrip();
  }

  updateHeader();
  updateProgress();
  updateTaskCount();
  if (currentNav === 'hoje') {
    if (currentView === 'dia') {
      showScreen('screen-hoje-semana');
      renderDayList();
    } else if (currentView === 'semana') {
      showScreen('screen-hoje-semana');
      renderTaskList();
    }
  }
  saveState();
}

// ─── VIEW TOGGLE ─────────────────────────────────────────────────────────────
function buildViewToggle() {
  const tg = document.getElementById('view-toggle');
  tg.querySelectorAll('button').forEach(btn => {
    const meta = VIEW_META[btn.dataset.view];
    if (meta && btn.dataset.readyIcon !== 'true') {
      btn.innerHTML = `${meta.icon}<span>${meta.label}</span>`;
      btn.dataset.readyIcon = 'true';
    }
    btn.classList.toggle('active', btn.dataset.view === currentView);
    btn.onclick = () => {
      currentView = btn.dataset.view;
      buildViewToggle();
      renderAll();
    };
  });
}

// ─── SCREEN MANAGER ──────────────────────────────────────────────────────────
function showScreen(id) {
  let previousActive = false;
  document.querySelectorAll('.screen').forEach(s => {
    if (s.classList.contains('active') && s.id !== id) previousActive = true;
    s.classList.remove('active', 'entering');
  });
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('active');
  if (previousActive && !calendarSwipeActive) {
    void el.offsetWidth;
    el.classList.add('entering');
  }
}

// ─── RENDER ALL ───────────────────────────────────────────────────────────────
function renderAll() {
  const nav = currentNav, view = currentView;

  if (nav === 'hoje' && view === 'dia') {
    showScreen('screen-hoje-semana');
    renderDayList();
  } else if (nav === 'hoje' && view === 'semana') {
    showScreen('screen-hoje-semana');
    renderTaskList();
  } else if (nav === 'hoje' && view === 'mensal') {
    showScreen('screen-hoje-mensal');
    renderMonthView();
  } else if (nav === 'habitos' && view === 'semana') {
    showScreen('screen-habitos-semana');
    renderHabitsWeek();
  } else if (nav === 'habitos' && view === 'mensal') {
    showScreen('screen-habitos-mensal');
    renderHabitsMonth();
  } else if (nav === 'projetos') {
    showScreen('screen-projetos');
    renderProjects();
  } else if (nav === 'perfil') {
    showScreen('screen-perfil');
    renderProfile();
  }

  syncWeekStripMode();
  updateProgress();
  updateTaskCount();
  saveState();
  scheduleNotifications();
  requestAnimationFrame(updateScrollOverflow);
}

// ─── PROGRESS ────────────────────────────────────────────────────────────────
function updateProgress() {
  const fill = document.getElementById('main-progress-fill');
  if (currentNav === 'hoje') {
    const dayTasks = tasks.filter(t => t.date === WEEK_DATES[activeDay]);
    const pct = dayTasks.length ? (dayTasks.filter(t=>t.done).length / dayTasks.length)*100 : 0;
    fill.style.width = pct + '%';
  } else if (currentNav === 'habitos') {
    const done = habits.filter(h=>h.week[TODAY_IDX]===true).length;
    const pct = habits.length ? (done/habits.length)*100 : 0;
    fill.style.width = pct + '%';
  }
}

function updateTaskCount() {
  const dayTasks = tasks.filter(t => t.date === WEEK_DATES[activeDay]);
  document.getElementById('done-count').textContent  = dayTasks.filter(t=>t.done).length;
  document.getElementById('total-count').textContent = dayTasks.length;
}

let lastFocusedInputDate = null;

function wireSectionInlineInputs() {
  const rows = document.querySelectorAll('#task-list-pending .inline-task-row.inline');
  rows.forEach(row => {
    const date = row.dataset.inputDate || '';
    const input = row.querySelector('.inline-task-input');
    const tickBtn = row.querySelector('.tick-btn');
    if (!input) return;

    const updateTick = () => {
      if (!tickBtn) return;
      const hasText = !!input.value.trim();
      tickBtn.style.opacity = hasText ? '1' : '0.2';
      tickBtn.style.pointerEvents = hasText ? 'auto' : 'none';
    };

    const submit = () => {
      const title = input.value.trim();
      if (!title) return;
      tasks.push({ id: Date.now(), title, done: false, priority: 'média',
                   projectId: null, time: '', date: date || null, subtasks: [] });
      lastFocusedInputDate = date;
      renderAll();
      const sel = date
        ? `.inline-task-row.inline[data-input-date="${date}"] .inline-task-input`
        : `.inline-task-row.inline[data-input-date=""] .inline-task-input`;
      document.querySelector(sel)?.focus();
    };

    input.addEventListener('focus', () => { lastFocusedInputDate = date; });
    input.addEventListener('input', updateTick);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
    });
    input.addEventListener('change', () => { if (input.value.trim()) submit(); });
    if (tickBtn) tickBtn.addEventListener('click', e => { e.preventDefault(); submit(); });
  });
}

function wireNotebookAddTap() {
  const list = document.getElementById('task-list-pending');
  if (!list) return;
  if (list._notebookTapBound) return;
  list._notebookTapBound = true;

  const focusDate = date => {
    const key = date ?? '';
    const input = list.querySelector(`.inline-task-row.inline[data-input-date="${key}"] .inline-task-input`);
    if (!input) return false;
    input.focus();
    return true;
  };

  list.addEventListener('click', e => {
    if (taskDragActive || calendarSwipeActive) return;
    if (e.target.closest('.task-row,.task-swipe-wrap,.reschedule-panel')) return;
    if (e.target.closest('button,textarea,select')) return;
    if (e.target.tagName === 'INPUT') return;

    const inlineRow = e.target.closest('.inline-task-row.inline');
    if (inlineRow) {
      focusDate(inlineRow.dataset.inputDate);
      return;
    }

    const sectionLabel = e.target.closest('.section-label[data-section-date]');
    if (sectionLabel) {
      focusDate(sectionLabel.dataset.sectionDate);
      return;
    }

    const clickY = e.clientY;
    const sections = list.querySelectorAll('.section-label[data-section-date]');
    let best = null;
    for (const sec of sections) {
      const rect = sec.getBoundingClientRect();
      if (rect.top <= clickY) best = sec; else break;
    }
    if (!best) {
      const inlineRows = list.querySelectorAll('.inline-task-row.inline[data-input-date]');
      for (const row of inlineRows) {
        const rect = row.getBoundingClientRect();
        if (rect.top <= clickY) { focusDate(row.dataset.inputDate); return; }
      }
      return;
    }
    focusDate(best.dataset.sectionDate);
  });
}

// ─── TASK LIST ────────────────────────────────────────────────────────────────
function inlineRowHTML(dateKey, placeholder) {
  const ph = placeholder || 'Nova tarefa…';
  return `
    <div class="inline-task-row inline" data-input-date="${dateKey}">
      <button class="tick-btn" style="opacity:0.2;pointer-events:none" tabindex="-1">${CHECK_SVG}</button>
      <input class="inline-task-input" type="text"
             placeholder="${ph}" autocomplete="off" spellcheck="false"
             enterkeyhint="done">
    </div>`;
}

function renderDayList() {
  const dayKey = WEEK_DATES[activeDay];
  const dayTasks = tasks.filter(t => t.date === dayKey)
    .sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
  const undatedTasks = tasks.filter(t => !t.date);
  const isToday = dayKey === TODAY;

  let html = '';

  if (undatedTasks.length) {
    html += `<div class="section-label nodate" data-section-date="">Sem data</div>`;
    html += undatedTasks.map(t => taskRowHTML(t)).join('');
    html += inlineRowHTML('', 'Nova tarefa');
  }

  const label = getDateLabel(dayKey);
  html += `<div class="section-label${isToday ? ' today' : ''}" data-section-date="${dayKey}">${isToday ? 'Hoje' : label}</div>`;

  if (dayTasks.length) {
    html += dayTasks.map(t => taskRowHTML(t)).join('');
  }

  html += inlineRowHTML(dayKey, 'Nova tarefa');
  html += `<div style="height:100px"></div>`;

  document.getElementById('task-list-pending').innerHTML = html;
  document.getElementById('task-list-done-wrap').style.display = 'none';
  document.getElementById('task-list-undated-wrap').style.display = 'none';

  wireSectionInlineInputs();
  wireNotebookAddTap();
  attachTaskEvents();
}

function renderTaskList() {
  const tasksByDate = WEEK_DATES.reduce((acc, dateKey) => {
    acc[dateKey] = tasks
      .filter(t => t.date === dateKey)
      .sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
    return acc;
  }, {});
  const undatedTasks = tasks.filter(t => !t.date);

  let html = '';

  WEEK_DATES.forEach(dateKey => {
    const group = tasksByDate[dateKey];
    const label = getDateLabel(dateKey);
    const isToday = dateKey === TODAY;
    const cls = `section-label${isToday ? ' today' : ''}`;
    html += `<div class="${cls}" data-section-date="${dateKey}">${isToday ? 'Hoje' : label}</div>`;
    if (group.length) {
      html += group.map(t => taskRowHTML(t)).join('');
    }
    html += inlineRowHTML(dateKey, 'Nova tarefa');
  });

  if (undatedTasks.length) {
    html += `<div class="section-label nodate" data-section-date="">Sem data</div>`;
    html += undatedTasks.map(t => taskRowHTML(t)).join('');
    html += inlineRowHTML('', 'Nova tarefa');
  }

  html += `<div style="height:80px"></div>`;

  document.getElementById('task-list-pending').innerHTML = html;
  document.getElementById('task-list-done-wrap').style.display = 'none';
  document.getElementById('task-list-undated-wrap').style.display = 'none';

  wireSectionInlineInputs();
  wireNotebookAddTap();
  attachTaskEvents();
}

function taskRowHTML(task) {

  const pc   = PRIORITY[task.priority];
  const checkStyle = proj ? `style="--check-color:${proj.dot}"` : '';
  return `
    <div class="task-swipe-wrap" data-swipe-id="${task.id}">
      <div class="task-delete-bg" aria-hidden="true">
        <div class="trash-can">
          <svg viewBox="0 0 32 34" fill="none">
            <g class="trash-lid">
              <path d="M10 8.5h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M13 5.5h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </g>
            <path d="M9.5 12h13l-1 16.5a2.2 2.2 0 0 1-2.2 2H12.7a2.2 2.2 0 0 1-2.2-2L9.5 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path class="trash-face" d="M14 18.5v6M18 18.5v6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
      <div class="task-row ${task.done?'done':''}" data-id="${task.id}" ${checkStyle}>
        <button class="tick-btn ${task.done?'checked':''}" data-tick="${task.id}" ${checkStyle}>
          ${CHECK_SVG}
        </button>
        <div class="task-body">
          <div class="task-title">${task.title}</div>
          <div class="task-meta">
            ${proj ? `<span class="meta-proj"><span class="proj-dot" style="background:${proj.dot}"></span>${proj.name}</span>` : ''}
            ${task.time ? `<span class="meta-time">${task.time}</span>` : ''}
            ${task.repeat && task.repeat !== 'nenhuma' ? `<span class="meta-sub">recorrente: ${task.repeat}</span>` : ''}
            ${task.subtasks?.length ? `<span class="meta-sub">${task.subtasks.length} subtarefas</span>` : ''}
          </div>
        </div>
        <span class="priority-badge" style="color:${pc.color}">
          <span class="priority-dot" style="background:${pc.color}"></span>${pc.label}
        </span>
      </div>
    </div>
    <div class="reschedule-panel" id="rp-${task.id}" style="display:none">
      <div class="panel-label">Mover para</div>
      <div class="reschedule-dates">
        ${Object.entries(DATES_MAP).map(([dk,label]) =>
          `<button data-move="${task.id}" data-date="${dk}">${label}</button>`
        ).join('')}
        <button data-move="${task.id}" data-date="null">Sem data</button>
        <button class="cancel" data-cancel="${task.id}">Cancelar</button>
      </div>
    </div>`;
}

function attachTaskEvents() {
  // tick buttons
  document.querySelectorAll('[data-tick]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.tick);
      toggleTask(id);
    });
  });

  // task row click (open detail)
  document.querySelectorAll('.task-row').forEach(row => {
    row.addEventListener('click', () => {
      if (row.dataset.suppressClick === 'true') {
        row.dataset.suppressClick = 'false';
        return;
      }
      selectedTaskId = parseInt(row.dataset.id);
      openTaskDetail();
    });
    // drag to reschedule
    setupDrag(row);
  });

  // reschedule buttons
  document.querySelectorAll('[data-move]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.move);
      const date = btn.dataset.date === 'null' ? null : btn.dataset.date;
      rescheduleTask(id, date);
    });
  });
  document.querySelectorAll('[data-cancel]').forEach(btn => {
    btn.addEventListener('click', e => {

function setupDrag(row) {
  let startX = 0, startY = 0, offset = 0, dragging = false, moved = false, pressed = false;
  const id = row.dataset.id;
  const wrap = row.closest('.task-swipe-wrap');
  const DELETE_LIMIT = 68;
  const NEXT_DAY_LIMIT = 62;
  const MAX_PULL = 104;
  const MAX_RIGHT_PULL = 92;
  const START_LIMIT = 10;

  const setTrashProgress = (progress) => {
    if (!wrap) return;
    wrap.classList.toggle('swiping', progress > 0.02);
    wrap.classList.toggle('delete-mid', progress >= 0.35 && progress < 0.7);
    wrap.classList.toggle('delete-ready', progress >= 0.7);
  };

  const clearSwipeClasses = () => {
    if (!wrap) return;
    wrap.classList.remove('swiping', 'delete-mid', 'delete-ready', 'deleting', 'trash-capture');
  };

  const resetDrag = () => {
    pressed = false;
    dragging = false;
    taskDragActive = false;
    row.classList.remove('drag-ready','dragging');
    row.style.transform = '';
    clearSwipeClasses();
  };

  const animateDelete = () => {
    pressed = false;
    dragging = false;
    taskDragActive = false;
    row.dataset.suppressClick = 'true';
    row.classList.remove('drag-ready','dragging');
    row.classList.add('deleting');
    if (wrap) {
      wrap.classList.add('deleting', 'delete-ready');
      window.setTimeout(() => wrap.classList.add('trash-capture'), 120);
    }
    window.setTimeout(() => deleteTask(parseInt(id), false), 280);
  };

  row.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    startX = e.clientX;
    startY = e.clientY;
    offset = 0;
    moved = false;
    pressed = true;
  });

  row.addEventListener('pointermove', e => {
    if (!pressed) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (!dragging && Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx) * 1.2) {
      pressed = false;
      return;
    }
    if (!dragging && (Math.abs(dx) < START_LIMIT || Math.abs(dx) < Math.abs(dy) * 1.25)) return;
    e.preventDefault();
    if (!dragging && row.setPointerCapture) row.setPointerCapture(e.pointerId);
    dragging = true;
    taskDragActive = true;
    moved = true;
    row.classList.remove('drag-ready');
    row.classList.add('dragging');
    offset = Math.max(-MAX_PULL, Math.min(MAX_RIGHT_PULL, dx));
    row.style.transform = `translateX(${offset}px)`;
    setTrashProgress(Math.min(1, Math.abs(Math.min(0, offset)) / MAX_PULL));
  });

  row.addEventListener('pointerup', () => {
    if (dragging && offset < -DELETE_LIMIT) {
      row.dataset.suppressClick = 'true';
      animateDelete();
      return;
    }
    if (dragging && offset > NEXT_DAY_LIMIT) {
      row.dataset.suppressClick = 'true';
      resetDrag();
      moveTaskByDays(parseInt(id), 1);
      return;
    }
    if (moved || dragging) row.dataset.suppressClick = 'true';
    resetDrag();
    offset = 0;
  });

  row.addEventListener('pointercancel', resetDrag);
}

function toggleTask(id) {
  const t = tasks.find(t => t.id === id);
  if (t) t.done = !t.done;
  renderAll();
}

function deleteTask(id, ask = true) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  if (ask && !confirmDelete(`a tarefa "${t.title}"`)) return;
  tasks = tasks.filter(task => task.id !== id);
  closeModal('modal-task-detail');
  renderAll();
  showDayToast('Tarefa excluida');
}

function rescheduleTask(id, date) {
  const t = tasks.find(t => t.id === id);
  if (t) t.date = date;
  renderAll();
}

function moveTaskByDays(id, direction) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  const currentIdx = t.date ? WEEK_DATES.indexOf(t.date) : activeDay;
  const baseIdx = currentIdx >= 0 ? currentIdx : activeDay;
  const targetDate = baseIdx + direction < 0
    ? addDays(WEEK_DATES[0], -1)
    : baseIdx + direction >= WEEK_DATES.length
      ? addDays(WEEK_DATES[WEEK_DATES.length - 1], 1)
      : WEEK_DATES[baseIdx + direction];
  const targetIdx = ensureDateInWeek(targetDate);
  t.date = WEEK_DATES[targetIdx];
  const label = getDateLabel(WEEK_DATES[targetIdx]);
  if (targetIdx !== activeDay) {
    buildWeekStrip();
    setActiveDay(targetIdx, { toast: `Movida para ${label}` });
  } else {
    renderAll();
    showDayToast(`Movida para ${label}`);
  }
}

function renderMonthView() {
  const mv = document.getElementById('month-view');
  const MONTH_NAMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                       'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const base = new Date(TODAY_DATE.getFullYear(), TODAY_DATE.getMonth(), 1);
  base.setMonth(base.getMonth() + taskMonthOffset);
  const year  = base.getFullYear();
  const month = base.getMonth();
  const daysInMonth   = new Date(year, month + 1, 0).getDate();
  const firstWeekday  = new Date(year, month, 1).getDay(); // 0=Sun
  const totalCells    = Math.ceil((firstWeekday + daysInMonth) / 7) * 7;
  const pad = n => String(n).padStart(2, '0');
  const todayParsed = parseDateKey(TODAY);

  let html = `
    <div class="period-nav" style="margin:0 16px 12px">
      <button type="button" data-month-dir="-1">&#8249;</button>
      <div class="period-label">${MONTH_NAMES[month]} ${year}</div>
      <button type="button" data-month-dir="1">&#8250;</button>
    </div>
    <div class="month-day-headers">
      ${['D','S','T','Q','Q','S','S'].map(d=>`<span>${d}</span>`).join('')}
    </div>`;

  for (let w = 0; w * 7 < totalCells; w++) {
    html += `<div class="month-week">`;
    for (let d = 0; d < 7; d++) {
      const dayNum = w * 7 + d - firstWeekday + 1;
      if (dayNum < 1 || dayNum > daysInMonth) { html += `<div class="month-cell empty"></div>`; continue; }
      const ds = `${year}-${pad(month+1)}-${pad(dayNum)}`;
      const dt = tasks.filter(t => t.date === ds);
      const hasDone = dt.some(t => t.done), hasPending = dt.some(t => !t.done);
      const isToday = year === todayParsed.getFullYear() && month === todayParsed.getMonth() && dayNum === todayParsed.getDate();
      html += `
        <div class="month-cell ${isToday?'today':''}" data-month-date="${ds}">
          <span class="cell-num">${dayNum}</span>
          ${(hasDone||hasPending) ? `<div class="cell-dots">
            ${hasPending?`<div class="cell-dot" style="background:${isToday?'rgba(255,255,255,0.7)':PRIORITY.alta.color}"></div>`:''}
            ${hasDone?`<div class="cell-dot" style="background:${isToday?'rgba(255,255,255,0.5)':PRIORITY.baixa.color}"></div>`:''}
          </div>` : ''}
        </div>`;
    }
    html += `</div>`;
  }
  html += `
    <div class="month-legend">
      <div class="legend-item"><div class="legend-dot" style="background:${PRIORITY.alta.color}"></div>Pendente</div>
      <div class="legend-item"><div class="legend-dot" style="background:${PRIORITY.baixa.color}"></div>Concluída</div>
    </div>`;
  mv.innerHTML = html;

  mv.querySelectorAll('[data-month-dir]').forEach(btn => {
    btn.addEventListener('click', () => {
      taskMonthOffset += parseInt(btn.dataset.monthDir);
      renderMonthView();
    });
  });

  mv.querySelectorAll('.month-cell:not(.empty)').forEach(cell => {
    cell.addEventListener('click', () => {
      const dateStr = cell.dataset.monthDate;
      ensureDateInWeek(dateStr);
      currentView = 'dia';
      buildViewToggle();
      buildWeekStrip();
      navigateToDate(dateStr);
    });
  });
}

function checkHabit(id) {
  checkHabitDay(id, TODAY_IDX);
}

function checkHabitDay(id, dayIdx) {
  const h = habits.find(h=>h.id===id);
  if (!h) return;
  const week = getHabitWeek(h);
  if (week[dayIdx] === null) return;
  const was = week[dayIdx]===true;
  week[dayIdx] = !was;
  if (habitWeekOffset === 0 && dayIdx === TODAY_IDX) {
    h.streak = was ? Math.max(0, h.streak-1) : h.streak+1;
  }
  renderAll();
  if (selectedHabitId === id) {
    const overlay = document.getElementById('modal-habit-detail');
    if (overlay.classList.contains('open')) openHabitDetail();
  }
}

function toggleHabitHeatmapDay(id, heatmapIdx) {
  const h = habits.find(h=>h.id===id);
  if (!h) return;
  const heatmap = getHabitHeatmap(h);
  if (heatmap[heatmapIdx] === null) return;
  heatmap[heatmapIdx] = !heatmap[heatmapIdx];
  renderAll();
}

function setupHabitDrag(card) {
  let startX = 0, startY = 0, offset = 0, dragging = false, pressed = false, holdTimer = null;
  const id = parseInt(card.dataset.habitOpen);

  const reset = () => {
    clearTimeout(holdTimer);
    pressed = false;
    dragging = false;
    card.classList.remove('drag-ready','dragging');
    card.style.transform = '';
  };

  card.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    if (card.setPointerCapture) card.setPointerCapture(e.pointerId);
    startX = e.clientX;
    startY = e.clientY;
    offset = 0;
    pressed = true;
    holdTimer = setTimeout(() => card.classList.add('drag-ready'), 170);
  });

  card.addEventListener('pointermove', e => {
    if (!pressed) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dy) > 14 && Math.abs(dy) > Math.abs(dx)) {
      clearTimeout(holdTimer);
      return;
    }
    if (Math.abs(dx) < 14) return;
    dragging = true;
    card.classList.remove('drag-ready');
    card.classList.add('dragging');
    offset = Math.max(-128, Math.min(40, dx));
    card.style.transform = `translateX(${offset}px)`;
  });

  card.addEventListener('pointerup', () => {
    clearTimeout(holdTimer);
    if (dragging && offset < -64) {
      card.dataset.suppressClick = 'true';
      deleteHabit(id, true);
      reset();
      return;
    }
    if (dragging) card.dataset.suppressClick = 'true';
    reset();
  });

  card.addEventListener('pointercancel', reset);
}

function attachAppearanceEvents(root) {
  const colorInput = root.querySelector('#appearance-color');
  if (colorInput) {
    colorInput.addEventListener('input', (e) => {
      e.stopPropagation();
      accentColor = colorInput.value;
      applyTheme();
    });
  }
  const bgInput = root.querySelector('#appearance-bg-color');
  if (bgInput) {
    bgInput.addEventListener('input', (e) => {
      e.stopPropagation();
      customBgColor = bgInput.value;
      applyTheme();
    });
  }
  const titleFontSelect = root.querySelector('#appearance-title-font');
  if (titleFontSelect) {
    titleFontSelect.addEventListener('change', (e) => {
      e.stopPropagation();
      titleFont = titleFontSelect.value;
      applyTheme();
    });
  }
  const bodyFontSelect = root.querySelector('#appearance-body-font');
  if (bodyFontSelect) {
    bodyFontSelect.addEventListener('change', (e) => {
      e.stopPropagation();
      bodyFont = bodyFontSelect.value;
      applyTheme();
    });
  }
  root.querySelectorAll('[data-theme-choice]').forEach(btn => {
    btn.addEventListener('click', (event) => {
      event.stopPropagation();
      darkTheme = btn.dataset.themeChoice === 'dark';
      applyTheme();
      renderProfile();
    });
  });
  root.querySelectorAll('[data-font-mode]').forEach(btn => {
    btn.addEventListener('click', (event) => {
      event.stopPropagation();
      event.preventDefault();
      fontMode = btn.dataset.fontMode;
      const preset = APPEARANCE_PRESETS.find(item => item.id === fontMode);
      if (preset) {
        accentColor = preset.colors.primary;
        customBgColor = preset.colors.bg;
        titleFont = preset.title;
        bodyFont = preset.body;
      }
      applyTheme();
      renderAll();
    });
  });
  const saveBtn = root.querySelector('[data-appearance-save]');
  if (saveBtn) {
    saveBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      appearanceSnapshot = null;
      appearanceOpen = false;
      renderProfile();
      showDayToast('Aparencia salva');
    });
  }
  const cancelBtn = root.querySelector('[data-appearance-cancel]');
  if (cancelBtn) {
    cancelBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      if (appearanceSnapshot) {
        darkTheme = appearanceSnapshot.darkTheme;
        fontMode = appearanceSnapshot.fontMode;
        accentColor = appearanceSnapshot.accentColor;
        customBgColor = appearanceSnapshot.customBgColor;
        titleFont = appearanceSnapshot.titleFont;
        bodyFont = appearanceSnapshot.bodyFont;
        applyTheme();
      }
      appearanceSnapshot = null;
      appearanceOpen = false;
      renderAll();
      showDayToast('Aparencia restaurada');
    });
  }
}

function setThemeVar(name, value) {
  document.documentElement.style.setProperty(name, value);
  document.body.style.setProperty(name, value);
}

function softColor(color) {
  return `color-mix(in srgb, ${color} 13%, #ffffff)`;
}

function updatePriorityPalette(colors) {
  PRIORITY.alta.color = colors.alta;
  PRIORITY.alta.bg = softColor(colors.alta);
  PRIORITY['média'].color = colors.media;
  PRIORITY['média'].bg = softColor(colors.media);
  PRIORITY.baixa.color = colors.baixa;
  PRIORITY.baixa.bg = softColor(colors.baixa);
}

const PRIORITY_ORDER = ['baixa', 'média', 'alta'];

function priorityLevel(priority) {
  return Math.max(1, PRIORITY_ORDER.indexOf(priority) + 1);
}

function cyclePriority() {
  const current = PRIORITY_ORDER.indexOf(newPriority);
  newPriority = PRIORITY_ORDER[(current + 1) % PRIORITY_ORDER.length] || 'baixa';
  buildAddTaskModal();
}

function getAccentTextColor(color) {
  const hex = color.replace('#', '').trim();
  const normalized = hex.length === 3
    ? hex.split('').map(char => char + char).join('')
    : hex;
  const value = parseInt(normalized, 16);
  if (Number.isNaN(value)) return '#FFFFFF';
  const r = (value >> 16) & 255;
  const g = (value >> 8) & 255;
  const b = value & 255;
  const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return luminance > 0.62 ? '#111110' : '#FFFFFF';
}

function applyTheme() {
  document.body.classList.toggle('dark', darkTheme);
  const selectedPreset = APPEARANCE_PRESETS.find(preset => preset.id === fontMode) || APPEARANCE_PRESETS[0];
  fontMode = selectedPreset.id;
  const colors = {
    ...selectedPreset.colors,
    bg: customBgColor || selectedPreset.colors.bg,
    primary: accentColor || selectedPreset.colors.primary,
  };
  const accentText = getAccentTextColor(colors.primary);
  setThemeVar('--bg', colors.bg);
  setThemeVar('--surface', `color-mix(in srgb, ${colors.bg} 36%, #ffffff)`);
  setThemeVar('--ink', colors.primary);
  setThemeVar('--ink-mid', colors.secondary);
  setThemeVar('--ink-faint', colors.secondary);
  setThemeVar('--ink-ghost', colors.divider);
  setThemeVar('--rule', colors.divider);
  setThemeVar('--deep', `color-mix(in srgb, ${colors.bg} 82%, ${colors.divider})`);
  setThemeVar('--accent', colors.primary);
  setThemeVar('--accent-text', accentText);
  setThemeVar('--day-selected', colors.day);
  setThemeVar('--day-selected-text', getAccentTextColor(colors.day));
  setThemeVar('--tabbar', colors.tab);
  setThemeVar('--tabbar-text', getAccentTextColor(colors.tab));
  setThemeVar('--red', colors.alta);
  setThemeVar('--red-soft', softColor(colors.alta));
  setThemeVar('--amber', colors.media);
  setThemeVar('--amb-soft', softColor(colors.media));
  setThemeVar('--green', colors.baixa);
  setThemeVar('--grn-soft', softColor(colors.baixa));
  updatePriorityPalette(colors);
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', colors.tab);
  document.documentElement.style.setProperty('--serif', titleFont || selectedPreset.title);
  document.documentElement.style.setProperty('--mono', bodyFont || selectedPreset.body);
  document.getElementById('app').dataset.theme = fontMode;
  localStorage.setItem('fd-theme', darkTheme ? 'dark' : 'light');
  localStorage.setItem('fd-accent', accentColor);
  localStorage.setItem('fd-font-mode', fontMode);
  localStorage.setItem('fd-bg-color', customBgColor);
  localStorage.setItem('fd-title-font', titleFont);
  localStorage.setItem('fd-body-font', bodyFont);
}

function handleProfileAction(action) {
  if (action === 'appearance') {
    appearanceOpen = !appearanceOpen;
    if (appearanceOpen) {
      appearanceSnapshot = { darkTheme, fontMode, accentColor, customBgColor, titleFont, bodyFont };
    } else if (appearanceSnapshot) {
      appearanceSnapshot = null;
    }
    renderProfile();
    return;
  }

  if (action === 'notifications') {
    if (!('Notification' in window)) {
      showDayToast('Notificacoes indisponiveis');
      return;
    }
    if (Notification.permission === 'granted') {
      showDayToast('Notificacoes ativas');
      scheduleNotifications();
      renderProfile();
      return;
    }
    if (Notification.permission === 'denied') {
      showDayToast('Notificacoes bloqueadas');
      renderProfile();
      return;
    }
    Notification.requestPermission().then(permission => {
      showDayToast(permission === 'granted' ? 'Notificacoes ativas' : 'Notificacoes desativadas');
      scheduleNotifications();
      renderProfile();
    });
    return;
  }

  if (action === 'update') {
    showDayToast('Verificando atualização...');
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistration().then(reg => {
        if (!reg) { location.reload(); return; }
        let refreshing = false;
        const reload = () => {
          if (refreshing) return;
          refreshing = true;
          location.reload();
        };
        navigator.serviceWorker.addEventListener('controllerchange', reload, { once: true });
        reg.update().then(updatedReg => {
          const waitingWorker = updatedReg.waiting || reg.waiting;
          if (waitingWorker) {
            waitingWorker.postMessage({ type: 'SKIP_WAITING' });
            window.setTimeout(reload, 900);
            return;
          }
          showDayToast('App já está atualizado');
          window.setTimeout(reload, 700);
        }).catch(() => location.reload());
      });
    } else {
      location.reload();
    }
    return;
  }

  if (action === 'account') {
    window.alert('Ana Rodrigues\nana@email.com');
    return;
  }

  if (action === 'logout') {
    if (!window.confirm('Sair e limpar os dados salvos neste aparelho?')) return;
    localStorage.removeItem('fd-tasks');
    localStorage.removeItem('fd-habits');
    localStorage.removeItem('fd-projects');
    tasks = [];
    habits = [];
    PROJECTS.splice(0, PROJECTS.length);
    renderAll();
    showDayToast('Sessao encerrada');
  }
}

let activeSubpanel = null;
let newTaskNotes = '';

function buildAddTaskModal() {
  const isEditing = editingTaskId !== null;
  setupTaskSheetEvents();

  // date label in header
  const dateText = document.getElementById('task-sheet-date-text');
  if (dateText) {
    if (newTaskDate) {
      const d = parseDateKey(newTaskDate);
      dateText.textContent = d.toLocaleDateString('pt-BR', { weekday:'short', day:'numeric', month:'long', year:'numeric' });
    } else {
      dateText.textContent = 'Sem data';
    }
  }

  // done check button
  const checkBtn = document.getElementById('task-sheet-check-btn');
  if (checkBtn) {
    if (isEditing) {
      const t = tasks.find(t => t.id === editingTaskId);
      const isDone = t?.done || false;
      checkBtn.className = 'task-sheet-check-btn' + (isDone ? ' done' : '');
      checkBtn.textContent = isDone ? '✓' : '';
      checkBtn.style.display = '';
      checkBtn.onclick = () => { if (t) { t.done = !t.done; buildAddTaskModal(); } };
    } else {
      checkBtn.style.display = 'none';
    }
  }

  // notes
  const notesEl = document.getElementById('task-notes-input');
  if (notesEl && notesEl.value === '' && newTaskNotes) notesEl.value = newTaskNotes;
  if (notesEl) notesEl.oninput = () => { newTaskNotes = notesEl.value; };

  // subtasks
  const subList = document.getElementById('task-subtasks-list');
  if (subList) {
    subList.innerHTML = newSubtasks.map((s, i) => `
      <div class="task-sub-item">
        <span class="task-sub-bullet"></span>
        <span class="task-sub-title">${escapeHTML(typeof s === 'string' ? s : s.title)}</span>
        <button data-remove-sub="${i}" type="button">REMOVER</button>
      </div>`).join('');
    subList.querySelectorAll('[data-remove-sub]').forEach(btn => {
      btn.onclick = () => { newSubtasks.splice(parseInt(btn.dataset.removeSub), 1); buildAddTaskModal(); };
    });
  }
  const subInput = document.getElementById('task-subtask-input');
  const addSubtaskFromInput = () => {
    if (!subInput) return;
    const v = subInput.value.trim();
    if (!v) return;
    newSubtasks.push({ title: v, done: false });
    subInput.value = '';
    buildAddTaskModal();
    document.getElementById('task-subtask-input')?.focus();
  };
  if (subInput && !subInput._bound) {
    subInput._bound = true;
    subInput.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      addSubtaskFromInput();
    });
  }
  const subAdd = document.getElementById('task-subtask-add');
  if (subAdd && !subAdd._bound) {
    subAdd._bound = true;
    subAdd.addEventListener('click', addSubtaskFromInput);
  }

  // toolbar labels
  const PRIORITY_LABELS = { baixa:'Baixa', média:'Média', alta:'Alta' };
  const el = id => document.getElementById(id);
  if (el('tbr-datetime-label')) {
    el('tbr-datetime-label').textContent = newTaskDate
      ? (newTaskTime || parseDateKey(newTaskDate).toLocaleDateString('pt-BR',{day:'numeric',month:'short'}))
      : 'Data';
  }
  if (el('tbr-priority-label')) el('tbr-priority-label').textContent = PRIORITY_LABELS[newPriority] || 'Prior.';
  if (el('tbr-repeat-label')) el('tbr-repeat-label').textContent = REPEAT_OPTIONS.find(o=>o.id===newRepeat)?.label || 'Nunca';
  const proj = PROJECTS.find(p=>p.id===newProjectId);
  if (el('tbr-project-label')) el('tbr-project-label').textContent = proj ? proj.name : 'Projeto';

  // active toolbar states
  ['tbr-datetime','tbr-priority','tbr-repeat','tbr-project'].forEach(id => {
    const b = el(id);
    if (b) b.classList.toggle('active', activeSubpanel === id.replace('tbr-',''));
  });

  // submit button
  const titleVal = document.getElementById('new-task-title').value.trim();
  const submitBtn = document.getElementById('submit-task');
  if (submitBtn) {
    submitBtn.textContent = isEditing ? 'SALVAR' : 'CRIAR';
    submitBtn.className = 'task-sheet-submit' + (titleVal ? ' ready' : '');
  }

  buildSubpanel();
}

function buildSubpanel() {
  const panel = document.getElementById('task-sheet-subpanel');
  if (!panel) return;
  if (!activeSubpanel) { panel.innerHTML = ''; return; }

  if (activeSubpanel === 'datetime') {
    panel.innerHTML = `
      <div class="tsp-datetime">
        <div class="tsp-row">
          <input type="date" id="tsp-date-input" value="${newTaskDate || ''}"/>
          <button class="tsp-clear-btn" id="tsp-date-clear">Sem data</button>
        </div>
        <div class="tsp-row">
          <input type="time" id="tsp-time-input" value="${newTaskTime || ''}"/>
          <button class="tsp-clear-btn" id="tsp-time-clear">Sem hora</button>
        </div>
      </div>`;
    panel.querySelector('#tsp-date-input').onchange = e => {
      newTaskDate = e.target.value || null;
      newHasDate = !!newTaskDate;
      if (newTaskDate) ensureDateInWeek(newTaskDate);
      buildAddTaskModal();
    };
    panel.querySelector('#tsp-time-input').onchange = e => { newTaskTime = e.target.value; buildAddTaskModal(); };
    panel.querySelector('#tsp-date-clear').onclick = () => { newTaskDate = null; newHasDate = false; buildAddTaskModal(); };
    panel.querySelector('#tsp-time-clear').onclick = () => { newTaskTime = ''; buildAddTaskModal(); };
  }
  else if (activeSubpanel === 'priority') {
    const pc = PRIORITY[newPriority] || PRIORITY.baixa;
    const level = priorityLevel(newPriority);
    panel.innerHTML = `
      <button type="button" class="priority-stepper" id="priority-stepper" style="--priority-color:${pc.color}">
        <div class="priority-stepper-meter">
          ${[1,2,3].map(i => `<span class="${i <= level ? 'on' : ''}"></span>`).join('')}
        </div>
        <div class="priority-stepper-label">
          <span>${pc.label}</span>
          <small>TOCAR PARA AUMENTAR</small>
        </div>
      </button>`;
    panel.querySelector('#priority-stepper').onclick = cyclePriority;
  }
  else if (activeSubpanel === 'repeat') {
    panel.innerHTML = `<div class="tsp-repeat">${REPEAT_OPTIONS.map(o => `
      <button class="tsp-repeat-btn ${newRepeat===o.id?'active':''}" data-r="${o.id}">${o.label}</button>
    `).join('')}</div>`;
    panel.querySelectorAll('[data-r]').forEach(btn => {
      btn.onclick = () => { newRepeat = btn.dataset.r; buildAddTaskModal(); };
    });
  }
  else if (activeSubpanel === 'project') {
    panel.innerHTML = `<div class="tsp-project">
      <select id="tsp-project-select">
        <option value="">Sem projeto</option>
        ${PROJECTS.map(p=>`<option value="${p.id}" ${p.id===newProjectId?'selected':''}>${p.name}</option>`).join('')}
      </select></div>`;
    panel.querySelector('#tsp-project-select').onchange = e => {
      newProjectId = e.target.value ? parseInt(e.target.value) : null;
      buildAddTaskModal();
    };
  }
}

function setupTaskSheetEvents() {
  const close = document.getElementById('task-sheet-close-btn');
  if (close && !close._bound) {
    close._bound = true;
    close.onclick = () => { activeSubpanel = null; closeModal('modal-add-task'); };
  }
  ['tbr-datetime','tbr-priority','tbr-repeat','tbr-project'].forEach(id => {
    const btn = document.getElementById(id);
    if (btn && !btn._bound) {
      btn._bound = true;
      const key = id.replace('tbr-','');
      btn.onclick = () => {
        if (key === 'priority') {
          activeSubpanel = 'priority';
          cyclePriority();
          return;
        }
        activeSubpanel = activeSubpanel === key ? null : key;
        buildAddTaskModal();
      };
    }
  });
  const titleEl = document.getElementById('new-task-title');
  if (titleEl && !titleEl._bound) {
    titleEl._bound = true;
    titleEl.addEventListener('input', buildAddTaskModal);
  }
}

document.getElementById('submit-task').addEventListener('click', () => {
  const title = document.getElementById('new-task-title').value.trim();
  if (!title) return;
  let changedTask = null;
  if (editingTaskId) {
    const t = tasks.find(t => t.id === editingTaskId);
    if (t) {
      t.title = title;
      t.notes = newTaskNotes;
      t.priority = newPriority;
      t.projectId = newProjectId;
      t.time = newTaskTime;
      t.date = newTaskDate;
      t.repeat = newRepeat;
      t.subtasks = newSubtasks;
      if (newTaskDate) ensureDateInWeek(newTaskDate);
      changedTask = t;
    }
  } else {
    if (newTaskDate) ensureDateInWeek(newTaskDate);
    changedTask = {
      id: Date.now(),
      title,
      notes: newTaskNotes,
      done: false,
      priority: newPriority,
      projectId: newProjectId,
      time: newTaskTime,
      date: newTaskDate,
      repeat: newRepeat,
      subtasks: newSubtasks,
      attachments: [],
    };
    tasks.push(changedTask);
  }
  document.getElementById('new-task-title').value = '';
  const notesEl = document.getElementById('task-notes-input');
  if (notesEl) notesEl.value = '';
  activeSubpanel = null;
  editingTaskId = null;
  newRepeat = 'nenhuma';
  newSubtasks = [];
  newTaskNotes = '';
  closeModal('modal-add-task');
  saveState();
  renderAll();
  if (changedTask) requestNotificationsForTask(changedTask);
});

function startEditTask(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  editingTaskId = id;
  newPriority = t.priority;
  newProjectId = t.projectId ?? null;
  newTaskDate = t.date;
  newTaskTime = t.time || '';
  newRepeat = t.repeat || 'nenhuma';
  newSubtasks = (t.subtasks || []).map(s => typeof s === 'string' ? { title: s, done: false } : { ...s });
  newTaskNotes = t.notes || '';
  activeSubpanel = null;
  document.getElementById('new-task-title').value = t.title;
  const notesEl = document.getElementById('task-notes-input');
  if (notesEl) notesEl.value = newTaskNotes;
  closeModal('modal-task-detail');
  buildAddTaskModal();
  openModal('modal-add-task');
}

// ─── ADD HABIT MODAL ──────────────────────────────────────────────────────────
function buildColorSwatches() {
  const input = document.getElementById('habit-color-input');
  const value = document.getElementById('habit-color-value');
  if (!input || !value) return;
  input.value = newHabitColor;
  value.textContent = newHabitColor.toUpperCase();
  input.oninput = () => {
    newHabitColor = input.value;
    value.textContent = newHabitColor.toUpperCase();
  };
}

function buildProjectColorSwatches() {
  const input = document.getElementById('project-color-input');
  const value = document.getElementById('project-color-value');
  if (!input || !value) return;
  input.value = newProjectColor;
  value.textContent = newProjectColor.toUpperCase();
  input.oninput = () => {
    newProjectColor = input.value;
    value.textContent = newProjectColor.toUpperCase();
  };
}

document.getElementById('new-habit-name').addEventListener('input', () => {
  const ready = document.getElementById('new-habit-name').value.trim();
  document.getElementById('submit-habit').className = `modal-submit ${ready?'ready':''}`;
});

document.getElementById('submit-habit').addEventListener('click', () => {
  const name = document.getElementById('new-habit-name').value.trim();
  if (!name) return;
  const habitColorInput = document.getElementById('habit-color-input');
  if (habitColorInput) newHabitColor = habitColorInput.value;
  const reminderTime = (document.getElementById('new-habit-reminder').value || '').trim();
  if (editingHabitId) {
    const h = habits.find(h => h.id === editingHabitId);
    if (h) {
      h.name = name;
      h.goal = document.getElementById('new-habit-goal').value.trim();
      h.cue = document.getElementById('new-habit-cue').value.trim();
      h.color = newHabitColor;
      h.reminderTime = reminderTime || null;
    }
  } else {
    habits.push({
      id: Date.now(),
      name,
      goal: document.getElementById('new-habit-goal').value.trim(),
      cue:  document.getElementById('new-habit-cue').value.trim(),
      color: newHabitColor,
      reminderTime: reminderTime || null,
      streak: 0,
      week: Array(7).fill(null),
      heatmap: makeHeatmap(0),
    });
  }
  document.getElementById('new-habit-name').value = '';
  document.getElementById('new-habit-goal').value = '';
  document.getElementById('new-habit-cue').value  = '';
  document.getElementById('new-habit-reminder').value = '';
  editingHabitId = null;
  document.getElementById('submit-habit').textContent = 'CRIAR HÁBITO';
  closeModal('modal-add-habit');
  saveState();
  renderAll();
});

document.getElementById('new-project-name').addEventListener('input', () => {
  const ready = document.getElementById('new-project-name').value.trim();
  document.getElementById('submit-project').className = `modal-submit ${ready?'ready':''}`;
});

document.getElementById('submit-project').addEventListener('click', () => {
  const name = document.getElementById('new-project-name').value.trim();
  if (!name) return;
  const colorInput = document.getElementById('project-color-input');
  if (colorInput) newProjectColor = colorInput.value;
  if (editingProjectId) {
    const p = PROJECTS.find(x => x.id === editingProjectId);
    if (p) { p.name = name; p.dot = newProjectColor; }
    editingProjectId = null;
  } else {
    PROJECTS.push({ id: Date.now(), name, dot: newProjectColor });
    newProjectId = PROJECTS[PROJECTS.length - 1].id;
  }
  document.getElementById('new-project-name').value = '';
  document.getElementById('submit-project').textContent = 'CRIAR PROJETO';
  document.getElementById('submit-project').className = 'modal-submit';
  closeModal('modal-add-project');
  saveState();
  renderAll();
});

function startEditHabit(id) {
  const h = habits.find(h => h.id === id);
  if (!h) return;
  editingHabitId = id;
  newHabitColor = h.color;
  document.getElementById('new-habit-name').value = h.name;
  document.getElementById('new-habit-goal').value = h.goal || '';
  document.getElementById('new-habit-cue').value = h.cue || '';
  document.getElementById('new-habit-reminder').value = h.reminderTime || '';
  document.getElementById('submit-habit').textContent = 'SALVAR';
  document.getElementById('submit-habit').className = 'modal-submit ready';
  buildColorSwatches();
  closeModal('modal-habit-detail');
  openModal('modal-add-habit');
}

function deleteHabit(id, ask = true) {
  const h = habits.find(h => h.id === id);
  if (!h) return;
  if (ask && !confirmDelete(`o hábito "${h.name}"`)) return;
  habits = habits.filter(habit => habit.id !== id);
  closeModal('modal-habit-detail');
  saveState();
  renderAll();
  showDayToast('Habito excluido');
}

// ─── MODAL HELPERS ────────────────────────────────────────────────────────────
function openModal(id) {
  const overlay = document.getElementById(id);
  overlay.classList.add('open');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

function vibrateSoft(pattern = [8]) {
  if (!('vibrate' in navigator)) return;
  try { navigator.vibrate(pattern); } catch(e) {}
}

function finishLoadingBadge() {
  const badge = document.getElementById('loading-badge');
  if (!badge) return;
  window.setTimeout(() => vibrateSoft([4]), 980);
  window.setTimeout(() => {
    badge.classList.add('done');
    window.setTimeout(() => badge.remove(), 560);
  }, 1480);
}

// close on overlay click
['modal-add-task','modal-add-habit','modal-task-detail','modal-habit-detail','modal-add-project'].forEach(id => {
  const overlay = document.getElementById(id);
  overlay.addEventListener('click', e => {
    if (e.target !== overlay) return;
    if (id === 'modal-add-habit' && editingHabitId) {
      document.getElementById('submit-habit').click();
      return;
    }
    if (id === 'modal-add-task') {
      const title = document.getElementById('new-task-title').value.trim();
      if (title) { document.getElementById('submit-task').click(); return; }
      activeSubpanel = null;
    }
    closeModal(id);
  });
});

// ─── FAB ─────────────────────────────────────────────────────────────────────
function openNewTaskSheet() {
  if (currentNav !== 'hoje') {
    currentNav = 'hoje';
    currentView = 'dia';
    buildNav();
    buildViewToggle();
    updateHeader();
    renderAll();
  }
  newPriority = 'média'; newProjectId = null; newHasDate = false;
  newTaskDate = null;
  newTaskTime = '';
  newRepeat = 'nenhuma';
  newSubtasks = [];
  newTaskNotes = '';
  activeSubpanel = null;
  editingTaskId = null;
  document.getElementById('new-task-title').value = '';
  const notesEl2 = document.getElementById('task-notes-input');
  if (notesEl2) notesEl2.value = '';
  buildAddTaskModal();
  openModal('modal-add-task');
}

document.getElementById('fab').addEventListener('click', () => {
  if (currentNav === 'hoje') {
    openNewTaskSheet();
  } else if (currentNav === 'habitos') {
    editingHabitId = null;
    document.getElementById('new-habit-name').value = '';
    document.getElementById('new-habit-goal').value = '';
    document.getElementById('new-habit-cue').value = '';
    document.getElementById('new-habit-reminder').value = '';
    document.getElementById('submit-habit').textContent = 'CRIAR HÁBITO';
    document.getElementById('submit-habit').className = 'modal-submit';
    newHabitColor = '#B07D2A';
    buildColorSwatches();
    openModal('modal-add-habit');
  } else if (currentNav === 'projetos') {
    newProjectColor = COLORS[PROJECTS.length % COLORS.length];
    document.getElementById('new-project-name').value = '';
    document.getElementById('submit-project').className = 'modal-submit';
    buildProjectColorSwatches();
    openModal('modal-add-project');
  }
});

// ─── INIT ────────────────────────────────────────────────────────────────────
loadState();
normalizeHabits();
applyTheme();
buildNav();
rebuildCurrentWeekDates();
buildWeekStrip();
buildViewToggle();
updateHeader();
setupCalendarSwipe();
setupScrollOverflow();
setupCommandPalette();
buildColorSwatches();
buildProjectColorSwatches();
renderAll();
finishLoadingBadge();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveState();
  if (document.visibilityState === 'visible') scheduleNotifications();
});
window.addEventListener('pagehide', saveState);
</script>
