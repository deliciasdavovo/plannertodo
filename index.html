<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>FlowDo</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#111110"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="FlowDo"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #F5F4F0;
    --surface:  #FFFFFF;
    --ink:      #111110;
    --ink-mid:  #5A5A55;
    --ink-faint:#B0AFA8;
    --ink-ghost:#D8D7D0;
    --rule:     #E2E1DA;
    --deep:     #EDECE8;
    --red:      #C84B2F;
    --red-soft: #F5EDE9;
    --amber:    #B07D2A;
    --amb-soft: #F5F0E6;
    --green:    #2A6E4A;
    --grn-soft: #E6F0EB;
    --blue:     #2A5FA3;
    --serif:    'Instrument Serif', serif;
    --mono:     'DM Mono', monospace;
  }

  html, body {
    height: 100%;
    background: #CCC;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
  }

  /* ── PHONE SHELL ── */
  #app {
    width: 390px;
    height: 844px;
    background: var(--bg);
    border-radius: 44px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 32px 80px rgba(0,0,0,0.28);
    flex-shrink: 0;
  }

  /* ── STATUS BAR ── */
  #status-bar {
    display: flex;
    justify-content: space-between;
    padding: 14px 24px 0;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-mid);
    flex-shrink: 0;
  }

  /* ── HEADER ── */
  #header {
    padding: 14px 20px 0;
    flex-shrink: 0;
  }
  #header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 8px;
  }
  .page-sub {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .page-title {
    font-family: var(--serif);
    font-size: 31px;
    font-weight: 400;
    color: var(--ink);
    line-height: 1;
    margin-top: 3px;
  }
  #task-count {
    text-align: right;
  }
  #task-count .count-num {
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 400;
    color: var(--ink);
    line-height: 1;
  }
  #task-count .count-num span { font-size: 14px; color: var(--ink-faint); }
  #task-count .count-label {
    font-size: 9px;
    color: var(--ink-faint);
    letter-spacing: 0.6px;
    margin-top: 2px;
  }

  /* ── PROGRESS BAR ── */
  .progress-bar {
    height: 1.5px;
    background: var(--rule);
    margin-bottom: 0;
  }
  .progress-fill {
    height: 100%;
    background: var(--ink);
    border-radius: 1px;
    transition: width 0.5s ease;
  }

  /* ── VIEW TOGGLE ── */
  .view-toggle {
    display: flex;
    background: var(--deep);
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 14px;
  }
  .view-toggle button {
    flex: 1;
    padding: 7px 0;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--mono);
    letter-spacing: 0.5px;
    transition: all 0.15s;
  }
  .view-toggle button.active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  /* ── WEEK STRIP ── */
  #week-strip {
    display: flex;
    gap: 2px;
    padding: 12px 20px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  #week-strip::-webkit-scrollbar { display: none; }
  .day-btn {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 9px 10px;
    border-radius: 11px;
    border: none;
    cursor: pointer;
    background: transparent;
    min-width: 38px;
    transition: background 0.15s;
  }
  .day-btn.active { background: var(--ink); }
  .day-letter {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .day-btn.active .day-letter { color: rgba(255,255,255,0.45); }
  .day-num {
    font-family: var(--serif);
    font-size: 15px;
    color: var(--ink-mid);
  }
  .day-btn.today .day-num { color: var(--ink); }
  .day-btn.active .day-num { color: #fff; }
  .day-dot {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--red);
  }

  /* ── SCROLL CONTENT ── */
  #content {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: none;
  }
  #content::-webkit-scrollbar { display: none; }

  /* ── SCREENS ── */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ── TASK LIST ── */
  .task-list { padding: 0 20px; }
  .section-label {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 16px 0 6px;
  }

  .task-row {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    transition: opacity 0.2s, transform 0.25s ease;
    position: relative;
    touch-action: pan-y;
    user-select: none;
  }
  .task-row.done { opacity: 0.38; }
  .task-row.dragging {
    transition: none;
    z-index: 2;
  }
  .task-row.drag-ready {
    transform: scale(0.985);
    opacity: 0.9;
  }

  .drag-hint {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 9.5px;
    font-weight: 700;
    color: var(--amber);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.1s;
    white-space: nowrap;
  }
  .drag-hint.left { right: -4px; }
  .drag-hint.right { left: -4px; }

  .day-shift-toast {
    position: absolute;
    left: 50%;
    bottom: 146px;
    transform: translateX(-50%) translateY(8px);
    background: var(--ink);
    color: #fff;
    border-radius: 10px;
    padding: 9px 13px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.16s ease, transform 0.16s ease;
    z-index: 30;
    box-shadow: 0 10px 26px rgba(17,17,16,0.18);
  }
  .day-shift-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .tick-btn {
    width: 20px; height: 20px;
    border-radius: 5px;
    border: 1.5px solid var(--ink-ghost);
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .tick-btn.checked {
    border-color: var(--check-color, var(--ink));
    background: var(--check-color, var(--ink));
  }
  .tick-btn svg { display: none; }
  .tick-btn.checked svg { display: block; }

  .task-body { flex: 1; min-width: 0; }
  .task-title {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 400;
    color: var(--ink);
    line-height: 1.35;
  }
  .task-row.done .task-title { text-decoration: line-through; }
  .task-meta {
    display: flex;
    gap: 10px;
    margin-top: 5px;
    align-items: center;
    flex-wrap: wrap;
  }
  .meta-proj {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10.5px;
    color: var(--ink-mid);
    font-weight: 500;
  }
  .proj-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .meta-time, .meta-nodate, .meta-sub {
    font-size: 10.5px;
    color: var(--ink-faint);
  }
  .meta-nodate { font-style: italic; font-size: 10px; }
  .priority-badge {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .priority-dot { width: 4px; height: 4px; border-radius: 50%; }

  /* ── RESCHEDULE ── */
  .reschedule-panel {
    background: var(--deep);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 4px;
    border: 1px solid var(--rule);
  }
  .reschedule-panel .panel-label {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  .reschedule-dates {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .reschedule-dates button {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1.5px solid var(--rule);
    background: var(--surface);
    color: var(--ink-mid);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--mono);
    transition: all 0.12s;
  }
  .reschedule-dates button:hover {
    border-color: var(--ink);
    color: var(--ink);
  }
  .reschedule-dates button.cancel {
    background: transparent;
    color: var(--ink-faint);
    border-color: var(--rule);
  }

  /* ── MONTH CALENDAR ── */
  .month-view { padding: 0 20px; }
  .month-day-headers {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
  }
  .month-day-headers span {
    flex: 1;
    text-align: center;
    font-size: 9px;
    font-weight: 700;
    color: var(--ink-faint);
  }
  .month-week { display: flex; gap: 4px; margin-bottom: 4px; }
  .month-cell {
    flex: 1;
    aspect-ratio: 1;
    border-radius: 8px;
    background: var(--deep);
    border: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .month-cell.empty { background: transparent; border-color: transparent; }
  .month-cell.today { background: var(--ink); border-color: var(--ink); }
  .month-cell .cell-num {
    font-size: 10px;
    font-weight: 400;
    color: var(--ink-mid);
    line-height: 1;
  }
  .month-cell.today .cell-num { color: #fff; font-weight: 700; }
  .cell-dots { display: flex; gap: 2px; }
  .cell-dot { width: 4px; height: 4px; border-radius: 50%; }
  .month-legend {
    display: flex;
    gap: 14px;
    margin-top: 12px;
    justify-content: flex-end;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 9.5px;
    color: var(--ink-faint);
  }
  .legend-dot { width: 6px; height: 6px; border-radius: 50%; }

  /* ── HABITS ── */
  .habits-list { padding: 0 16px; }
  .habits-summary {
    padding: 0 20px 16px;
    font-size: 11px;
    color: var(--ink-faint);
  }

  .habit-card {
    background: var(--surface);
    border-radius: 18px;
    padding: 16px 18px;
    margin-bottom: 10px;
    border: 1px solid var(--rule);
    cursor: pointer;
  }
  .habit-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }
  .habit-check {
    width: 26px; height: 26px;
    border-radius: 8px;
    border: 1.5px solid var(--ink-ghost);
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .habit-check.done {
    border-color: var(--habit-color);
    background: var(--habit-color);
  }
  .habit-check svg { display: none; }
  .habit-check.done svg { display: block; }
  .habit-info { flex: 1; }
  .habit-name {
    font-family: var(--serif);
    font-size: 15px;
    color: var(--ink);
    line-height: 1.3;
  }
  .habit-cue {
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 4px;
  }
  .habit-streak { text-align: right; flex-shrink: 0; }
  .streak-num {
    font-family: var(--serif);
    font-size: 20px;
    color: var(--habit-color);
    line-height: 1;
  }
  .streak-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 1px;
  }

  /* week grid */
  .week-grid { display: flex; gap: 5px; }
  .week-cell-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .week-cell {
    width: 100%;
    height: 26px;
    border-radius: 6px;
    background: var(--deep);
    border: 1px solid transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .week-cell[data-habit-day] { cursor: pointer; }
  .month-cell:not(.empty) { cursor: pointer; }
  .month-cell:not(.empty):hover { opacity: 0.8; }
  .week-cell.done { background: var(--habit-color); }
  .week-cell.today-cell { border-color: var(--ink-ghost); }
  .week-cell.future { opacity: 0.3; }
  .week-cell-label {
    font-size: 8.5px;
    font-weight: 700;
    color: var(--ink-faint);
  }
  .week-cell-label.today-label { color: var(--ink-mid); }
  .week-cell-dash { width: 6px; height: 1.5px; background: var(--ink-ghost); border-radius: 1px; }

  /* heatmap */
  .heatmap { width: 100%; }
  .heatmap-header {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
  }
  .heatmap-header-spacer { width: 38px; flex-shrink: 0; }
  .heatmap-header span {
    flex: 1;
    text-align: center;
    font-size: 8.5px;
    font-weight: 700;
    color: var(--ink-faint);
  }
  .heatmap-row {
    display: flex;
    gap: 4px;
    margin-bottom: 4px;
    align-items: center;
  }
  .heatmap-week-label {
    width: 38px;
    font-size: 8.5px;
    color: var(--ink-faint);
    flex-shrink: 0;
  }
  .heatmap-cell {
    flex: 1;
    aspect-ratio: 1;
    border-radius: 4px;
    background: var(--deep);
    border: 1px solid transparent;
  }
  .heatmap-cell.done {
    background: var(--habit-color);
    border-color: color-mix(in srgb, var(--habit-color) 40%, transparent);
  }
  .heatmap-cell.missed { opacity: 0.4; }
  .heatmap-cell.future { opacity: 0.2; }

  /* add habit btn */
  .add-habit-btn {
    width: 100%;
    padding: 14px 0;
    border-radius: 14px;
    border: 1.5px dashed var(--ink-ghost);
    background: transparent;
    color: var(--ink-faint);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    font-family: var(--mono);
    margin-bottom: 90px;
    transition: border-color 0.15s, color 0.15s;
  }
  .add-habit-btn:hover { border-color: var(--ink-mid); color: var(--ink-mid); }
  .habit-card.dragging { transition: none; }
  .habit-card.drag-ready { transform: scale(0.985); opacity: 0.9; }

  /* mensal habit cards */
  .habit-month-card {
    background: var(--surface);
    border-radius: 18px;
    padding: 16px 18px;
    margin-bottom: 10px;
    border: 1px solid var(--rule);
  }
  .habit-month-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .habit-month-dot { width: 10px; height: 10px; border-radius: 50%; }
  .habit-month-name {
    font-family: var(--serif);
    font-size: 15px;
    color: var(--ink);
  }
  .habit-month-streak {
    margin-left: auto;
    font-family: var(--serif);
    font-size: 14px;
  }

  /* ── PROJECTS ── */
  .projects-view { padding: 0 20px; }
  .project-block {
    padding-bottom: 26px;
    margin-bottom: 26px;
    border-bottom: 1px solid var(--rule);
  }
  .project-block:last-child { border-bottom: none; }
  .project-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .project-name-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .project-dot { width: 7px; height: 7px; border-radius: 50%; }
  .project-name {
    font-family: var(--serif);
    font-size: 19px;
    color: var(--ink);
  }
  .project-count { font-size: 11px; color: var(--ink-faint); }
  .project-bar { height: 2px; background: var(--rule); border-radius: 1px; margin-bottom: 14px; }
  .project-bar-fill { height: 100%; border-radius: 1px; transition: width 0.6s ease; }
  .project-task {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--rule);
  }
  .project-task.done { opacity: 0.32; }
  .project-task-dot { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; }
  .project-task-title {
    font-family: var(--serif);
    font-size: 13.5px;
    color: var(--ink-mid);
  }
  .project-task.done .project-task-title { text-decoration: line-through; }
  .project-task-nodate {
    margin-left: auto;
    font-size: 9.5px;
    color: var(--ink-faint);
  }

  /* ── PROFILE ── */
  .profile-view { padding: 4px 20px 0; }
  .profile-avatar {
    width: 56px; height: 56px;
    border-radius: 18px;
    background: var(--ink);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-size: 22px;
    color: #fff;
  }
  .profile-name {
    font-family: var(--serif);
    font-size: 22px;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .profile-email { font-size: 11px; color: var(--ink-faint); margin-bottom: 26px; }
  .profile-items { border-top: 1px solid var(--rule); }
  .profile-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 0;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    font-family: var(--serif);
    font-size: 15px;
    color: var(--ink-mid);
  }
  .profile-item.danger { color: var(--red); }
  .profile-item svg { flex-shrink: 0; }

  /* ── FAB ── */
  #fab {
    position: absolute;
    right: 20px;
    bottom: 82px;
    width: 50px; height: 50px;
    border-radius: 15px;
    background: var(--ink);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 22px rgba(17,17,16,0.22);
    transition: transform 0.15s;
  }
  #fab:active { transform: scale(0.95); }
  #fab.hidden { display: none; }

  /* ── BOTTOM NAV ── */
  #bottom-nav {
    display: flex;
    gap: 7px;
    background: #111110;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 10px 14px 22px;
    flex-shrink: 0;
    box-shadow: 0 -14px 32px rgba(17,17,16,0.16);
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background: none;
    border: none;
    cursor: pointer;
    min-height: 48px;
    padding: 6px 0 5px;
    border-radius: 14px;
    color: rgba(255,255,255,0.42);
    transition: background 0.15s, color 0.15s, transform 0.15s;
  }
  .nav-btn:active { transform: scale(0.96); }
  .nav-btn.active {
    background: rgba(255,255,255,0.1);
    color: #fff;
  }
  .nav-icon {
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nav-icon svg {
    width: 17px;
    height: 17px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .nav-label {
    font-size: 9.5px;
    font-weight: 700;
    font-family: var(--mono);
    color: currentColor;
    letter-spacing: 0.3px;
  }
  .nav-indicator {
    width: 4px; height: 4px;
    border-radius: 1px;

function saveState() {

    localStorage.setItem('fd-projects', JSON.stringify(PROJECTS));

}

  try {

    if (t) tasks = JSON.parse(t);
    if (h) habits = JSON.parse(h);
    if (p) PROJECTS.splice(0, PROJECTS.length, ...JSON.parse(p));

function clampDay(day) {
  return Math.max(0, Math.min(WEEK_DATES.length - 1, day));
}

function showDayToast(text) {
  const toast = document.getElementById('day-shift-toast');
  if (!toast) return;
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(showDayToast.timer);
  showDayToast.timer = setTimeout(() => toast.classList.remove('show'), 900);
}

function confirmDelete(label) {
  return window.confirm(`Excluir ${label}? Essa ação não pode ser desfeita.`);
}

function setActiveDay(day, options = {}) {
  const nextDay = clampDay(day);
  const changed = nextDay !== activeDay;
  activeDay = nextDay;
  buildWeekStrip();
  updateHeader();
  renderAll();
  const content = document.getElementById('content');
  if (content && currentNav === 'hoje' && currentView === 'semana') content.scrollTop = 0;
  if (options.toast && changed) showDayToast(options.toast);
}

function shiftActiveDay(direction, source = 'scroll') {
  const nextDay = clampDay(activeDay + direction);
  if (nextDay === activeDay) return false;
  const label = `${DAYS_SHORT[nextDay]} ${9 + nextDay}`;
  setActiveDay(nextDay, { toast: source === 'scroll' ? label : `Movida para ${label}` });
  return true;
}

// ─── PROGRESS ────────────────────────────────────────────────────────────────
function canScrollChangeDay() {
  return currentNav === 'hoje' && currentView === 'semana' && !taskDragActive;
}

function lockScrollDay() {
  scrollDayLock = true;
  setTimeout(() => {
    scrollDayLock = false;
    scrollDayAccum = 0;
  }, 360);
}

function attachDayScrollNavigation() {
  const content = document.getElementById('content');
  if (!content) return;

  content.addEventListener('wheel', e => {
    if (!canScrollChangeDay() || scrollDayLock) return;
    scrollDayAccum += e.deltaY;
    if (Math.abs(scrollDayAccum) < 90) return;
    const changed = shiftActiveDay(scrollDayAccum > 0 ? 1 : -1, 'scroll');
    if (changed) {
      e.preventDefault();
      lockScrollDay();
    }
  }, { passive:false });

  let touchStartY = 0;
  let touchStartX = 0;
  content.addEventListener('touchstart', e => {
    if (!canScrollChangeDay()) return;
    touchStartY = e.touches[0].clientY;
    touchStartX = e.touches[0].clientX;
  }, { passive:true });

  content.addEventListener('touchend', e => {
    if (!canScrollChangeDay() || scrollDayLock || !touchStartY) return;
    const t = e.changedTouches[0];
    const dy = t.clientY - touchStartY;
    const dx = t.clientX - touchStartX;
    touchStartY = 0;
    if (Math.abs(dx) > Math.abs(dy) || Math.abs(dy) < 62) return;
    const changed = shiftActiveDay(dy < 0 ? 1 : -1, 'scroll');
    if (changed) lockScrollDay();
  }, { passive:true });
}

function updateProgress() {
  const fill = document.getElementById('main-progress-fill');
  if (currentNav === 'hoje') {
    const dayTasks = tasks.filter(t => t.date === WEEK_DATES[activeDay]);
    const pct = dayTasks.length ? (dayTasks.filter(t=>t.done).length / dayTasks.length)*100 : 0;
    fill.style.width = pct + '%';
  } else if (currentNav === 'habitos') {
    const done = habits.filter(h=>h.week[TODAY_IDX]===true).length;
    const pct = habits.length ? (done/habits.length)*100 : 0;
    fill.style.width = pct + '%';
  }
}

function attachTaskEvents() {
  // tick buttons
  document.querySelectorAll('[data-tick]').forEach(btn => {

function setupDrag(row) {
  let startX = 0, startY = 0, offset = 0, dragging = false, ready = false, moved = false, pressed = false, holdTimer = null;
  const id = row.dataset.id;

  const resetDrag = () => {
    clearTimeout(holdTimer);
    pressed = false;
    ready = false;
    dragging = false;
    taskDragActive = false;
    row.classList.remove('drag-ready','dragging');
    row.style.transform = '';
    row.querySelector('.drag-hint.left').style.opacity = 0;
    row.querySelector('.drag-hint.right').style.opacity = 0;
  };

  row.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    if (row.setPointerCapture) row.setPointerCapture(e.pointerId);
    startX = e.clientX;
    startY = e.clientY;
    offset = 0;
    moved = false;
    pressed = true;
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => {
      ready = true;
      taskDragActive = true;
      row.classList.add('drag-ready');
    }, 170);
  });

  row.addEventListener('pointermove', e => {
    if (!pressed) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dy) > 14 && Math.abs(dy) > Math.abs(dx) && !ready) {
      clearTimeout(holdTimer);
      return;
    }
    if (!ready && Math.abs(dx) < 14) return;
    ready = true;
    dragging = true;
    taskDragActive = true;
    moved = true;
    row.classList.remove('drag-ready');
    row.classList.add('dragging');
    offset = Math.max(-128, Math.min(128, dx));
    row.style.transform = `translateX(${offset}px)`;
    const hintL = row.querySelector('.drag-hint.left');
    const hintR = row.querySelector('.drag-hint.right');
    if (Math.abs(offset) > 28) {
      const op = Math.min(1,(Math.abs(offset)-28)/28);
      if (offset > 0) {
        hintR.textContent = 'mover »'; hintR.style.opacity = op;
        hintL.style.opacity = 0;
      } else {
        hintL.textContent = '« mover'; hintL.style.opacity = op;
        hintR.style.opacity = 0;
      }
    } else {
      hintL.style.opacity = 0; hintR.style.opacity = 0;
    }
  });

  row.addEventListener('pointerup', () => {
    clearTimeout(holdTimer);
    if (dragging && Math.abs(offset) > 64) {
      if (offset > 0) {
        moveTaskByDays(parseInt(id), 1);
      } else {
        deleteTask(parseInt(id), true);
      }
      row.dataset.suppressClick = 'true';
      resetDrag();
      return;
    }
    if (moved || dragging || ready) row.dataset.suppressClick = 'true';
    resetDrag();
    offset = 0;
  });

  row.addEventListener('pointercancel', resetDrag);
}

function toggleTask(id) {
  const t = tasks.find(t => t.id === id);
  if (t) t.done = !t.done;
  renderAll();
}

function deleteTask(id, ask = true) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  if (ask && !confirmDelete(`a tarefa "${t.title}"`)) return;
  tasks = tasks.filter(task => task.id !== id);
  closeModal('modal-task-detail');
  renderAll();
  showDayToast('Tarefa excluida');
}

function rescheduleTask(id, date) {
  const t = tasks.find(t => t.id === id);
  if (t) t.date = date;
  renderAll();
}

function moveTaskByDays(id, direction) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  const currentIdx = t.date ? WEEK_DATES.indexOf(t.date) : activeDay;
  const baseIdx = currentIdx >= 0 ? currentIdx : activeDay;
  const targetIdx = clampDay(baseIdx + direction);
  if (targetIdx === baseIdx) {
    showDayToast(direction > 0 ? 'Ultimo dia da semana' : 'Primeiro dia da semana');
    return;
  }
  t.date = WEEK_DATES[targetIdx];
  const label = `${DAYS_SHORT[targetIdx]} ${9 + targetIdx}`;
  if (targetIdx !== activeDay) {
    setActiveDay(targetIdx, { toast: `Movida para ${label}` });
  } else {
    renderAll();
    showDayToast(`Movida para ${label}`);
  }
}

// ─── MONTH VIEW ───────────────────────────────────────────────────────────────
function renderMonthView() {
  const mv = document.getElementById('month-view');
  const startOffset = 4; // May 1, 2026 = Friday
  const cells = Array.from({length:35}, (_,i) => {
    const d = i - startOffset + 1;
    return (d<1||d>31) ? null : d;
  });

  let html = `
    <div class="month-day-headers">
      ${['D','S','T','Q','Q','S','S'].map(d=>`<span>${d}</span>`).join('')}
    </div>`;

  for (let w=0; w<5; w++) {
    html += `<div class="month-week">`;
    for (let d=0; d<7; d++) {
      const day = cells[w*7+d];
      if (!day) { html += `<div class="month-cell empty"></div>`; continue; }
      const ds = `2026-05-${String(day).padStart(2,'0')}`;
      const dt = tasks.filter(t=>t.date===ds);
      const hasDone = dt.some(t=>t.done), hasPending = dt.some(t=>!t.done);
      const isToday = day===12;
      html += `
        <div class="month-cell ${isToday?'today':''}">
          <span class="cell-num">${day}</span>
          ${(hasDone||hasPending) ? `<div class="cell-dots">
            ${hasPending?`<div class="cell-dot" style="background:${isToday?'rgba(255,255,255,0.7)':'#C84B2F'}"></div>`:''}
            ${hasDone?`<div class="cell-dot" style="background:${isToday?'rgba(255,255,255,0.5)':'#2A6E4A'}"></div>`:''}
          </div>` : ''}
        </div>`;
    }
    html += `</div>`;
  }
  html += `
    <div class="month-legend">
      <div class="legend-item"><div class="legend-dot" style="background:#C84B2F"></div>Pendente</div>
      <div class="legend-item"><div class="legend-dot" style="background:#2A6E4A"></div>Concluída</div>
    </div>`;
  mv.innerHTML = html;

  mv.querySelectorAll('.month-cell:not(.empty)').forEach(cell => {
    cell.addEventListener('click', () => {
      const dayNum = parseInt(cell.querySelector('.cell-num').textContent);
      const dateStr = `2026-05-${String(dayNum).padStart(2,'0')}`;
      const idx = WEEK_DATES.indexOf(dateStr);
      if (idx >= 0) {
        currentView = 'semana';
        buildViewToggle();
        setActiveDay(idx);
      }
    });
  });
}

function checkHabit(id) {
  checkHabitDay(id, TODAY_IDX);
}

function checkHabitDay(id, dayIdx) {
  const h = habits.find(h=>h.id===id);
  if (!h || h.week[dayIdx] === null) return;
  const was = h.week[dayIdx]===true;
  h.week[dayIdx] = !was;
  if (dayIdx === TODAY_IDX) {
    h.streak = was ? Math.max(0, h.streak-1) : h.streak+1;
  }
  renderAll();
  if (selectedHabitId === id) {
    const overlay = document.getElementById('modal-habit-detail');
    if (overlay.classList.contains('open')) openHabitDetail();
  }
}

function setupHabitDrag(card) {
  let startX = 0, startY = 0, offset = 0, dragging = false, pressed = false, holdTimer = null;
  const id = parseInt(card.dataset.habitOpen);

  const reset = () => {
    clearTimeout(holdTimer);
    pressed = false;
    dragging = false;
    card.classList.remove('drag-ready','dragging');
    card.style.transform = '';
  };

  card.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    if (card.setPointerCapture) card.setPointerCapture(e.pointerId);
    startX = e.clientX;
    startY = e.clientY;
    offset = 0;
    pressed = true;
    holdTimer = setTimeout(() => card.classList.add('drag-ready'), 170);
  });

  card.addEventListener('pointermove', e => {
    if (!pressed) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dy) > 14 && Math.abs(dy) > Math.abs(dx)) {
      clearTimeout(holdTimer);
      return;
    }
    if (Math.abs(dx) < 14) return;
    dragging = true;
    card.classList.remove('drag-ready');
    card.classList.add('dragging');
    offset = Math.max(-128, Math.min(40, dx));
    card.style.transform = `translateX(${offset}px)`;
  });

  card.addEventListener('pointerup', () => {
    clearTimeout(holdTimer);
    if (dragging && offset < -64) {
      card.dataset.suppressClick = 'true';
      deleteHabit(id, true);
      reset();
      return;
    }
    if (dragging) card.dataset.suppressClick = 'true';
    reset();
  });

  card.addEventListener('pointercancel', reset);
}

function buildAddTaskModal() {
  const titleLabel = document.getElementById('task-modal-title');
  if (titleLabel) titleLabel.textContent = editingTaskId ? 'Editar tarefa' : 'Nova tarefa';
  document.getElementById('submit-task').textContent = editingTaskId ? 'SALVAR' : 'ADICIONAR';

  // priority buttons
  const pg = document.getElementById('priority-group');
  pg.innerHTML = Object.entries(PRIORITY).map(([k,v]) => `
    <button class="choice-btn ${k===newPriority?'active':''}" data-p="${k}"
      style="${k===newPriority?`border-color:${v.color};background:${v.bg};color:${v.color}`:''}">
      ${v.label}
    </button>`).join('');
  pg.querySelectorAll('[data-p]').forEach(btn => {
    btn.onclick = () => {
      newPriority = btn.dataset.p;
      buildAddTaskModal();
    };
  });

  // project buttons
  const prg = document.getElementById('project-group');
  prg.innerHTML = PROJECTS.map(p => `
    <button class="choice-btn" data-proj="${p.id}"
      style="${p.id===newProjectId?`border-color:${p.dot};background:${p.dot}18;color:${p.dot}`:''}">
      ${p.name}
    </button>`).join('');
  prg.querySelectorAll('[data-proj]').forEach(btn => {
    btn.onclick = () => { newProjectId = parseInt(btn.dataset.proj); buildAddTaskModal(); };
  });

  const dg = document.getElementById('task-date-group');
  dg.innerHTML = WEEK_DATES.map((date,i) => `
    <button class="date-choice ${newTaskDate===date?'active':''}" data-task-date="${date}">
      <span class="date-day">${DAYS_SHORT[i]}</span>
      <span class="date-num">${9+i}</span>
    </button>`).join('') + `
    <button class="date-choice no-date ${newTaskDate===null?'active':''}" data-task-date="null">
      <span class="date-day">Sem</span>
      <span class="date-num">data</span>
    </button>`;
  dg.querySelectorAll('[data-task-date]').forEach(btn => {
    btn.onclick = () => {
      newTaskDate = btn.dataset.taskDate === 'null' ? null : btn.dataset.taskDate;
      newHasDate = newTaskDate !== null;
      buildAddTaskModal();
    };
  });

  const rg = document.getElementById('repeat-group');
  rg.innerHTML = REPEAT_OPTIONS.map(opt => `
    <button class="choice-btn ${newRepeat===opt.id?'active':''}" data-repeat="${opt.id}"
      style="${newRepeat===opt.id?'border-color:#111110;background:#111110;color:#fff':''}">
      ${opt.label}
    </button>`).join('');
  rg.querySelectorAll('[data-repeat]').forEach(btn => {
    btn.onclick = () => {
      newRepeat = btn.dataset.repeat;
      buildAddTaskModal();
    };
  });

  // submit readiness
  const title = document.getElementById('new-task-title').value.trim();
  document.getElementById('submit-task').className = `modal-submit ${title?'ready':''}`;
}

document.getElementById('new-task-title').addEventListener('input', buildAddTaskModal);

document.getElementById('submit-task').addEventListener('click', () => {
  const title = document.getElementById('new-task-title').value.trim();
  if (!title) return;
  if (editingTaskId) {
    const t = tasks.find(t => t.id === editingTaskId);
    if (t) {
      t.title = title;
      t.priority = newPriority;
      t.projectId = newProjectId;
      t.date = newTaskDate;
      t.repeat = newRepeat;
    }
  } else if (newRepeat === 'diaria' && newTaskDate) {
    const startIdx = WEEK_DATES.indexOf(newTaskDate);
    const seriesId = Date.now();
    WEEK_DATES.slice(Math.max(0,startIdx)).forEach((date, i) => {
      tasks.push({
        id: seriesId + i,
        seriesId,
        title,
        done: false,
        priority: newPriority,
        projectId: newProjectId,
        time: '',
        date,
        repeat: 'diaria',
        subtasks: [],
      });
    });
  } else {
    tasks.push({
      id: Date.now(),
      title,
      done: false,
      priority: newPriority,
      projectId: newProjectId,
      time: '',
      date: newTaskDate,
      repeat: newRepeat,
      subtasks: [],
    });
  }
  document.getElementById('new-task-title').value = '';
  editingTaskId = null;
  newRepeat = 'nenhuma';
  closeModal('modal-add-task');
  renderAll();
});

function startEditTask(id) {

  editingTaskId = id;
  newPriority = t.priority;
  newProjectId = t.projectId;

    openModal('modal-add-project');
  }
});

loadState();
buildNav();
buildWeekStrip();
buildViewToggle();
updateHeader();
buildColorSwatches();
buildProjectColorSwatches();
attachDayScrollNavigation();
renderAll();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
