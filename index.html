<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>FlowDo</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#111110"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="FlowDo"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Courier+Prime:wght@400;700&family=DM+Mono:wght@400;500;700&family=DM+Sans:wght@400;600;700&family=Fraunces:wght@400;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;600;700&family=Josefin+Sans:wght@300;400;600&family=Lato:wght@400;700&family=Libre+Baskerville:wght@400;700&family=Libre+Caslon+Display&family=Manrope:wght@400;500;600;700&family=Nunito:wght@400;600;700&family=Source+Serif+4:wght@400;600;700&family=Source+Serif+Pro:wght@400;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #F5F4F0;
    --surface:  #FFFFFF;
    --ink:      #111110;
    --ink-mid:  #5A5A55;
    --ink-faint:#8E8C84;
    --ink-ghost:#BDBCB4;
    --rule:     #E2E1DA;
    --deep:     #EDECE8;
    --red:      #C84B2F;
    --red-soft: #F5EDE9;
    --amber:    #B07D2A;
    --amb-soft: #F5F0E6;
    --green:    #2A6E4A;
    --grn-soft: #E6F0EB;
    --blue:     #2A5FA3;
    --accent:   #111110;
    --accent-text: #FFFFFF;
    --day-selected: #111110;
    --day-selected-text: #FFFFFF;
    --tabbar:   #111110;
    --tabbar-text: #FFFFFF;
    --serif:    'Instrument Serif', serif;
    --mono:     'Manrope', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --space-0: 0;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 20px;
    --space-6: 24px;
    --space-7: 32px;
    --space-8: 40px;
    --space-9: 48px;
    --space-10: 64px;
    --text-micro: 10px;
    --lh-micro: 1.2;
    --tr-micro: 0.08em;
    --text-xs: 11px;
    --lh-xs: 1.3;
    --tr-xs: 0.06em;
    --text-sm: 13px;
    --lh-sm: 1.4;
    --text-base: 15px;
    --lh-base: 1.45;
    --text-md: 17px;
    --lh-md: 1.35;
    --tr-md: 0;
    --text-lg: 20px;
    --lh-lg: 1.3;
    --tr-lg: 0;
    --text-xl: 24px;
    --lh-xl: 1.2;
    --tr-xl: 0;
    --text-2xl: 30px;
    --lh-2xl: 1.05;
    --tr-2xl: 0;
    --text-3xl: clamp(30px, 8vw, 38px);
    --radius-xs: 6px;
    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-xl: 28px;
    --radius-full: 999px;
    --shadow-xs: 0 1px 2px rgba(17,17,16,.025);
    --shadow-sm: 0 2px 7px rgba(17,17,16,.045);
    --shadow-md: 0 8px 20px rgba(17,17,16,.075), 0 1px 4px rgba(17,17,16,.04);
    --shadow-lg: 0 18px 42px rgba(17,17,16,.10), 0 4px 12px rgba(17,17,16,.05);
    --shadow-fab: 0 10px 24px rgba(17,17,16,.14), 0 2px 8px rgba(17,17,16,.08);
    --shadow-sheet: 0 -10px 28px rgba(17,17,16,.08);
    --tap-min: 44px;
    --tap-comfortable: 48px;
    --tap-large: 56px;
    --ease-out: cubic-bezier(.22,1,.36,1);
    --ease-in-out: cubic-bezier(.4,0,.2,1);
    --ease-spring: cubic-bezier(.34,1.56,.64,1);
    --dur-fast: 160ms;
    --dur-base: 240ms;
    --dur-slow: 340ms;
    --focus-ring: 0 0 0 3px color-mix(in srgb, var(--ink) 22%, transparent);
    --sans: 'DM Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  body.dark {
    --bg:       #111110;
    --surface:  #1C1C1A;
    --ink:      #F5F4F0;
    --ink-mid:  #C7C5BD;
    --ink-faint:#9C9A92;
    --ink-ghost:#4A4945;
    --rule:     #2A2926;
    --deep:     #181816;
    --shadow-xs: 0 1px 2px rgba(0,0,0,.20);
    --shadow-sm: 0 2px 8px rgba(0,0,0,.24);
    --shadow-md: 0 8px 22px rgba(0,0,0,.30), 0 2px 6px rgba(0,0,0,.20);
    --shadow-lg: 0 18px 42px rgba(0,0,0,.36), 0 4px 12px rgba(0,0,0,.24);
    --shadow-fab: 0 10px 24px rgba(0,0,0,.34), 0 2px 8px rgba(0,0,0,.24);
    --shadow-sheet: 0 -10px 30px rgba(0,0,0,.30);
    background: #050505;
  }
  body.dark .page-title,
  body.dark .count-num,
  body.dark .task-title,
  body.dark .habit-name,
  body.dark .habit-month-name,
  body.dark .project-name,
  body.dark .detail-title,
  body.dark .habit-detail-title,
  body.dark .profile-name {
    color: var(--ink);
  }
  body.dark .profile-item,
  body.dark .project-task-title,
  body.dark .meta-proj,
  body.dark .day-btn.today .day-num {
    color: var(--ink-mid);
  }

  html, body {
    height: 100%;
    background: #CCC;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    -webkit-tap-highlight-color: transparent;
  }

  :where(button, [role="button"], input, textarea, select):focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
    border-radius: inherit;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
    }
  }

  /* ── PHONE SHELL ── */
  #app {
    width: 390px;
    height: 844px;
    background: var(--bg);
    border-radius: 44px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 32px 80px rgba(0,0,0,0.28);
    flex-shrink: 0;
  }
  #app::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 84px;
    height: 34px;
    background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--bg) 92%, transparent));
    opacity: 0;
    pointer-events: none;
    z-index: 8;
    transition: opacity var(--dur-base) ease;
  }
  #app.has-scroll-more::after { opacity: 1; }

  .loading-badge {
    position: absolute;
    inset: 0;
    z-index: 260;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    opacity: 1;
    pointer-events: none;
    transition: opacity 520ms ease, transform 520ms var(--ease-out);
  }
  .loading-badge.done {
    opacity: 0;
    transform: scale(1.01);
  }
  .loading-badge-card {
    width: 104px;
    height: 104px;
    border-radius: var(--radius-xl);
    background: transparent;
    border: none;
    box-shadow: none;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: loadingBadgeSettle 1600ms var(--ease-out) both;
  }
  .loading-logo {
    position: relative;
    width: 58px;
    height: 52px;
    animation: loadingLogoFloat 1500ms var(--ease-out) both;
  }
  .loading-logo::after {
    content: '';
    position: absolute;
    inset: -10px -8px;
    border-radius: 28px;
    background: radial-gradient(circle at 50% 55%, rgba(17,17,16,.08), transparent 56%);
    opacity: 0;
    transform: scale(.72);
    animation: loadingGlow 1300ms ease-out 180ms both;
  }
  .loading-stone {
    position: absolute;
    height: 11px;
    border-radius: 9px;
    background: #111110;
    box-shadow: 0 4px 10px rgba(17,17,16,.10);
    opacity: 0;
    transform-origin: center;
    z-index: 1;
    animation:
      stoneStack 760ms cubic-bezier(.18,.9,.25,1.18) forwards,
      stoneBreathe 1180ms ease-in-out 850ms infinite;
  }
  .loading-stone:nth-child(1) {
    width: 25px;
    right: 1px;
    top: 0;
    --stone-x: 10px;
    --stone-y: 26px;
    --stone-r: 1.5deg;
    animation-delay: 300ms, 1120ms;
  }
  .loading-stone:nth-child(2) {
    width: 41px;
    right: 3px;
    top: 13px;
    --stone-x: -8px;
    --stone-y: 24px;
    --stone-r: -1deg;
    animation-delay: 210ms, 1030ms;
  }
  .loading-stone:nth-child(3) {
    width: 39px;
    left: 9px;
    top: 26px;
    --stone-x: 8px;
    --stone-y: 22px;
    --stone-r: 1deg;
    animation-delay: 120ms, 940ms;
  }
  .loading-stone:nth-child(4) {
    width: 52px;
    left: 0;
    top: 40px;
    --stone-x: -6px;
    --stone-y: 20px;
    --stone-r: -1.5deg;
    animation-delay: 20ms, 860ms;
  }
  @keyframes stoneStack {
    0% {
      opacity: 0;
      transform: translate3d(var(--stone-x), var(--stone-y), 0) rotate(var(--stone-r)) scaleX(.42) scaleY(.9);
    }
    46% {
      opacity: 1;
      transform: translate3d(calc(var(--stone-x) * .12), -4px, 0) rotate(calc(var(--stone-r) * -.45)) scaleX(1.08) scaleY(1);
    }
    72% {
      opacity: 1;
      transform: translate3d(0, 2px, 0) rotate(-2deg) scaleX(.97) scaleY(1);
    }
    100% {
      opacity: 1;
      transform: translate3d(0, 0, 0) rotate(-2deg) scale(1);
    }
  }
  @keyframes stoneBreathe {
    0%, 100% { transform: translate3d(0, 0, 0) rotate(-2deg) scaleX(1); }
    45% { transform: translate3d(0, -2px, 0) rotate(-1deg) scaleX(1.025); }
  }
  @keyframes loadingBadgeSettle {
    0% { transform: translateY(8px) scale(.96); opacity: .92; }
    45% { transform: translateY(-2px) scale(1.02); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes loadingLogoFloat {
    0% { transform: translateY(10px) rotate(-3deg); }
    58% { transform: translateY(-2px) rotate(1deg); }
    100% { transform: translateY(0) rotate(0); }
  }
  @keyframes loadingGlow {
    0% { opacity: 0; transform: scale(.66); }
    42% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.18); }
  }

  @media (prefers-reduced-motion: reduce) {
    .loading-stone {
      animation: none;
      opacity: 1;
      transform: translateY(0) rotate(-2deg);
    }
    .loading-badge-card { animation: none; }
  }

  /* ── HEADER ── */
  #header {
    padding: var(--space-4) var(--space-5) 0;
    flex-shrink: 0;
  }
  #header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: var(--space-2);
    gap: var(--space-3);
  }
  #header-title-wrap { min-width: 0; }
  #header-actions {
    display: flex;
    align-items: flex-end;
    gap: var(--space-2);
    flex-shrink: 0;
  }
  .header-icon-btn {
    width: var(--tap-min);
    height: var(--tap-min);
    border-radius: var(--radius-md);
    border: 1px solid var(--rule);
    background: var(--surface);
    color: var(--ink-mid);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-bottom: 2px;
    transition: background var(--dur-fast), color var(--dur-fast), transform var(--dur-fast) var(--ease-out);
  }
  .header-icon-btn:active { transform: scale(0.97); background: var(--deep); }
  .header-icon-btn svg {
    width: 17px;
    height: 17px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .page-sub {
    font-size: var(--text-xs);
    font-weight: 700;
    letter-spacing: var(--tr-xs);
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .page-title {
    font-family: var(--serif);
    font-size: var(--text-2xl);
    font-weight: 400;
    color: var(--ink);
    line-height: var(--lh-2xl);
    letter-spacing: var(--tr-2xl);
    margin-top: 3px;
  }
  #task-count {
    text-align: right;
  }
  #task-count .count-num {
    font-family: var(--serif);
    font-size: var(--text-xl);
    font-weight: 400;
    color: var(--ink);
    line-height: 1;
  }
  #task-count .count-num span { font-size: var(--text-sm); color: var(--ink-faint); }
  #task-count .count-label {
    font-size: var(--text-micro);
    color: var(--ink-faint);
    letter-spacing: var(--tr-micro);
    margin-top: 2px;
  }

  /* ── PROGRESS BAR ── */
  .progress-bar {
    height: 1.5px;
    background: var(--rule);
    margin-bottom: 0;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 1px;
    transition: width var(--dur-slow) var(--ease-out);
  }

  /* ── VIEW TOGGLE ── */
  .view-toggle {
    display: flex;
    background: var(--deep);
    border: 1px solid var(--rule);
    border-radius: var(--radius-md);
    padding: var(--space-1);
    margin-bottom: var(--space-4);
  }
  .view-toggle button {
    flex: 1;
    min-height: 36px;
    padding: 7px var(--space-2);
    border-radius: var(--radius-sm);
    border: none;
    background: transparent;
    color: var(--ink-faint);
    font-size: var(--text-xs);
    font-weight: 700;
    cursor: pointer;
    font-family: var(--mono);
    letter-spacing: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background var(--dur-fast), color var(--dur-fast), box-shadow var(--dur-fast), transform var(--dur-fast) var(--ease-out);
  }
  .view-toggle button svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex-shrink: 0;
  }
  .view-toggle button.active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow-sm);
  }

  /* ── WEEK STRIP ── */
  #week-strip {
    display: flex;
    align-items: center;
    padding: var(--space-2) var(--space-3);
    gap: 0;
  }
  .week-nav-arrow {
    flex-shrink: 0;
    width: var(--tap-min);
    height: var(--tap-min);
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--ink-faint);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-md);
    padding: 0;
  }
  .week-nav-arrow:active { color: var(--ink-mid); }
  .week-nav-days {
    flex: 1;
    display: flex;
    overflow-x: scroll;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-left: calc(50% - 32px);
    padding-right: calc(50% - 32px);
  }
  .week-nav-days::-webkit-scrollbar { display: none; }
  .inline-task-row {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    min-height: var(--tap-comfortable);
    padding: var(--space-2) 0 var(--space-3);
    margin: 0;
    background: transparent;
    border-bottom: 0.5px solid color-mix(in srgb, var(--rule) 34%, transparent);
  }
  .inline-task-input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    font-family: var(--mono);
    font-size: var(--text-base);
    font-weight: 400;
    color: var(--ink);
    outline: none;
    padding: 0;
  }
  .inline-task-input::placeholder {
    color: color-mix(in srgb, var(--ink-faint) 72%, transparent);
    font-style: normal;
    font-weight: 400;
  }
  .inline-task-row.bottom {
    background: transparent;
    border-top: none;
    border-bottom: none;
    padding: var(--space-5) var(--space-5) var(--space-2);
    margin-bottom: 0;
  }
  .inline-task-row.bottom .inline-task-input::placeholder {
    color: var(--ink-ghost);
  }
  .day-btn {
    flex: 0 0 auto;
    scroll-snap-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-1);
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-md);
    border: none;
    cursor: pointer;
    background: transparent;
    min-width: var(--tap-min);
    min-height: var(--tap-min);
    transition: background var(--dur-fast), transform var(--dur-fast) var(--ease-out);
  }
  .day-btn:active { transform: scale(0.97); }
  .day-btn.active { background: color-mix(in srgb, var(--day-selected) 10%, transparent); }
  #week-strip.week-mode .day-btn.active { background: transparent; }
  .day-letter {
    font-size: var(--text-micro);
    font-weight: 700;
    letter-spacing: var(--tr-micro);
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .day-btn.active .day-letter { color: color-mix(in srgb, var(--day-selected) 58%, var(--ink-faint)); }
  #week-strip.week-mode .day-btn.active .day-letter { color: var(--ink-faint); }
  .day-num {
    font-family: var(--serif);
    font-size: var(--text-base);
    color: var(--ink-mid);
  }
  .day-btn.today .day-num { color: var(--ink); }
  .day-btn.active .day-num { color: var(--day-selected); }
  #week-strip.week-mode .day-btn.active .day-num { color: var(--ink-mid); }
  #week-strip.week-mode .day-btn.today .day-num { color: var(--ink); }
  [data-theme="sol"] .day-btn.active .day-num { color: #F5C430; }
  [data-theme="sol"] #week-strip.week-mode .day-btn.active .day-num { color: var(--ink-mid); }
  [data-theme="sol"] .nav-btn.active { color: #F5C430 !important; }
  .day-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--red);
  }

  /* ── SCROLL CONTENT ── */
  #content {
    flex: 1;
    min-height: 0;
    overflow-y: scroll;
    scrollbar-width: none;
    touch-action: pan-y;
  }
  #content::-webkit-scrollbar { display: none; }

  /* ── SCREENS ── */
  .screen { display: none; will-change: transform, opacity; }
  .screen.active { display: block; }
  .screen.entering {
    animation: screenEnter var(--dur-base) var(--ease-out) both;
  }
  .screen.swipe-anim { transition: transform var(--dur-slow) var(--ease-out); }
  @keyframes screenEnter {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── TASK LIST ── */
  .task-list {
    padding: 0 var(--space-5);
  }
  .task-list > :last-child { border-bottom: none; }
  .section-label {
    font-family: var(--mono);
    font-size: var(--text-xs);
    font-weight: 600;
    letter-spacing: var(--tr-xs);
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: var(--space-5) 0 0;
    min-height: var(--tap-comfortable);
    display: flex;
    align-items: center;
    padding: 0;
    border-bottom: none;
  }
  .section-label.today { color: var(--ink-mid); }
  .day-empty {
    font-family: var(--mono);
    font-style: normal;
    font-size: var(--text-xs);
    font-weight: 400;
    color: var(--ink-faint);
    min-height: var(--tap-comfortable);
    padding: var(--space-3) 0;
    text-align: left;
    display: flex;
    align-items: center;
  }
  .section-label.nodate {
    color: var(--ink-faint);
    border-bottom: none;
    font-style: normal;
  }

  .task-swipe-wrap {
    position: relative;
    overflow: hidden;
    border-bottom: none;
  }
  .task-delete-bg {
    position: absolute;
    inset: 0 0 0 auto;
    width: 112px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: color-mix(in srgb, var(--red) 9%, var(--bg));
    opacity: 0;
    transition: opacity var(--dur-base) ease;
    pointer-events: none;
  }
  .task-swipe-wrap.swiping .task-delete-bg,
  .task-swipe-wrap.delete-ready .task-delete-bg,
  .task-swipe-wrap.deleting .task-delete-bg {
    opacity: 1;
  }
  .trash-can {
    width: 32px;
    height: 34px;
    color: color-mix(in srgb, var(--ink) 82%, var(--red));
    position: relative;
    transform: scale(0.92);
    transition: transform var(--dur-fast) ease, color var(--dur-fast) ease;
  }
  .trash-can svg {
    width: 32px;
    height: 34px;
    overflow: visible;
  }
  .trash-lid {
    transform-origin: 16px 8px;
    transition: transform var(--dur-fast) ease;
  }
  .trash-face {
    opacity: 0.72;
  }
  .task-swipe-wrap.delete-mid .trash-lid {
    transform: translateY(-2px) rotate(-10deg);
  }
  .task-swipe-wrap.delete-ready .trash-can,
  .task-swipe-wrap.deleting .trash-can {
    transform: scale(1);
    color: var(--red);
  }
  .task-swipe-wrap.delete-ready .trash-lid,
  .task-swipe-wrap.deleting .trash-lid {
    transform: translateY(-6px) rotate(-22deg);
  }
  .task-swipe-wrap.trash-capture .trash-lid {
    animation: trashClose var(--dur-slow) ease forwards;
  }
  @keyframes trashClose {
    0% { transform: translateY(-6px) rotate(-22deg); }
    100% { transform: translateY(0) rotate(0); }
  }

  .task-row {
    display: flex;
    align-items: flex-start;
    gap: var(--space-4);
    min-height: var(--tap-comfortable);
    padding: var(--space-3) 0;
    cursor: pointer;
    transition: opacity var(--dur-base), transform var(--dur-slow) var(--ease-out), background var(--dur-base);
    position: relative;
    touch-action: pan-y;
    user-select: none;
    background: transparent;
    border-bottom: 0.5px solid color-mix(in srgb, var(--rule) 58%, transparent);
  }
  .task-row.done { opacity: 0.38; }
  .task-row.dragging {
    transition: none;
    z-index: 2;
    border-radius: var(--radius-md);
    background: var(--bg);
    box-shadow: var(--shadow-sm);
    border-bottom: none;
  }
  .task-row.deleting {
    transition: transform var(--dur-slow) var(--ease-out), opacity var(--dur-base) ease;
    transform: translateX(-92px) scale(0.86) !important;
    opacity: 0;
    border-bottom-color: transparent;
  }
  .task-row.drag-ready {
    transform: scale(0.985);
    opacity: 0.9;
  }

  .drag-hint {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: var(--text-micro);
    font-weight: 700;
    color: #fff;
    border-radius: var(--radius-sm);
    padding: var(--space-2) var(--space-3);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-fast);
    white-space: nowrap;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    z-index: 0;
  }
  .drag-hint.left { right: 0; background: var(--red); }
  .drag-hint.right { left: 0; background: var(--green); }
  .task-row.gesture-demo .drag-hint.right { opacity: 1; }
  .task-row.gesture-demo {
    animation: taskGestureDemo 0.88s var(--ease-out);
    z-index: 2;
  }
  @keyframes taskGestureDemo {
    0% { transform: translateX(0); }
    34% { transform: translateX(18px); }
    58% { transform: translateX(8px); }
    100% { transform: translateX(0); }
  }

  .day-shift-toast {
    position: absolute;
    left: 50%;
    bottom: 146px;
    transform: translateX(-50%) translateY(8px);
    background: var(--accent);
    color: var(--accent-text);
    border-radius: var(--radius-sm);
    padding: var(--space-2) var(--space-3);
    font-size: var(--text-micro);
    font-weight: 700;
    letter-spacing: var(--tr-micro);
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-slow) ease, transform var(--dur-slow) var(--ease-out);
    z-index: 30;
    box-shadow: var(--shadow-md);
  }
  .day-shift-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .tick-btn {
    width: 22px; height: 22px;
    border-radius: var(--radius-xs);
    border: 1.5px solid var(--ink-ghost);
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: border-color var(--dur-fast), background var(--dur-fast), transform var(--dur-fast) var(--ease-out);
  }
  .tick-btn::after {
    content: '';
    position: absolute;
    inset: -12px;
  }
  .tick-btn:active { transform: scale(0.94); }
  .tick-btn.checked {
    border-color: var(--check-color, var(--ink));
    background: var(--check-color, var(--ink));
  }
  .tick-btn svg { display: none; }
  .tick-btn.checked svg { display: block; }

  .task-body { flex: 1; min-width: 0; }
  .task-title {
    font-family: var(--mono);
    font-size: var(--text-base);
    font-weight: 500;
    color: var(--ink);
    line-height: var(--lh-base);
    letter-spacing: 0;
  }
  .task-row.done .task-title { text-decoration: line-through; }
  .task-meta {
    display: flex;
    gap: var(--space-2);
    margin-top: var(--space-1);
    align-items: center;
    flex-wrap: wrap;
  }
  .meta-proj {
    display: flex;
    align-items: center;
    gap: var(--space-1);
    font-size: var(--text-sm);
    color: var(--ink-mid);
    font-weight: 500;
  }
  .proj-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .meta-time, .meta-sub {
    font-size: var(--text-sm);
    color: var(--ink-mid);
  }
  .priority-badge {
    display: flex;
    align-items: center;
    gap: var(--space-1);
    font-size: var(--text-xs);
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .priority-dot { width: 4px; height: 4px; border-radius: 50%; }

  /* ── RESCHEDULE ── */
  .reschedule-panel {
    background: var(--deep);
    border-radius: var(--radius-md);
    padding: var(--space-3) var(--space-4);
    margin-bottom: var(--space-1);
    border: 1px solid color-mix(in srgb, var(--rule) 62%, transparent);
  }
  .reschedule-panel .panel-label {
    font-size: var(--text-micro);
    font-weight: 700;
    letter-spacing: var(--tr-micro);
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: var(--space-2);
  }
  .reschedule-dates {
    display: flex;
    gap: var(--space-2);
    flex-wrap: wrap;
  }
  .reschedule-dates button {
    min-height: 36px;
    padding: 0 var(--space-3);
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--rule);
    background: var(--surface);
    color: var(--ink-mid);
    font-size: var(--text-xs);
    font-weight: 600;
    cursor: pointer;
    font-family: var(--mono);
    transition: border-color var(--dur-fast), color var(--dur-fast), transform var(--dur-fast) var(--ease-out);
  }
  .reschedule-dates button:active { transform: scale(0.97); }
  @media (hover: hover) {
    .reschedule-dates button:hover {
      border-color: var(--ink);
      color: var(--ink);
    }
  }
  .reschedule-dates button.cancel {
    background: transparent;
    color: var(--ink-faint);
    border-color: var(--rule);
  }

  /* ── MONTH CALENDAR ── */
  .month-view { padding: 0 var(--space-5); }
  .month-day-headers {
    display: flex;
    gap: var(--space-1);
    margin-bottom: var(--space-2);
  }
  .month-day-headers span {
    flex: 1;
    text-align: center;
    font-size: var(--text-micro);
    font-weight: 700;
    color: var(--ink-faint);
  }
  .month-week { display: flex; gap: var(--space-1); margin-bottom: var(--space-1); }
  .month-cell {
    flex: 1;
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    background: var(--deep);
    border: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .month-cell.empty { background: transparent; border-color: transparent; }
  .month-cell.today { background: var(--day-selected); border-color: var(--day-selected); }
  .month-cell .cell-num {
    font-size: var(--text-micro);
    font-weight: 400;
    color: var(--ink-mid);
    line-height: 1;
  }
  .month-cell.today .cell-num { color: var(--day-selected-text); font-weight: 700; }
  .cell-dots { display: flex; gap: 2px; }
  .cell-dot { width: 4px; height: 4px; border-radius: 50%; }
  .month-legend {
    display: flex;
    gap: var(--space-4);
    margin-top: var(--space-3);
    justify-content: flex-end;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: var(--space-1);
    font-size: var(--text-micro);
    color: var(--ink-faint);
  }
  .legend-dot { width: 6px; height: 6px; border-radius: 50%; }

  /* ── HABITS ── */
  .habits-list { padding: 0 var(--space-4); }
  .habits-summary {
    padding: 0 var(--space-5) var(--space-4);
    font-size: var(--text-xs);
    color: var(--ink-faint);
  }

  .habit-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
    margin-bottom: var(--space-3);
    border: 1px solid var(--rule);
    cursor: pointer;
    box-shadow: var(--shadow-xs);
    transition: transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base), border-color var(--dur-base), background var(--dur-base);
  }
  .habit-card:active { transform: scale(0.99); box-shadow: var(--shadow-sm); }
  .habit-top {
    display: flex;
    align-items: flex-start;
    gap: var(--space-3);
    margin-bottom: var(--space-4);
  }
  .habit-check {
    width: 26px; height: 26px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--ink-ghost);
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: border-color var(--dur-fast), background var(--dur-fast), transform var(--dur-fast) var(--ease-out);
  }
  .habit-check::after {
    content: '';
    position: absolute;
    inset: -9px;
  }
  .habit-check:active { transform: scale(0.94); }
  .habit-check.done {
    border-color: var(--habit-color);
    background: var(--habit-color);
  }
  .habit-check svg { display: none; }
  .habit-check.done svg { display: block; }
  .habit-info { flex: 1; }
  .habit-name {
    font-family: var(--serif);
    font-size: var(--text-md);
    color: var(--ink);
    line-height: var(--lh-md);
    letter-spacing: var(--tr-md);
  }
  .habit-cue {
    font-size: var(--text-sm);
    color: var(--ink-faint);
    margin-top: var(--space-1);
  }
  .habit-streak { text-align: right; flex-shrink: 0; }
  .streak-num {
    font-family: var(--serif);
    font-size: var(--text-lg);
    color: var(--habit-color);
    line-height: 1;
  }
  .streak-label {
    font-size: var(--text-micro);
    font-weight: 700;
    letter-spacing: var(--tr-micro);
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 1px;
  }

  /* week grid */
  .week-grid { display: flex; gap: var(--space-1); }
  .week-cell-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-1);
  }
  .week-cell {
    width: 100%;
    height: 28px;
    border-radius: var(--radius-xs);
    background: var(--deep);
    border: 1px solid transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--dur-base), transform var(--dur-fast) var(--ease-out);
  }
  .week-cell[data-habit-day]:active { transform: scale(0.94); }
  .week-cell[data-habit-day] { cursor: pointer; }
  .month-cell:not(.empty) { cursor: pointer; }
  @media (hover: hover) {
    .month-cell:not(.empty):hover { opacity: 0.8; }
  }
  .week-cell.done { background: var(--habit-color); }
  .week-cell.today-cell { border-color: var(--ink-ghost); }
  .week-cell.future { opacity: 0.3; }
  .week-cell-label {
    font-size: var(--text-micro);
    font-weight: 700;
    color: var(--ink-faint);
  }
  .week-cell-label.today-label { color: var(--ink-mid); }
  .week-cell-dash { width: 6px; height: 1.5px; background: var(--ink-ghost); border-radius: 1px; }

  /* heatmap */
  .heatmap { width: 100%; }
  .heatmap-header {
    display: flex;
    gap: var(--space-1);
    margin-bottom: var(--space-2);
  }
  .heatmap-header-spacer { width: 38px; flex-shrink: 0; }
  .heatmap-header span {
    flex: 1;
    text-align: center;
    font-size: var(--text-micro);
    font-weight: 700;
    color: var(--ink-faint);
  }
  .heatmap-row {
    display: flex;
    gap: var(--space-1);
    margin-bottom: var(--space-1);
    align-items: center;
  }
  .heatmap-week-label {
    width: 38px;
    font-size: var(--text-micro);
    color: var(--ink-faint);
    flex-shrink: 0;
  }
  .heatmap-cell {
    flex: 1;
    aspect-ratio: 1;
    border-radius: var(--radius-xs);
    background: var(--deep);
    border: 1px solid transparent;
  }
  .heatmap-cell.done {
    background: var(--habit-color);
    border-color: color-mix(in srgb, var(--habit-color) 40%, transparent);
  }
  .heatmap-cell.missed { background: var(--deep); opacity: 0.55; }
  .heatmap-cell.future { opacity: 0.2; }
  .heatmap-cell[data-heatmap-day], .heatmap-cell[data-detail-heatmap] {
    cursor: pointer;
    touch-action: manipulation;
    transition: transform var(--dur-fast), opacity var(--dur-fast);
  }
  .heatmap-cell[data-heatmap-day]:active,
  .heatmap-cell[data-detail-heatmap]:active { transform: scale(0.92); }

  /* add habit btn */
  .add-habit-btn {
    width: 100%;
    min-height: var(--tap-comfortable);
    padding: 0;
    border-radius: var(--radius-md);
    border: 1.5px dashed var(--ink-ghost);
    background: transparent;
    color: var(--ink-faint);
    font-size: var(--text-xs);
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    font-family: var(--mono);
    margin-bottom: 90px;
    transition: border-color var(--dur-fast), color var(--dur-fast), transform var(--dur-fast) var(--ease-out);
  }
  .add-habit-btn:active { transform: scale(0.985); }
  @media (hover: hover) {
    .add-habit-btn:hover { border-color: var(--ink-mid); color: var(--ink-mid); }
  }
  .habit-card.dragging { transition: none; }
  .habit-card.drag-ready { transform: scale(0.985); opacity: 0.9; }

  /* mensal habit cards */
  .habit-month-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: var(--space-4);
    margin-bottom: var(--space-3);
    border: 1px solid color-mix(in srgb, var(--rule) 62%, transparent);
    box-shadow: var(--shadow-xs);
  }
  .habit-month-header {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    margin-bottom: var(--space-4);
  }
  .habit-month-dot { width: 10px; height: 10px; border-radius: 50%; }
  .habit-month-name {
    font-family: var(--serif);
    font-size: var(--text-md);
    color: var(--ink);
  }
  .habit-month-check {
    margin-left: auto;
    background: none;
    border: 1.5px solid currentColor;
    border-radius: 50%;
    width: 34px;
    height: 34px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
    transition: background var(--dur-fast), transform var(--dur-fast) var(--ease-out);
  }
  .habit-month-check::after {
    content: '';
    position: absolute;
    inset: -5px;
  }
  .habit-month-check:active { transform: scale(0.94); }
  .habit-month-check.done { background: currentColor; color: var(--bg) !important; }
  .habit-month-streak {
    margin-left: auto;
    font-family: var(--serif);
    font-size: 14px;
  }
  .period-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
    padding: 0 var(--space-1) var(--space-4);
  }
  .period-nav button {
    width: var(--tap-min);
    height: var(--tap-min);
    border-radius: var(--radius-md);
    border: 1.5px solid var(--rule);
    background: var(--surface);
    color: var(--ink-mid);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .period-label {
    font-family: var(--mono);
    font-size: var(--text-xs);
    font-weight: 700;
    color: var(--ink-mid);
    text-transform: uppercase;
  }

  /* ── PROJECTS ── */
  .projects-view { padding: 0 var(--space-5); }
  .project-block {
    padding: var(--space-4);
    margin-bottom: var(--space-4);
    border: 1px solid color-mix(in srgb, var(--rule) 62%, transparent);
    border-radius: var(--radius-lg);
    background: var(--surface);
    box-shadow: var(--shadow-xs);
    transition: transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base), border-color var(--dur-base);
  }
  .project-block:active { transform: scale(0.99); box-shadow: var(--shadow-sm); }
  .project-block:last-child { border-bottom: 1px solid color-mix(in srgb, var(--rule) 62%, transparent); }
  .project-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: var(--space-3);
    cursor: pointer;
  }
  .project-name-wrap {
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }
  .project-dot { width: 7px; height: 7px; border-radius: 50%; }
  .project-name {
    font-family: var(--serif);
    font-size: var(--text-lg);
    line-height: var(--lh-lg);
    letter-spacing: var(--tr-lg);
    color: var(--ink);
  }
  .project-count { font-size: var(--text-xs); color: var(--ink-faint); }
  .project-edit-btn {
    background: none;
    border: none;
    font-size: 15px;
    color: var(--ink-faint);
    cursor: pointer;
    min-width: var(--tap-min);
    min-height: var(--tap-min);
    padding: 0;
    line-height: 1;
    opacity: 0.6;
  }
  .project-edit-btn:active { opacity: 1; }
  .project-bar { height: 3px; background: var(--rule); border-radius: var(--radius-full); margin-bottom: var(--space-3); }
  .project-bar-fill { height: 100%; border-radius: var(--radius-full); transition: width var(--dur-slow) var(--ease-out); background: var(--ink-mid); }
  .project-task {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    min-height: var(--tap-min);
    padding: var(--space-2) 0;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: background var(--dur-fast);
  }
  .project-task:active { background: var(--deep); }
  .project-task.done { opacity: 0.32; }
  .project-task-dot { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; }
  .project-task-title {
    font-family: var(--serif);
    font-size: var(--text-md);
    color: var(--ink-mid);
  }
  .project-task.done .project-task-title { text-decoration: line-through; }
  .project-task-nodate {
    margin-left: auto;
    font-size: var(--text-micro);
    color: var(--ink-faint);
  }

  /* ── PROFILE ── */
  .profile-view { padding: var(--space-1) var(--space-5) 0; }
  .profile-avatar {
    width: 56px; height: 56px;
    border-radius: var(--radius-lg);
    background: var(--tabbar);
    margin-bottom: var(--space-5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-size: var(--text-xl);
    color: var(--tabbar-text);
  }
  .profile-name {
    font-family: var(--serif);
    font-size: var(--text-xl);
    color: var(--ink);
    margin-bottom: 2px;
  }
  .profile-email { font-size: var(--text-xs); color: var(--ink-faint); margin-bottom: var(--space-6); }
  .profile-items { border-top: 1px solid var(--rule); }
  .profile-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--space-3);
    min-height: var(--tap-comfortable);
    padding: var(--space-3) 0;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    font-family: var(--serif);
    font-size: var(--text-md);
    color: var(--ink-mid);
  }
  .profile-item.danger { color: var(--red); }
  .profile-item span {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .profile-item svg { flex-shrink: 0; }
  .profile-tip {
    border: 1px solid var(--rule);
    background: var(--deep);
    border-radius: var(--radius-md);
    padding: var(--space-3) 42px var(--space-3) var(--space-3);
    margin: 0 0 var(--space-3);
    position: relative;
    color: var(--ink-mid);
  }
  .profile-tip strong {
    display: block;
    font-family: var(--mono);
    font-size: var(--text-micro);
    font-weight: 700;
    letter-spacing: var(--tr-micro);
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 5px;
  }
  .profile-tip span {
    display: block;
    font-family: var(--serif);
    font-size: var(--text-base);
    line-height: 1.35;
  }
  .profile-tip button {
    position: absolute;
    top: 9px;
    right: 9px;
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--surface);
    color: var(--ink-faint);
    cursor: pointer;
  }
  .appearance-panel {
    padding: var(--space-4) 0 var(--space-5);
    border-bottom: 1px solid var(--rule);
  }
  .appearance-row { margin-bottom: var(--space-4); }
  .appearance-row:last-child { margin-bottom: 0; }
  .appearance-label {
    margin-bottom: var(--space-2);
    font-family: var(--mono);
    font-size: var(--text-micro);
    font-weight: 700;
    letter-spacing: var(--tr-micro);
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .appearance-options {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--space-2);
  }
  .appearance-options.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .appearance-options button {
    min-width: 0;
    min-height: var(--tap-min);
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--rule);
    background: var(--surface);
    color: var(--ink-mid);
    font-family: var(--mono);
    font-size: var(--text-micro);
    font-weight: 700;
    cursor: pointer;
  }
  .appearance-options button.active {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-text);
  }
  .appearance-select {
    width: 100%;
    min-height: var(--tap-min);
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--rule);
    background: var(--surface);
    color: var(--ink-mid);
    font-family: var(--mono);
    font-size: var(--text-xs);
    font-weight: 700;
    padding: 0 10px;
    outline: none;
  }
  .appearance-color {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .appearance-color input[type="color"] {
    width: 54px;
    height: 42px;
    border: 1.5px solid var(--rule);
    border-radius: 12px;
    background: var(--surface);
    padding: 4px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .appearance-preview {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--ink-mid);
  }
  .appearance-preview strong {
    display: block;
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.1;
    color: var(--accent);
  }
  .appearance-preview span {
    display: block;
    margin-top: 4px;
    font-family: var(--mono);
    font-size: var(--text-micro);
    color: var(--ink-faint);
  }
  .appearance-actions {
    display: flex;
    gap: var(--space-2);
    margin-top: var(--space-4);
  }
  .appearance-actions button {
    flex: 1;
    min-height: var(--tap-min);
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--rule);
    background: var(--surface);
    color: var(--ink-mid);
    font-family: var(--mono);
    font-size: var(--text-micro);
    font-weight: 700;
    cursor: pointer;
  }
  .appearance-actions button.primary {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-text);
  }

  /* ── THEME OVERRIDES ── */
  #app[data-theme="brejo"] {
    --ink-mid: #6F6A64;
    --ink-faint: #6F6A64;
    --ink-ghost: #B8B5AE;
    --rule: #C8C5BE;
  }

  #app[data-theme="nevoa"] .nav-btn.active { color: #7B9EC0 !important; }
  #app[data-theme="nevoa"] .day-btn.active .day-num { color: #7B9EC0; }
  #app[data-theme="nevoa"] {
    --ink-mid: #5C6F88;
    --ink-faint: #5C6F88;
    --ink-ghost: #AEB8C8;
    --rule: #C5CCD9;
  }

  #app[data-theme="sol"] {
    --ink-mid: #6F5D24;
    --ink-faint: #6F5D24;
    --ink-ghost: #BDB17E;
    --rule: #D8CF9C;
  }

  #app[data-theme="terra"] #bottom-nav { border-top-color: color-mix(in srgb, #C4593A 22%, transparent); }
  #app[data-theme="terra"] .nav-btn.active { color: #C4593A !important; }
  #app[data-theme="terra"] .nav-indicator  { background: #C4593A; }
  #app[data-theme="terra"] {
    --ink-mid: #7F5945;
    --ink-faint: #7F5945;
    --ink-ghost: #BDAA9C;
    --rule: #D8CDBF;
  }
  #app[data-theme="terra"] .page-title {
    font-style: italic;
    font-weight: 300;
    font-size: var(--text-3xl);
  }
  #app[data-theme="terra"] .task-title,
  #app[data-theme="terra"] .habit-name,
  #app[data-theme="terra"] .project-name { font-style: italic; font-weight: 400; }
  #app[data-theme="terra"] .day-btn { border-radius: var(--radius-xs); border: 1px solid #E8DDD0; }
  #app[data-theme="terra"] .day-btn.active { border-color: #C4593A; }

  body.dark #app {
    --bg: #111110;
    --surface: #1C1C1A;
    --ink: #F5F4F0;
    --ink-mid: #C7C5BD;
    --ink-faint: #9C9A92;
    --ink-ghost: #4A4945;
    --rule: #2A2926;
    --deep: #181816;
  }

  /* ── FAB ── */
  #fab {
    position: absolute;
    right: var(--space-5);
    bottom: 82px;
    width: var(--tap-large); height: var(--tap-large);
    border-radius: var(--radius-md);
    background: var(--tabbar);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-fab);
    transition: transform var(--dur-base) var(--ease-spring), box-shadow var(--dur-base), opacity var(--dur-base);
  }
  #fab:active { transform: scale(0.94); }
  #fab.hidden { display: none; }

  /* ── BOTTOM NAV ── */
  #bottom-nav {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--space-1);
    background: color-mix(in srgb, var(--surface) 92%, var(--tabbar));
    border-top: 0.5px solid color-mix(in srgb, var(--rule) 78%, transparent);
    padding: var(--space-2) var(--space-4) calc(var(--space-5) + env(safe-area-inset-bottom));
    flex-shrink: 0;
    box-shadow: 0 -4px 18px rgba(17,17,16,.045);
    position: relative;
    z-index: 10;
  }
  .nav-btn {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-1);
    background: none;
    border: none;
    cursor: pointer;
    min-height: 52px;
    padding: var(--space-2) 0;
    border-radius: var(--radius-md);
    color: var(--ink-faint);
    transition: background var(--dur-base), color var(--dur-base), transform var(--dur-base) var(--ease-out);
  }
  .nav-btn:active { transform: scale(0.985); }
  .nav-btn.active {
    background: color-mix(in srgb, var(--tabbar) 9%, transparent);
    color: var(--tabbar);
  }
  .nav-icon {
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nav-icon svg {
    width: 17px;
    height: 17px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .nav-label {
    max-width: 100%;
    font-size: var(--text-xs);
    font-weight: 700;
    font-family: var(--mono);
    color: currentColor;
    letter-spacing: 0;
    line-height: 1.1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .nav-indicator {
    width: 16px; height: 2px;
    border-radius: var(--radius-full);
    background: currentColor;
    display: none;
  }
  .nav-btn.active .nav-indicator { display: block; }

  /* ── MODALS ── */
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(17,17,16,0.34);
    z-index: 50;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-base) ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .command-overlay {
    position: absolute;
    inset: 0;
    z-index: 120;
    background: rgba(17,17,16,0.42);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-base) ease;
    padding: 88px var(--space-4) 0;
  }
  .command-overlay.open {
    opacity: 1;
    pointer-events: all;
  }
  .command-box {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
  }
  .command-input-wrap {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--rule);
  }
  .command-input-wrap svg {
    width: 17px;
    height: 17px;
    color: var(--ink-faint);
    flex-shrink: 0;
  }
  .command-input {
    width: 100%;
    min-width: 0;
    border: none;
    background: transparent;
    outline: none;
    font-family: var(--serif);
    font-size: var(--text-lg);
    color: var(--ink);
  }
  .command-input::placeholder { color: var(--ink-ghost); }
  .command-list {
    max-height: 430px;
    overflow-y: auto;
    padding: var(--space-2);
  }
  .command-item {
    width: 100%;
    min-height: var(--tap-comfortable);
    border: none;
    background: transparent;
    border-radius: var(--radius-sm);
    padding: var(--space-2) var(--space-3);
    display: flex;
    align-items: center;
    gap: var(--space-2);
    text-align: left;
    color: var(--ink-mid);
    cursor: pointer;
    font-family: var(--mono);
  }
  .command-item:active,
  .command-item.active {
    background: var(--deep);
  }
  .command-icon {
    width: 30px;
    height: 30px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--deep);
    color: var(--accent);
    flex-shrink: 0;
  }
  .command-icon svg {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .command-main { flex: 1; min-width: 0; }
  .command-title {
    font-family: var(--serif);
    font-size: var(--text-md);
    color: var(--ink);
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .command-kind {
    margin-top: 3px;
    font-size: var(--text-micro);
    font-weight: 700;
    color: var(--ink-faint);
    text-transform: uppercase;
    letter-spacing: 0.7px;
  }
  .command-empty {
    padding: var(--space-7) var(--space-3);
    text-align: center;
    color: var(--ink-faint);
    font-family: var(--serif);
    font-style: italic;
    font-size: var(--text-md);
  }
  .modal-sheet {
    background: var(--surface);
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    padding: var(--space-6) var(--space-5) var(--space-9);
    max-height: 85vh;
    overflow-y: auto;
    transform: translateY(100%);
    box-shadow: var(--shadow-sheet);
    transition: transform var(--dur-slow) var(--ease-out);
  }
  .modal-overlay.open .modal-sheet { transform: translateY(0); }
  .modal-handle {
    width: 36px; height: 4px;
    background: color-mix(in srgb, var(--ink-ghost) 68%, transparent);
    border-radius: var(--radius-full);
    margin: 0 auto var(--space-6);
  }
  .modal-label {
    font-size: var(--text-xs);
    font-weight: 700;
    letter-spacing: var(--tr-xs);
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: var(--space-2);
  }
  .modal-input {
    width: 100%;
    border: none;
    border-bottom: 1px solid color-mix(in srgb, var(--rule) 78%, transparent);
    background: transparent;
    min-height: var(--tap-min);
    padding: var(--space-2) 0;
    font-family: var(--serif);
    font-size: var(--text-lg);
    color: var(--ink);
    outline: none;
    margin-bottom: var(--space-6);
  }
  .modal-input::placeholder { color: var(--ink-ghost); }
  #new-task-title {
    font-size: var(--text-xl);
    padding: var(--space-4) 0;
    margin-bottom: var(--space-6);
    resize: none;
    line-height: 1.5;
    min-height: 80px;
  }
  #modal-add-task { background: rgba(17,17,16,0.18); }
  .task-sub-item {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-2) 0;
    border-bottom: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: var(--text-sm);
    font-weight: 500;
    color: var(--ink-mid);
  }
  .task-sub-item button {
    border: none;
    background: none;
    cursor: pointer;
    color: var(--ink-ghost);
    font-size: 16px;
    padding: 0 2px;
    line-height: 1;
  }
  .modal-textarea {
    width: 100%;
    border: 1px solid color-mix(in srgb, var(--rule) 70%, transparent);
    border-radius: var(--radius-md);
    background: color-mix(in srgb, var(--deep) 72%, var(--surface));
    min-height: var(--tap-min);
    padding: var(--space-3);
    font-family: var(--serif);
    font-size: var(--text-md);
    color: var(--ink);
    outline: none;
    margin-bottom: var(--space-5);
    resize: none;
    line-height: 1.5;
  }
  .modal-input-sm {
    width: 100%;
    border: none;
    border-bottom: 1px solid color-mix(in srgb, var(--rule) 78%, transparent);
    background: transparent;
    min-height: var(--tap-min);
    padding: var(--space-2) 0;
    font-family: var(--serif);
    font-size: var(--text-md);
    color: var(--ink);
    outline: none;
    margin-bottom: var(--space-5);
  }
  .modal-input-sm::placeholder { color: var(--ink-ghost); }
  .btn-group { display: flex; gap: var(--space-2); margin-bottom: var(--space-5); }
  #priority-group,
  #project-group,
  #repeat-group {
    display: block;
  }
  .choice-btn {
    flex: 1;
    min-height: var(--tap-comfortable);
    padding: 0 var(--space-2);
    border-radius: var(--radius-sm);
    border: 1px solid color-mix(in srgb, var(--rule) 74%, transparent);
    background: transparent;
    color: var(--ink-faint);
    font-size: var(--text-xs);
    font-weight: 700;
    letter-spacing: 0.3px;
    cursor: pointer;
    font-family: var(--mono);
    transition: border-color var(--dur-base), background var(--dur-base), color var(--dur-base), transform var(--dur-base) var(--ease-out);
  }
  .choice-btn:active { transform: scale(0.97); }
  .choice-btn.active {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-text);
  }
  .color-swatches { display: flex; gap: var(--space-3); margin-bottom: var(--space-6); }
  .color-swatch {
    width: 34px; height: 34px;
    border-radius: var(--radius-sm);
    border: none;
    cursor: pointer;
    position: relative;
    transition: box-shadow var(--dur-fast), transform var(--dur-fast) var(--ease-out);
  }
  .color-swatch::after {
    content: '';
    position: absolute;
    inset: -6px;
  }
  .color-swatch:active { transform: scale(0.94); }
  .color-swatch.selected { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--accent); }
  .project-color-field {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    margin-bottom: var(--space-6);
    padding: var(--space-2) 0 var(--space-1);
  }
  .project-color-field input[type="color"] {
    width: 54px;
    height: var(--tap-min);
    border: 1.5px solid var(--rule);
    border-radius: var(--radius-md);
    background: var(--surface);
    cursor: pointer;
    padding: 4px;
  }
  .project-color-value {
    font-size: var(--text-xs);
    font-weight: 700;
    color: var(--ink-mid);
    font-family: var(--mono);
  }
  .modal-checkbox-row {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    background: none;
    border: none;
    cursor: pointer;
    min-height: var(--tap-min);
    padding: var(--space-2) 0;
    margin-bottom: var(--space-5);
  }
  .checkbox-box {
    width: 22px; height: 22px;
    border-radius: var(--radius-xs);
    border: 1.5px solid var(--ink-ghost);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color var(--dur-fast), background var(--dur-fast);
    flex-shrink: 0;
  }
  .checkbox-box.checked {
    border-color: var(--accent);
    background: var(--accent);
  }
  .checkbox-box svg { display: none; }
  .checkbox-box.checked svg { display: block; }
  .checkbox-label { font-family: var(--serif); font-size: var(--text-sm); color: var(--ink-mid); }
  .date-choice-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--space-2);
    margin-bottom: var(--space-5);
  }
  .date-choice {
    min-height: 48px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--rule);
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    font-family: var(--mono);
    transition: border-color var(--dur-fast), background var(--dur-fast), color var(--dur-fast), transform var(--dur-fast) var(--ease-out);
  }
  .date-choice:active { transform: scale(0.97); }
  .date-choice.active {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-text);
  }
  .date-choice .date-day {
    display: block;
    font-size: var(--text-micro);
    font-weight: 700;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .date-choice .date-num {
    display: block;
    font-family: var(--serif);
    font-size: var(--text-md);
    line-height: 1;
  }
  .date-choice.no-date {
    grid-column: span 4;
  }
  .task-date-field {
    display: block;
    margin-bottom: 0;
  }
  .task-date-editor {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: var(--space-2);
    margin-bottom: var(--space-5);
  }
  .task-date-editor input[type="date"],
  .task-select {
    width: 100%;
    min-height: var(--tap-comfortable);
    border: 1.5px solid var(--rule);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--ink-mid);
    font-family: var(--mono);
    font-size: var(--text-sm);
    font-weight: 700;
    padding: 0 12px;
  }
  .task-date-clear,
  .task-time-clear,
  .repeat-toggle {
    min-height: var(--tap-comfortable);
    border: 1.5px solid var(--rule);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--ink-mid);
    font-family: var(--mono);
    font-size: var(--text-xs);
    font-weight: 700;
    padding: 0 14px;
    cursor: pointer;
  }
  .priority-grow { margin-bottom: var(--space-6); }
  .priority-grow button {
    width: 100%;
    min-height: var(--tap-large);
    border: 1.5px solid var(--rule);
    border-radius: var(--radius-md);
    background: var(--surface);
    padding: var(--space-2) var(--space-3);
    cursor: pointer;
  }
  .priority-meter {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-1);
    margin-bottom: var(--space-2);
  }
  .priority-meter span {
    height: 8px;
    border-radius: 999px;
    background: var(--deep);
  }
  .priority-meter span.on {
    background: var(--priority-color);
  }
  .priority-grow-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--mono);
    font-size: var(--text-xs);
    font-weight: 700;
    color: var(--priority-color);
  }
  .priority-grow-label small {
    color: var(--ink-faint);
    font-size: var(--text-micro);
    font-weight: 700;
  }
  .repeat-section { margin-bottom: var(--space-5); }
  .repeat-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .repeat-choice-group.collapsed { display: none; }
  .modal-submit {
    width: 100%;
    min-height: var(--tap-comfortable);
    padding: 0;
    border-radius: var(--radius-md);
    border: none;
    background: var(--rule);
    color: var(--ink-faint);
    font-size: var(--text-xs);
    font-weight: 700;
    cursor: pointer;
    font-family: var(--mono);
    letter-spacing: 1px;
    transition: background var(--dur-fast), color var(--dur-fast), transform var(--dur-fast) var(--ease-out);
  }
  .modal-submit:active { transform: scale(0.985); }

  .task-sheet-head {

  .task-sheet-sub-add {

  .task-sheet-submit {

  .task-sheet-submit.ready { background: var(--accent); color: var(--accent-text); }
  /* Sub-panel inner layouts */
  .tsp-datetime { display: flex; flex-direction: column; gap: var(--space-2); }
  .tsp-datetime .tsp-row { display: grid; grid-template-columns: 1fr auto; gap: var(--space-2); align-items: center; }
  .tsp-datetime input[type="date"],
  .tsp-datetime input[type="time"] {
    height: var(--tap-min);
    border: 1.5px solid var(--rule);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--ink-mid);
    font-family: var(--mono);
    font-size: var(--text-sm);
    font-weight: 700;
    padding: 0 12px;
    width: 100%;
    box-sizing: border-box;
  }
  .tsp-clear-btn {
    height: var(--tap-min);

  .tsp-priority { display: flex; gap: var(--space-2); }
  .priority-stepper {

  }
  .priority-stepper-meter span {
    height: 10px;
    border-radius: 999px;
    background: var(--deep);
  }
  .priority-stepper-meter span.on {
    background: var(--priority-color);
  }
  .priority-stepper-label {
    display: flex;

    color: var(--priority-color);

    color: var(--ink-faint);

  .tsp-priority-btn {

    font-family: var(--mono);

  }
  .tsp-repeat { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .tsp-repeat-btn {

    color: var(--ink-faint);
    font-size: var(--text-xs);
    font-weight: 700;
    font-family: var(--mono);
    cursor: pointer;
    transition: border-color var(--dur-fast), background var(--dur-fast), color var(--dur-fast), transform var(--dur-fast) var(--ease-out);
  }
  .tsp-repeat-btn:active { transform: scale(0.97); }
  .tsp-repeat-btn.active { border-color: var(--accent); background: var(--accent); color: var(--accent-text); }
  .tsp-project select {
    width: 100%;
    height: var(--tap-min);

  /* detail modal */
  .detail-top { display: flex; align-items: flex-start; gap: var(--space-4); margin-bottom: var(--space-5); }

  }

  }

  }
  .tag-row { display: flex; gap: var(--space-2); margin-bottom: var(--space-6); flex-wrap: wrap; }

  .subtask-row {

    min-height: var(--tap-min);
    padding: var(--space-2) 0;
    border-bottom: 1px solid var(--rule);
  }
  .sub-tick {
    width: 22px; height: 22px;
    border-radius: var(--radius-xs);
    border: 1.5px solid var(--ink-ghost);
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    transition: border-color var(--dur-fast), background var(--dur-fast), transform var(--dur-fast) var(--ease-out);
  }
  .sub-tick::after {
    content: '';
    position: absolute;
    inset: -11px;
  }
  .sub-tick:active { transform: scale(0.94); }
  .sub-tick.checked { border-color: var(--accent); background: var(--accent); }

  .habit-detail-check {
    width: 34px; height: 34px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--ink-ghost);
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 4px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    transition: border-color var(--dur-fast), background var(--dur-fast), transform var(--dur-fast) var(--ease-out);

  .modal-close-btn {

  /* bottom spacer */

  @media (max-width: 480px) {

      height: 100%;

<script>
// ─── PERSISTENCE ─────────────────────────────────────────────────────────────
function saveState() {
  const payloads = [
    ['fd-tasks', tasks],
    ['fd-habits', habits],
    ['fd-projects', PROJECTS],
  ];
  let ok = true;
  payloads.forEach(([key, value]) => {
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (error) {
      ok = false;
      console.warn(`FlowDo: nao foi possivel salvar ${key}`, error);
    }
  });
  return ok;
}
function loadState() {
  const readJSON = (key, fallback) => {
    try {
      const value = localStorage.getItem(key);
      return value ? JSON.parse(value) : fallback;
    } catch (error) {
      console.warn(`FlowDo: nao foi possivel carregar ${key}`, error);
      return fallback;
    }
  };
  tasks = readJSON('fd-tasks', tasks);
  habits = readJSON('fd-habits', habits);
  const savedProjects = readJSON('fd-projects', PROJECTS);
  if (Array.isArray(savedProjects)) PROJECTS.splice(0, PROJECTS.length, ...savedProjects);
}

const notificationTimers = new Map();

function notifiedTaskKeys() {
  try { return JSON.parse(localStorage.getItem('fd-notified-tasks') || '[]'); }
  catch(e) { return []; }
}

function markTaskNotified(key) {
  const keys = new Set(notifiedTaskKeys());
  keys.add(key);
  localStorage.setItem('fd-notified-tasks', JSON.stringify([...keys].slice(-80)));
}

function taskNotificationKey(task) {
  return `${task.id}:${task.date || ''}:${task.time || ''}`;
}

function taskNotificationTime(task) {
  if (!task.date || !task.time) return null;
  const [year, month, day] = task.date.split('-').map(Number);
  const [hour, minute] = task.time.split(':').map(Number);
  if (![year, month, day, hour, minute].every(Number.isFinite)) return null;
  return new Date(year, month - 1, day, hour, minute).getTime();
}

function canUseNotifications() {
  return 'Notification' in window && window.isSecureContext;
}

function requestNotificationsForTask(task) {
  if (!task.date || !task.time || !canUseNotifications()) return;
  if (Notification.permission === 'default') {
    Notification.requestPermission().then(() => {
      renderProfile();
      scheduleNotifications();
    });
  } else {
    scheduleNotifications();
  }
}

function scheduleTaskNotifications() {
  notificationTimers.forEach(timer => clearTimeout(timer));
  notificationTimers.clear();
  if (!canUseNotifications() || Notification.permission !== 'granted') return;

  const alreadyNotified = new Set(notifiedTaskKeys());
  const now = Date.now();
  const maxDelay = 2147483647;
  const GRACE = 30 * 60 * 1000; // show missed notifications up to 30 min late

  tasks.forEach(task => {
    if (task.done || !task.date || !task.time) return;
    const key = taskNotificationKey(task);
    if (alreadyNotified.has(key)) return;
    const at = taskNotificationTime(task);
    if (!at) return;
    const delay = at - now;
    if (delay < -GRACE) return; // missed by more than 30 min, skip
    if (delay <= 0) { showTaskNotification(task.id, key); return; } // fire immediately
    if (delay > maxDelay) return;
    const timer = setTimeout(() => showTaskNotification(task.id, key), delay);
    notificationTimers.set(key, timer);
  });
}

function showTaskNotification(taskId, key) {
  notificationTimers.delete(key);
  const task = tasks.find(item => item.id === taskId);
  if (!task || task.done || taskNotificationKey(task) !== key) return;
  if (!canUseNotifications() || Notification.permission !== 'granted') return;

  const options = {
    body: task.time ? `${task.time} - ${task.title}` : task.title,
    icon: './icon.svg',
    badge: './icon.svg',
    tag: `flowdo-task-${key}`,
    renotify: true,
  };

  markTaskNotified(key);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.ready
      .then(reg => reg.showNotification('FlowDo', options))
      .catch(() => new Notification('FlowDo', options));
  } else {
    new Notification('FlowDo', options);
  }
}

// ─── HABIT NOTIFICATIONS ──────────────────────────────────────────────────────
const habitNotificationTimers = new Map();

function notifiedHabitKeys() {
  try { return JSON.parse(localStorage.getItem('fd-notified-habits') || '[]'); }
  catch(e) { return []; }
}

function markHabitNotified(key) {
  const keys = new Set(notifiedHabitKeys());
  keys.add(key);
  localStorage.setItem('fd-notified-habits', JSON.stringify([...keys].slice(-200)));
}

function habitNotificationKey(habit, dateStr) {
  return `${habit.id}:${dateStr}:${habit.reminderTime}`;
}

function scheduleHabitNotifications() {
  habitNotificationTimers.forEach(timer => clearTimeout(timer));
  habitNotificationTimers.clear();
  if (!canUseNotifications() || Notification.permission !== 'granted') return;

  const alreadyNotified = new Set(notifiedHabitKeys());
  const now = Date.now();
  const maxDelay = 2147483647;
  const GRACE = 30 * 60 * 1000;

  // Schedule for today and the next 2 days
  for (let dayOffset = 0; dayOffset <= 2; dayOffset++) {
    const d = new Date();
    d.setDate(d.getDate() + dayOffset);
    const dateStr = formatDateKey(d);

    habits.forEach(habit => {
      if (!habit.reminderTime) return;
      const key = habitNotificationKey(habit, dateStr);
      if (alreadyNotified.has(key)) return;

      const [hour, minute] = habit.reminderTime.split(':').map(Number);
      if (!Number.isFinite(hour) || !Number.isFinite(minute)) return;
      const at = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hour, minute).getTime();
      const delay = at - now;
      if (delay < -GRACE) return;
      if (delay <= 0) { showHabitNotification(habit.id, key); return; }
      if (delay > maxDelay) return;
      const timer = setTimeout(() => showHabitNotification(habit.id, key), delay);
      habitNotificationTimers.set(key, timer);
    });
  }
}

function showHabitNotification(habitId, key) {
  habitNotificationTimers.delete(key);
  const habit = habits.find(h => h.id === habitId);
  if (!habit || !habit.reminderTime) return;
  if (!canUseNotifications() || Notification.permission !== 'granted') return;

  const options = {
    body: habit.cue ? `${habit.cue} — ${habit.name}` : habit.name,
    icon: './icon.svg',
    badge: './icon.svg',
    tag: `flowdo-habit-${key}`,
    renotify: true,
  };

  markHabitNotified(key);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.ready
      .then(reg => reg.showNotification('FlowDo', options))
      .catch(() => new Notification('FlowDo', options));
  } else {
    new Notification('FlowDo', options);
  }
}

function scheduleNotifications() {
  scheduleTaskNotifications();
  scheduleHabitNotifications();
}

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const TODAY_DATE = (() => {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
})();
const TODAY = formatDateKey(TODAY_DATE);
const TODAY_IDX = (TODAY_DATE.getDay() + 6) % 7; // 0=Seg, 6=Dom
const WEEK_BASE_MONDAY = (() => {
  const d = new Date(TODAY_DATE.getTime());
  d.setDate(d.getDate() - TODAY_IDX);
  return formatDateKey(d);
})();
const WEEK_DATES = (() => {
  const base = parseDateKey(WEEK_BASE_MONDAY);
  const arr = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(base.getTime());
    d.setDate(d.getDate() + i);
    arr.push(formatDateKey(d));
  }
  return arr;
})();
const DAYS_LETTER = ['S','T','Q','Q','S','S','D'];
const DAYS_SHORT  = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const MONTHS_LONG = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DATES_MAP = {};
const MONTH_WEEKS = ['Abr 7','Abr 14','Abr 21','Abr 28','Mai 5'];
const PROJECTS = [
  { id:1, name:'Trabalho', dot:'#C84B2F' },
  { id:2, name:'Pessoal',  dot:'#B07D2A' },
  { id:3, name:'Saúde',    dot:'#2A6E4A' },
];
const PRIORITY = {
  alta:  { label:'Alta',  color:'#C84B2F', bg:'#F5EDE9' },
  média: { label:'Média', color:'#B07D2A', bg:'#F5F0E6' },
  baixa: { label:'Baixa', color:'#2A6E4A', bg:'#E6F0EB' },
};
const COLORS = ['#C84B2F','#B07D2A','#2A6E4A','#2A5FA3','#7A4FA3'];
const REPEAT_OPTIONS = [
  { id:'nenhuma', label:'Unica' },
  { id:'diaria', label:'Diaria' },
  { id:'semanal', label:'Semanal' },
];
const PROFILE_ITEMS = [
  { id:'appearance', label:'Aparência' },
  { id:'notifications', label:'Notificações' },
  { id:'update', label:'Atualizar app' },
  { id:'account', label:'Conta' },

];
const PROFILE_TIPS = [
  'Arraste uma tarefa para a direita para jogar para o proximo dia.',
  'Use Cmd/Ctrl+K para buscar tarefas, habitos, projetos e comandos.',
  'No calendario mensal, toque em um dia para abrir a lista daquele dia.',

];

function makeHeatmap(pct) {
  return Array.from({length:35},(_,i)=>i<32?Math.random()<pct:null);
}
function alignHabitWeek(week, offset) {
  return Array.from({length: 7}, (_, i) => {
    const isFutureDay = offset === 0 && i > TODAY_IDX;
    if (isFutureDay) return null;
    return Array.isArray(week) && week[i] === true ? true : false;
  });
}
function normalizeHabits() {
  habits.forEach(h => {
    h.week = alignHabitWeek(h.week, 0);
    if (h.weekPages) {
      Object.keys(h.weekPages).forEach(k => {
        h.weekPages[k] = alignHabitWeek(h.weekPages[k], parseInt(k));
      });
    }
  });
}
function getHabitWeek(h) {
  if (habitWeekOffset === 0) return h.week;
  h.weekPages = h.weekPages || {};
  if (!h.weekPages[habitWeekOffset]) {
    h.weekPages[habitWeekOffset] = alignHabitWeek(null, habitWeekOffset);

  return h.weekPages[habitWeekOffset];

function clampDay(day) {
  return Math.max(0, Math.min(WEEK_DATES.length - 1, day));
}

function parseDateKey(dateKey) {
  const [year, month, day] = dateKey.split('-').map(Number);
  return new Date(year, month - 1, day);
}

function formatDateKey(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function addDays(dateKey, amount) {
  const date = parseDateKey(dateKey);
  date.setDate(date.getDate() + amount);
  return formatDateKey(date);
}

function getDateLabel(dateKey) {
  if (!dateKey) return 'Sem data';
  if (DATES_MAP[dateKey]) return DATES_MAP[dateKey];
  const idx = WEEK_DATES.indexOf(dateKey);
  const date = parseDateKey(dateKey);
  const label = `${DAYS_SHORT[idx >= 0 ? idx % 7 : (date.getDay() + 6) % 7]} ${date.getDate()}`;
  DATES_MAP[dateKey] = label;
  return label;
}

function rebuildCurrentWeekDates() {
  const base = parseDateKey(WEEK_BASE_MONDAY);
  for (let i = 0; i < 7; i++) {
    const d = new Date(base.getTime());
    d.setDate(d.getDate() + weekOffset * 7 + i);
    WEEK_DATES[i] = formatDateKey(d);
  }
  WEEK_DATES.length = 7;
}

function ensureDateInWeek(dateKey) {
  let idx = WEEK_DATES.indexOf(dateKey);
  if (idx >= 0) return idx;
  const base = parseDateKey(WEEK_BASE_MONDAY);
  const target = parseDateKey(dateKey);
  const diffDays = Math.round((target - base) / 86400000);
  weekOffset = Math.floor(diffDays / 7);
  rebuildCurrentWeekDates();
  return Math.max(0, WEEK_DATES.indexOf(dateKey));
}

function setupCalendarSwipe() {
  const content = document.getElementById('content');
  if (!content) return;

  let startX = 0, startY = 0, started = false, blocked = false;
  let dragging = false, screen = null, width = 0, lastX = 0, lastT = 0, velocity = 0, currentDx = 0;
  let rafId = 0, pendingDx = 0;
  const BLOCKED_SELECTOR = 'button,input,textarea,select,.task-row,.habit-card,.modal-overlay,[data-heatmap-day],[data-detail-heatmap]';

  const rubber = dx => {
    const limit = width * 0.6;
    const ax = Math.abs(dx);
    if (ax <= limit) return dx;
    return Math.sign(dx) * (limit + (ax - limit) * 0.35);
  };

  const applyTransform = () => {
    rafId = 0;
    if (screen) screen.style.transform = `translateX(${rubber(pendingDx)}px)`;
  };

  const clearTransform = el => {
    if (!el) return;
    el.classList.remove('swipe-anim');
    el.style.transform = '';
  };

  const settleBack = el => {
    if (!el) return;
    el.classList.add('swipe-anim');
    el.style.transform = 'translateX(0px)';
    const done = ev => {
      if (ev.propertyName !== 'transform') return;
      el.removeEventListener('transitionend', done);
      clearTransform(el);
    };
    el.addEventListener('transitionend', done);
  };

  const commitSwipe = (el, dir) => {
    if (!el) return;
    el.classList.add('swipe-anim');
    el.style.transform = `translateX(${dir * -width}px)`;
    const done = ev => {
      if (ev.propertyName !== 'transform') return;
      el.removeEventListener('transitionend', done);
      clearTransform(el);
      shiftTodayView(dir);
      const next = document.querySelector('.screen.active');
      if (!next) return;
      next.style.transform = `translateX(${dir * width}px)`;
      void next.offsetWidth;
      next.classList.add('swipe-anim');
      next.style.transform = 'translateX(0px)';
      const done2 = ev2 => {
        if (ev2.propertyName !== 'transform') return;
        next.removeEventListener('transitionend', done2);
        clearTransform(next);
      };
      next.addEventListener('transitionend', done2);
    };
    el.addEventListener('transitionend', done);
  };

  content.addEventListener('pointerdown', e => {
    started = currentNav === 'hoje';
    blocked = !started || !!e.target.closest(BLOCKED_SELECTOR);
    startX = e.clientX;
    startY = e.clientY;
    lastX = e.clientX;
    lastT = performance.now();
    velocity = 0;
    currentDx = 0;
    pendingDx = 0;
    dragging = false;
    calendarSwipeActive = false;
    if (!blocked) {
      width = content.clientWidth || window.innerWidth;
      screen = document.querySelector('.screen.active');
      if (screen) clearTransform(screen);
    } else {
      screen = null;
    }
  });

  content.addEventListener('pointermove', e => {
    if (!started || blocked) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (!dragging) {
      if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.45) {
        dragging = true;
        calendarSwipeActive = true;
      } else {
        return;
      }
    }
    const now = performance.now();
    const dt = Math.max(1, now - lastT);
    velocity = (e.clientX - lastX) / dt;
    lastX = e.clientX;
    lastT = now;
    currentDx = dx;
    pendingDx = dx;
    if (!rafId) rafId = requestAnimationFrame(applyTransform);
  }, { passive: true });

  const endSwipe = () => {
    if (!started) return;
    started = false;
    const wasDragging = dragging;
    dragging = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    if (!wasDragging) {
      calendarSwipeActive = false;
      return;
    }
    const el = screen;
    screen = null;
    const threshold = width * 0.25;
    const fastFlick = Math.abs(velocity) > 0.5 && Math.abs(currentDx) > 24;
    const commit = Math.abs(currentDx) >= threshold || fastFlick;
    if (commit) {
      const dir = currentDx < 0 ? 1 : -1;
      content.dataset.swiped = 'true';
      commitSwipe(el, dir);
    } else {
      settleBack(el);
    }
    calendarSwipeActive = false;
  };

  content.addEventListener('pointerup', endSwipe);
  content.addEventListener('pointercancel', () => {
    if (started && dragging && screen) settleBack(screen);
    started = false;
    dragging = false;
    screen = null;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    calendarSwipeActive = false;
  });

  content.addEventListener('click', e => {
    if (content.dataset.swiped !== 'true') return;
    e.preventDefault();
    e.stopPropagation();
    content.dataset.swiped = 'false';
  }, true);
}

function normalizeSearch(value) {
  return String(value || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '');
}

function fuzzyMatch(text, query) {
  const target = normalizeSearch(text);
  const needle = normalizeSearch(query);
  if (!needle) return true;
  let pos = 0;
  for (const char of needle) {
    pos = target.indexOf(char, pos);
    if (pos === -1) return false;
    pos += 1;
  }
  return true;
}
