<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>FlowDo</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#111110"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="FlowDo"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Courier+Prime:wght@400;700&family=DM+Mono:wght@400;500;700&family=DM+Sans:wght@400;600;700&family=Fraunces:wght@400;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;600;700&family=Josefin+Sans:wght@300;400;600&family=Lato:wght@400;700&family=Libre+Baskerville:wght@400;700&family=Libre+Caslon+Display&family=Nunito:wght@400;600;700&family=Source+Serif+4:wght@400;600;700&family=Source+Serif+Pro:wght@400;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #F5F4F0;
    --surface:  #FFFFFF;
    --ink:      #111110;
    --ink-mid:  #5A5A55;
    --ink-faint:#B0AFA8;
    --ink-ghost:#D8D7D0;
    --rule:     #E2E1DA;
    --deep:     #EDECE8;
    --red:      #C84B2F;
    --red-soft: #F5EDE9;
    --amber:    #B07D2A;
    --amb-soft: #F5F0E6;
    --green:    #2A6E4A;
    --grn-soft: #E6F0EB;
    --blue:     #2A5FA3;
    --accent:   #111110;
    --accent-text: #FFFFFF;
    --day-selected: #111110;
    --day-selected-text: #FFFFFF;
    --tabbar:   #111110;
    --tabbar-text: #FFFFFF;
    --serif:    'Instrument Serif', serif;
    --mono:     'DM Mono', monospace;
  }

  body.dark {
    --bg:       #111110;
    --surface:  #1C1C1A;
    --ink:      #111110;
    --ink-mid:  #C7C5BD;
    --ink-faint:#8E8C84;
    --ink-ghost:#3B3A36;
    --rule:     #2A2926;
    --deep:     #181816;
    background: #050505;
  }
  body.dark .page-title,
  body.dark .count-num,
  body.dark .task-title,
  body.dark .habit-name,
  body.dark .habit-month-name,
  body.dark .project-name,
  body.dark .detail-title,
  body.dark .habit-detail-title,
  body.dark .profile-name {
    color: var(--ink);
  }
  body.dark .profile-item,
  body.dark .project-task-title,
  body.dark .meta-proj,
  body.dark .day-btn.today .day-num {
    color: var(--ink-mid);
  }

  html, body {
    height: 100%;
    background: #CCC;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
  }

  /* ── PHONE SHELL ── */
  #app {
    width: 390px;
    height: 844px;
    background: var(--bg);
    border-radius: 44px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 32px 80px rgba(0,0,0,0.28);
    flex-shrink: 0;
  }

  /* ── HEADER ── */
  #header {
    padding: 14px 20px 0;
    flex-shrink: 0;
  }
  #header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 8px;
  }
  .page-sub {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .page-title {
    font-family: var(--serif);
    font-size: 31px;
    font-weight: 400;
    color: var(--ink);
    line-height: 1;
    margin-top: 3px;
  }
  #task-count {
    text-align: right;
  }
  #task-count .count-num {
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 400;
    color: var(--ink);
    line-height: 1;
  }
  #task-count .count-num span { font-size: 14px; color: var(--ink-faint); }
  #task-count .count-label {
    font-size: 9px;
    color: var(--ink-faint);
    letter-spacing: 0.6px;
    margin-top: 2px;
  }

  /* ── PROGRESS BAR ── */
  .progress-bar {
    height: 1.5px;
    background: var(--rule);
    margin-bottom: 0;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 1px;
    transition: width 0.5s ease;
  }

  /* ── VIEW TOGGLE ── */
  .view-toggle {
    display: flex;
    background: var(--deep);
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 14px;
  }
  .view-toggle button {
    flex: 1;
    padding: 7px 0;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--mono);
    letter-spacing: 0.5px;
    transition: all 0.15s;
  }
  .view-toggle button.active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  /* ── WEEK STRIP ── */
  #week-strip {
    display: flex;
    align-items: center;
    padding: 6px 10px;
    gap: 0;
  }
  .week-nav-arrow {
    flex-shrink: 0;
    width: 28px;
    height: 44px;
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--ink-faint);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    padding: 0;
  }
  .week-nav-arrow:active { color: var(--ink-mid); }
  .week-nav-days {
    flex: 1;
    display: flex;
    overflow-x: scroll;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-left: calc(50% - 29px);
    padding-right: calc(50% - 29px);
  }
  .week-nav-days::-webkit-scrollbar { display: none; }
  .inline-task-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 22px 20px 20px;
    margin: 0 -20px 6px;
    background: var(--deep);
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
  }
  .inline-task-input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    font-family: var(--serif);
    font-size: 19px;
    color: var(--ink);
    outline: none;
    padding: 0;
  }
  .inline-task-input::placeholder {
    color: var(--ink-faint);
    font-style: italic;
  }
  .day-btn {
    flex: 0 0 auto;
    scroll-snap-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 9px 10px;
    border-radius: 11px;
    border: none;
    cursor: pointer;
    background: transparent;
    min-width: 38px;
    transition: background 0.15s;
  }
  .day-btn.active { background: var(--day-selected); }
  .day-letter {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .day-btn.active .day-letter { color: color-mix(in srgb, var(--day-selected-text) 52%, transparent); }
  .day-num {
    font-family: var(--serif);
    font-size: 15px;
    color: var(--ink-mid);
  }
  .day-btn.today .day-num { color: var(--ink); }
  .day-btn.active .day-num { color: var(--day-selected-text); }
  [data-theme="sol"] .day-btn.active .day-num { color: #F5C430; }
  [data-theme="sol"] .nav-btn.active { color: #F5C430 !important; }
  .day-dot {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--red);
  }

  /* ── SCROLL CONTENT ── */
  #content {
    flex: 1;
    min-height: 0;
    overflow-y: scroll;
    scrollbar-width: none;
  }
  #content::-webkit-scrollbar { display: none; }

  /* ── SCREENS ── */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ── TASK LIST ── */
  .task-list { padding: 0 20px; }
  .section-label {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 400;
    letter-spacing: -0.2px;
    text-transform: none;
    color: var(--ink);
    margin: 24px 0 4px;
    padding-bottom: 6px;
    border-bottom: 1.5px solid var(--ink);
  }
  .section-label.today { color: var(--ink); }
  .section-label.nodate {
    color: var(--ink-mid);
    border-bottom-color: var(--ink-mid);
    border-bottom-style: dashed;
    font-style: italic;
  }

  .task-row {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    transition: opacity 0.2s, transform 0.25s ease;
    position: relative;
    touch-action: pan-y;
    user-select: none;
  }
  .task-row.done { opacity: 0.38; }
  .task-row.dragging {
    transition: none;
    z-index: 2;
    background: var(--surface);
    border-radius: 12px;
    box-shadow: 0 10px 22px rgba(17,17,16,0.1);
  }
  .task-row.drag-ready {
    transform: scale(0.985);
    opacity: 0.9;
  }

  .drag-hint {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    border-radius: 9px;
    padding: 8px 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.1s;
    white-space: nowrap;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    z-index: 0;
  }
  .drag-hint.left { right: 0; background: var(--red); }
  .drag-hint.right { left: 0; background: var(--green); }

  .day-shift-toast {
    position: absolute;
    left: 50%;
    bottom: 146px;
    transform: translateX(-50%) translateY(8px);
    background: var(--accent);
    color: var(--accent-text);
    border-radius: 10px;
    padding: 9px 13px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.16s ease, transform 0.16s ease;
    z-index: 30;
    box-shadow: 0 10px 26px rgba(17,17,16,0.18);
  }
  .day-shift-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .tick-btn {
    width: 20px; height: 20px;
    border-radius: 5px;
    border: 1.5px solid var(--ink-ghost);
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .tick-btn.checked {
    border-color: var(--check-color, var(--ink));
    background: var(--check-color, var(--ink));
  }
  .tick-btn svg { display: none; }
  .tick-btn.checked svg { display: block; }

  .task-body { flex: 1; min-width: 0; }
  .task-title {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 400;
    color: var(--ink);
    line-height: 1.35;
  }
  .task-row.done .task-title { text-decoration: line-through; }
  .task-meta {
    display: flex;
    gap: 10px;
    margin-top: 5px;
    align-items: center;
    flex-wrap: wrap;
  }
  .meta-proj {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    color: var(--ink-mid);
    font-weight: 500;
  }
  .proj-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .meta-time, .meta-nodate, .meta-sub {
    font-size: 11.5px;
    color: var(--ink-faint);
  }
  .meta-nodate { font-style: italic; font-size: 10px; }
  .priority-badge {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.7px;
    text-transform: uppercase;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .priority-dot { width: 4px; height: 4px; border-radius: 50%; }

  /* ── RESCHEDULE ── */
  .reschedule-panel {
    background: var(--deep);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 4px;
    border: 1px solid var(--rule);
  }
  .reschedule-panel .panel-label {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  .reschedule-dates {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .reschedule-dates button {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1.5px solid var(--rule);
    background: var(--surface);
    color: var(--ink-mid);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    font-family: var(--mono);
    transition: all 0.12s;
  }
  .reschedule-dates button:hover {
    border-color: var(--ink);
    color: var(--ink);
  }
  .reschedule-dates button.cancel {
    background: transparent;
    color: var(--ink-faint);
    border-color: var(--rule);
  }

  /* ── MONTH CALENDAR ── */
  .month-view { padding: 0 20px; }
  .month-day-headers {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
  }
  .month-day-headers span {
    flex: 1;
    text-align: center;
    font-size: 9px;
    font-weight: 700;
    color: var(--ink-faint);
  }
  .month-week { display: flex; gap: 4px; margin-bottom: 4px; }
  .month-cell {
    flex: 1;
    aspect-ratio: 1;
    border-radius: 8px;
    background: var(--deep);
    border: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .month-cell.empty { background: transparent; border-color: transparent; }
  .month-cell.today { background: var(--day-selected); border-color: var(--day-selected); }
  .month-cell .cell-num {
    font-size: 10px;
    font-weight: 400;
    color: var(--ink-mid);
    line-height: 1;
  }
  .month-cell.today .cell-num { color: var(--day-selected-text); font-weight: 700; }
  .cell-dots { display: flex; gap: 2px; }
  .cell-dot { width: 4px; height: 4px; border-radius: 50%; }
  .month-legend {
    display: flex;
    gap: 14px;
    margin-top: 12px;
    justify-content: flex-end;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 9.5px;
    color: var(--ink-faint);
  }
  .legend-dot { width: 6px; height: 6px; border-radius: 50%; }

  /* ── HABITS ── */
  .habits-list { padding: 0 16px; }
  .habits-summary {
    padding: 0 20px 16px;
    font-size: 11px;
    color: var(--ink-faint);
  }

  .habit-card {
    background: var(--surface);
    border-radius: 18px;
    padding: 16px 18px;
    margin-bottom: 10px;
    border: 1px solid var(--rule);
    cursor: pointer;
  }
  .habit-top {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }
  .habit-check {
    width: 26px; height: 26px;
    border-radius: 8px;
    border: 1.5px solid var(--ink-ghost);
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .habit-check.done {
    border-color: var(--habit-color);
    background: var(--habit-color);
  }
  .habit-check svg { display: none; }
  .habit-check.done svg { display: block; }
  .habit-info { flex: 1; }
  .habit-name {
    font-family: var(--serif);
    font-size: 16.5px;
    color: var(--ink);
    line-height: 1.3;
  }
  .habit-cue {
    font-size: 12px;
    color: var(--ink-faint);
    margin-top: 4px;
  }
  .habit-streak { text-align: right; flex-shrink: 0; }
  .streak-num {
    font-family: var(--serif);
    font-size: 20px;
    color: var(--habit-color);
    line-height: 1;
  }
  .streak-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 1px;
  }

  /* week grid */
  .week-grid { display: flex; gap: 5px; }
  .week-cell-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .week-cell {
    width: 100%;
    height: 26px;
    border-radius: 6px;
    background: var(--deep);
    border: 1px solid transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .week-cell[data-habit-day] { cursor: pointer; }
  .month-cell:not(.empty) { cursor: pointer; }
  .month-cell:not(.empty):hover { opacity: 0.8; }
  .week-cell.done { background: var(--habit-color); }
  .week-cell.today-cell { border-color: var(--ink-ghost); }
  .week-cell.future { opacity: 0.3; }
  .week-cell-label {
    font-size: 8.5px;
    font-weight: 700;
    color: var(--ink-faint);
  }
  .week-cell-label.today-label { color: var(--ink-mid); }
  .week-cell-dash { width: 6px; height: 1.5px; background: var(--ink-ghost); border-radius: 1px; }

  /* heatmap */
  .heatmap { width: 100%; }
  .heatmap-header {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
  }
  .heatmap-header-spacer { width: 38px; flex-shrink: 0; }
  .heatmap-header span {
    flex: 1;
    text-align: center;
    font-size: 8.5px;
    font-weight: 700;
    color: var(--ink-faint);
  }
  .heatmap-row {
    display: flex;
    gap: 4px;
    margin-bottom: 4px;
    align-items: center;
  }
  .heatmap-week-label {
    width: 38px;
    font-size: 8.5px;
    color: var(--ink-faint);
    flex-shrink: 0;
  }
  .heatmap-cell {
    flex: 1;
    aspect-ratio: 1;
    border-radius: 4px;
    background: var(--deep);
    border: 1px solid transparent;
  }
  .heatmap-cell.done {
    background: var(--habit-color);
    border-color: color-mix(in srgb, var(--habit-color) 40%, transparent);
  }
  .heatmap-cell.missed { background: var(--deep); opacity: 0.55; }
  .heatmap-cell.future { opacity: 0.2; }
  .heatmap-cell[data-heatmap-day] {
    cursor: pointer;
    transition: transform 0.12s, opacity 0.12s;
  }
  .heatmap-cell[data-heatmap-day]:active { transform: scale(0.92); }

  /* add habit btn */
  .add-habit-btn {
    width: 100%;
    padding: 14px 0;
    border-radius: 14px;
    border: 1.5px dashed var(--ink-ghost);
    background: transparent;
    color: var(--ink-faint);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    font-family: var(--mono);
    margin-bottom: 90px;
    transition: border-color 0.15s, color 0.15s;
  }
  .add-habit-btn:hover { border-color: var(--ink-mid); color: var(--ink-mid); }
  .habit-card.dragging { transition: none; }
  .habit-card.drag-ready { transform: scale(0.985); opacity: 0.9; }

  /* mensal habit cards */
  .habit-month-card {
    background: var(--surface);
    border-radius: 18px;
    padding: 16px 18px;
    margin-bottom: 10px;
    border: 1px solid var(--rule);
  }
  .habit-month-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .habit-month-dot { width: 10px; height: 10px; border-radius: 50%; }
  .habit-month-name {
    font-family: var(--serif);
    font-size: 15px;
    color: var(--ink);
  }
  .habit-month-streak {
    margin-left: auto;
    font-family: var(--serif);
    font-size: 14px;
  }
  .period-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 0 4px 14px;
  }
  .period-nav button {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1.5px solid var(--rule);
    background: var(--surface);
    color: var(--ink-mid);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .period-label {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-mid);
    text-transform: uppercase;
  }

  /* ── PROJECTS ── */
  .projects-view { padding: 0 20px; }
  .project-block {
    padding-bottom: 26px;
    margin-bottom: 26px;
    border-bottom: 1px solid var(--rule);
  }

  /* ── THEME OVERRIDES ── */

  /* ── FAB ── */

  .btn-group { display: flex; gap: 7px; margin-bottom: 18px; }
  #priority-group,

  .date-choice-grid {

// ─── PERSISTENCE ─────────────────────────────────────────────────────────────
function saveState() {
  try {
    localStorage.setItem('fd-tasks', JSON.stringify(tasks));
    localStorage.setItem('fd-habits', JSON.stringify(habits));
    localStorage.setItem('fd-projects', JSON.stringify(PROJECTS));
  } catch(e) {}
}
function loadState() {
  try {
    const t = localStorage.getItem('fd-tasks');
    const h = localStorage.getItem('fd-habits');
    const p = localStorage.getItem('fd-projects');
    if (t) tasks = JSON.parse(t);
    if (h) habits = JSON.parse(h);
    if (p) PROJECTS.splice(0, PROJECTS.length, ...JSON.parse(p));
  } catch(e) {}
}

const notificationTimers = new Map();

function notifiedTaskKeys() {
  try { return JSON.parse(localStorage.getItem('fd-notified-tasks') || '[]'); }
  catch(e) { return []; }
}

function markTaskNotified(key) {
  const keys = new Set(notifiedTaskKeys());
  keys.add(key);
  localStorage.setItem('fd-notified-tasks', JSON.stringify([...keys].slice(-80)));
}

function taskNotificationKey(task) {
  return `${task.id}:${task.date || ''}:${task.time || ''}`;
}

function taskNotificationTime(task) {
  if (!task.date || !task.time) return null;
  const [year, month, day] = task.date.split('-').map(Number);
  const [hour, minute] = task.time.split(':').map(Number);
  if (![year, month, day, hour, minute].every(Number.isFinite)) return null;
  return new Date(year, month - 1, day, hour, minute).getTime();
}

function canUseNotifications() {
  return 'Notification' in window && window.isSecureContext;
}

function requestNotificationsForTask(task) {
  if (!task.date || !task.time || !canUseNotifications()) return;
  if (Notification.permission === 'default') {
    Notification.requestPermission().then(() => {
      renderProfile();
      scheduleTaskNotifications();
    });
  } else {
    scheduleTaskNotifications();
  }
}

function scheduleTaskNotifications() {
  notificationTimers.forEach(timer => clearTimeout(timer));
  notificationTimers.clear();
  if (!canUseNotifications() || Notification.permission !== 'granted') return;

  const alreadyNotified = new Set(notifiedTaskKeys());
  const now = Date.now();
  const maxDelay = 2147483647;

  tasks.forEach(task => {
    if (task.done || !task.date || !task.time) return;
    const key = taskNotificationKey(task);
    if (alreadyNotified.has(key)) return;
    const at = taskNotificationTime(task);
    if (!at || at <= now) return;
    const delay = at - now;
    if (delay > maxDelay) return;

    const timer = setTimeout(() => showTaskNotification(task.id, key), delay);
    notificationTimers.set(key, timer);
  });
}

function showTaskNotification(taskId, key) {
  notificationTimers.delete(key);
  const task = tasks.find(item => item.id === taskId);
  if (!task || task.done || taskNotificationKey(task) !== key) return;
  if (!canUseNotifications() || Notification.permission !== 'granted') return;

  const options = {
    body: task.time ? `${task.time} - ${task.title}` : task.title,
    icon: './icon.svg',
    badge: './icon.svg',
    tag: `flowdo-task-${key}`,
    renotify: true,
  };

  markTaskNotified(key);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.ready
      .then(reg => reg.showNotification('FlowDo', options))
      .catch(() => new Notification('FlowDo', options));
  } else {
    new Notification('FlowDo', options);
  }
}

function makeHeatmap(pct) {
  return Array.from({length:35},(_,i)=>i<32?Math.random()<pct:null);
}
function getHabitWeek(h) {
  if (habitWeekOffset === 0) return h.week;
  h.weekPages = h.weekPages || {};
  if (!h.weekPages[habitWeekOffset]) h.weekPages[habitWeekOffset] = [false,false,false,false,false,null,null];
  return h.weekPages[habitWeekOffset];
}
function getHabitHeatmap(h) {
  if (habitMonthOffset === 0) return h.heatmap;
  h.heatmapPages = h.heatmapPages || {};
  if (!h.heatmapPages[habitMonthOffset]) h.heatmapPages[habitMonthOffset] = makeHeatmap(0);
  return h.heatmapPages[habitMonthOffset];
}
function periodLabel(kind) {
  if (kind === 'semana') {
    if (habitWeekOffset === 0) return 'Esta semana';
    return habitWeekOffset > 0 ? `${habitWeekOffset + 1} semanas a frente` : `${Math.abs(habitWeekOffset)} semanas atras`;
  }
  const base = new Date(2026, 4 + habitMonthOffset, 1);
  return base.toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
}
function periodNavHTML(kind) {

    <div class="period-nav">
      <button type="button" data-period="${kind}" data-dir="-1">‹</button>
      <div class="period-label">${periodLabel(kind)}</div>
      <button type="button" data-period="${kind}" data-dir="1">›</button>

}
function attachPeriodNav(root) {

function clampDay(day) {
  return Math.max(0, Math.min(WEEK_DATES.length - 1, day));
}

function parseDateKey(dateKey) {
  const [year, month, day] = dateKey.split('-').map(Number);
  return new Date(year, month - 1, day);
}

function formatDateKey(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function addDays(dateKey, amount) {
  const date = parseDateKey(dateKey);
  date.setDate(date.getDate() + amount);
  return formatDateKey(date);
}

function getDateLabel(dateKey) {
  if (!dateKey) return 'Sem data';
  if (DATES_MAP[dateKey]) return DATES_MAP[dateKey];
  const idx = WEEK_DATES.indexOf(dateKey);
  const date = parseDateKey(dateKey);
  const label = `${DAYS_SHORT[idx >= 0 ? idx % 7 : (date.getDay() + 6) % 7]} ${date.getDate()}`;
  DATES_MAP[dateKey] = label;
  return label;
}

function rebuildCurrentWeekDates() {
  const base = parseDateKey('2026-05-09'); // Monday of base week
  for (let i = 0; i < 7; i++) {
    const d = new Date(base.getTime());
    d.setDate(d.getDate() + weekOffset * 7 + i);
    WEEK_DATES[i] = formatDateKey(d);
  }
  WEEK_DATES.length = 7;
}

function ensureDateInWeek(dateKey) {
  let idx = WEEK_DATES.indexOf(dateKey);
  if (idx >= 0) return idx;
  // navigate to the week that contains dateKey
  const base = parseDateKey('2026-05-09');
  const target = parseDateKey(dateKey);
  const diffDays = Math.round((target - base) / 86400000);
  weekOffset = Math.floor(diffDays / 7);
  rebuildCurrentWeekDates();
  return Math.max(0, WEEK_DATES.indexOf(dateKey));
}

function showDayToast(text) {
  const toast = document.getElementById('day-shift-toast');
  if (!toast) return;
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(showDayToast.timer);
  showDayToast.timer = setTimeout(() => toast.classList.remove('show'), 900);
}

function confirmDelete(label) {
  return window.confirm(`Excluir ${label}? Essa ação não pode ser desfeita.`);

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;',
  }[ch]));
}

function escapeAttr(value) {
  return escapeHTML(value).replace(/`/g, '&#96;');
}

function setActiveDay(day, options = {}) {
  const nextDay = clampDay(day);
  const changed = nextDay !== activeDay;
  const dateStr = WEEK_DATES[nextDay];

  const content = document.getElementById('content');
  if (content && currentNav === 'hoje' && currentView === 'semana') content.scrollTop = 0;
  if (options.toast && changed) showDayToast(options.toast);
}

// ─── WEEK STRIP CAROUSEL ─────────────────────────────────────────────────────
function buildWeekStrip() {
  const strip = document.getElementById('week-strip');
  const activeDateStr = WEEK_DATES[activeDay];
  const base = parseDateKey(activeDateStr);
  const RANGE = 30;

  const dates = Array.from({length: RANGE * 2 + 1}, (_, i) => {
    const d = new Date(base.getTime());
    d.setDate(d.getDate() + i - RANGE);
    return formatDateKey(d);
  });

  const daysHTML = dates.map(dateStr => {
    const parsed = parseDateKey(dateStr);
    const isActive = dateStr === activeDateStr;
    const isToday  = dateStr === TODAY;
    const dow = (parsed.getDay() + 6) % 7;
    return `<button class="day-btn${isActive?' active':''}${isToday&&!isActive?' today':''}" data-date="${dateStr}">
      <span class="day-letter">${DAYS_LETTER[dow]}</span>
      <span class="day-num">${parsed.getDate()}</span>
      ${isToday && !isActive ? '<span class="day-dot"></span>' : ''}
    </button>`;
  }).join('');

  strip.innerHTML = `
    <button class="week-nav-arrow" id="week-prev">&#8249;</button>
    <div class="week-nav-days" id="week-scroll">${daysHTML}</div>
    <button class="week-nav-arrow" id="week-next">&#8250;</button>`;

  const scrollEl = strip.querySelector('#week-scroll');

  // center active day instantly
  const activeBtn = scrollEl.querySelector('.day-btn.active');
  if (activeBtn) {
    scrollEl.scrollLeft = activeBtn.offsetLeft - scrollEl.offsetWidth / 2 + activeBtn.offsetWidth / 2;
  }

  // arrows jump ±7 days
  strip.querySelector('#week-prev').addEventListener('click', () => {
    navigateToDate(addDays(WEEK_DATES[activeDay], -7));
  });
  strip.querySelector('#week-next').addEventListener('click', () => {
    navigateToDate(addDays(WEEK_DATES[activeDay], 7));
  });

  // click a day
  scrollEl.querySelectorAll('.day-btn').forEach(btn => {
    btn.addEventListener('click', () => navigateToDate(btn.dataset.date));
  });

  // scroll settle → detect centred day
  let t;
  scrollEl.addEventListener('scroll', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      const center = scrollEl.scrollLeft + scrollEl.offsetWidth / 2;
      let best = null, bestDist = Infinity;
      scrollEl.querySelectorAll('.day-btn').forEach(btn => {
        const dist = Math.abs(btn.offsetLeft + btn.offsetWidth / 2 - center);
        if (dist < bestDist) { bestDist = dist; best = btn; }
      });
      if (best && best.dataset.date !== WEEK_DATES[activeDay]) {
        navigateToDate(best.dataset.date, false);
      }
    }, 80);
  }, { passive: true });
}

function navigateToDate(dateStr, smooth = true) {
  const idx = ensureDateInWeek(dateStr);
  activeDay = idx;

  const scrollEl = document.getElementById('week-scroll');
  const btn = scrollEl && scrollEl.querySelector(`[data-date="${dateStr}"]`);

  if (btn) {
    // update classes in place — no DOM rebuild
    scrollEl.querySelectorAll('.day-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.date === dateStr);
      b.classList.toggle('today', b.dataset.date === TODAY && b.dataset.date !== dateStr);
    });
    if (smooth) btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  } else {
    buildWeekStrip();
  }

  updateHeader();
  updateProgress();
  updateTaskCount();
  if (currentNav === 'hoje' && currentView === 'semana') renderTaskList();
  saveState();
}

// ─── TASK LIST ────────────────────────────────────────────────────────────────
function renderTaskList() {
  const allTasks = [...tasks].sort((a, b) => {
    if (!a.date && !b.date) return 0;
    if (!a.date) return 1;
    if (!b.date) return -1;
    return a.date.localeCompare(b.date);
  });

  const byDate = {};
  allTasks.forEach(t => {
    const key = t.date || '__nodate__';
    if (!byDate[key]) byDate[key] = [];
    byDate[key].push(t);
  });

  let html = `
    <div class="inline-task-row top">
      <button class="tick-btn" style="opacity:0.2;pointer-events:none" tabindex="-1">${CHECK_SVG}</button>
      <input class="inline-task-input" id="inline-task-input"
             placeholder="Anotar nova tarefa…" autocomplete="off" spellcheck="false">
    </div>`;

  Object.entries(byDate).forEach(([dateKey, group]) => {
    const isNoDate = dateKey === '__nodate__';
    const label = isNoDate ? 'Sem data' : getDateLabel(dateKey);
    const isToday = dateKey === TODAY;
    const cls = `section-label${isToday ? ' today' : ''}${isNoDate ? ' nodate' : ''}`;
    html += `<div class="${cls}">${isToday ? '● Hoje — ' : ''}${label}</div>`;
    html += group.map(t => taskRowHTML(t)).join('');
  });

  document.getElementById('task-list-pending').innerHTML = html;
  document.getElementById('task-list-done-wrap').style.display = 'none';
  document.getElementById('task-list-undated-wrap').style.display = 'none';

  const inlineInput = document.getElementById('inline-task-input');
  if (inlineInput) {
    inlineInput.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const title = inlineInput.value.trim();
      if (!title) return;
      tasks.push({ id: Date.now(), title, done: false, priority: 'média',
                   projectId: null, time: '', date: WEEK_DATES[activeDay], subtasks: [] });
      renderTaskList();
      const next = document.getElementById('inline-task-input');
      if (next) next.focus();
    });
  }

  attachTaskEvents();
}

function taskRowHTML(task) {
  const proj = PROJECTS.find(p => p.id === task.projectId);
  const pc   = PRIORITY[task.priority];
  const checkStyle = proj ? `style="--check-color:${proj.dot}"` : '';
  return `
    <div class="task-row ${task.done?'done':''}" data-id="${task.id}" ${checkStyle}>
      <div class="drag-hint left"></div>
      <div class="drag-hint right"></div>
      <button class="tick-btn ${task.done?'checked':''}" data-tick="${task.id}" ${checkStyle}>
        ${CHECK_SVG}
      </button>
      <div class="task-body">
        <div class="task-title">${task.title}</div>
        <div class="task-meta">
          ${proj ? `<span class="meta-proj"><span class="proj-dot" style="background:${proj.dot}"></span>${proj.name}</span>` : ''}
          ${task.time ? `<span class="meta-time">${task.time}</span>` : ''}
          ${!task.date ? `<span class="meta-nodate">sem data</span>` : ''}
          ${task.repeat && task.repeat !== 'nenhuma' ? `<span class="meta-sub">recorrente: ${task.repeat}</span>` : ''}
          ${task.subtasks?.length ? `<span class="meta-sub">${task.subtasks.length} subtarefas</span>` : ''}
        </div>
      </div>
      <span class="priority-badge" style="color:${pc.color}">
        <span class="priority-dot" style="background:${pc.color}"></span>${pc.label}

      <div class="panel-label">Mover para</div>

        ${Object.entries(DATES_MAP).map(([dk,label]) =>
          `<button data-move="${task.id}" data-date="${dk}">${label}</button>`
        ).join('')}
        <button data-move="${task.id}" data-date="null">Sem data</button>
        <button class="cancel" data-cancel="${task.id}">Cancelar</button>
      </div>
    </div>`;
}

function attachTaskEvents() {
  // tick buttons
  document.querySelectorAll('[data-tick]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.tick);
      toggleTask(id);
    });
  });

  // task row click (open detail)
  document.querySelectorAll('.task-row').forEach(row => {
    row.addEventListener('click', () => {
      if (row.dataset.suppressClick === 'true') {
        row.dataset.suppressClick = 'false';
        return;
      }
      startEditTask(parseInt(row.dataset.id));
    });
    // drag to reschedule
    setupDrag(row);
  });

  // reschedule buttons
  document.querySelectorAll('[data-move]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = parseInt(btn.dataset.move);
      const date = btn.dataset.date === 'null' ? null : btn.dataset.date;
      rescheduleTask(id, date);
    });
  });
  document.querySelectorAll('[data-cancel]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.dataset.cancel;
      document.getElementById(`rp-${id}`).style.display = 'none';
    });
  });
}

function setupDrag(row) {
  let startX = 0, startY = 0, offset = 0, dragging = false, ready = false, moved = false, pressed = false, holdTimer = null;
  const id = row.dataset.id;

  const resetDrag = () => {
    clearTimeout(holdTimer);
    pressed = false;
    ready = false;
    dragging = false;
    taskDragActive = false;
    row.classList.remove('drag-ready','dragging');
    row.style.transform = '';
    row.querySelector('.drag-hint.left').style.opacity = 0;
    row.querySelector('.drag-hint.right').style.opacity = 0;
  };

  row.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    if (row.setPointerCapture) row.setPointerCapture(e.pointerId);
    startX = e.clientX;
    startY = e.clientY;
    offset = 0;
    moved = false;
    pressed = true;
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => {
      ready = true;
      taskDragActive = true;
      row.classList.add('drag-ready');
    }, 170);
  });

  row.addEventListener('pointermove', e => {
    if (!pressed) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dy) > 14 && Math.abs(dy) > Math.abs(dx) && !ready) {
      clearTimeout(holdTimer);
      return;
    }
    if (!ready && Math.abs(dx) < 14) return;
    ready = true;
    dragging = true;
    taskDragActive = true;
    moved = true;
    row.classList.remove('drag-ready');
    row.classList.add('dragging');
    offset = Math.max(-128, Math.min(128, dx));
    row.style.transform = `translateX(${offset}px)`;
    const hintL = row.querySelector('.drag-hint.left');
    const hintR = row.querySelector('.drag-hint.right');
    if (Math.abs(offset) > 28) {
      const op = Math.min(1,(Math.abs(offset)-28)/28);
      if (offset > 0) {
        hintR.textContent = 'Solte: proximo dia'; hintR.style.opacity = op;
        hintL.style.opacity = 0;
      } else {
        hintL.textContent = 'Solte: apagar'; hintL.style.opacity = op;
        hintR.style.opacity = 0;
      }
    } else {
      hintL.style.opacity = 0; hintR.style.opacity = 0;
    }
  });

  row.addEventListener('pointerup', () => {
    clearTimeout(holdTimer);
    if (dragging && Math.abs(offset) > 64) {
      if (offset > 0) {
        moveTaskByDays(parseInt(id), 1);
      } else {
        deleteTask(parseInt(id), true);
      }
      row.dataset.suppressClick = 'true';
      resetDrag();
      return;
    }
    if (moved || dragging || ready) row.dataset.suppressClick = 'true';
    resetDrag();
    offset = 0;
  });

  row.addEventListener('pointercancel', resetDrag);
}

function toggleTask(id) {
  const t = tasks.find(t => t.id === id);
  if (t) t.done = !t.done;
  renderAll();
}

function deleteTask(id, ask = true) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  if (ask && !confirmDelete(`a tarefa "${t.title}"`)) return;
  tasks = tasks.filter(task => task.id !== id);
  closeModal('modal-task-detail');
  renderAll();
  showDayToast('Tarefa excluida');
}

function rescheduleTask(id, date) {
  const t = tasks.find(t => t.id === id);
  if (t) t.date = date;
  renderAll();
}

function moveTaskByDays(id, direction) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  const currentIdx = t.date ? WEEK_DATES.indexOf(t.date) : activeDay;
  const baseIdx = currentIdx >= 0 ? currentIdx : activeDay;
  const targetDate = baseIdx + direction < 0
    ? addDays(WEEK_DATES[0], -1)
    : baseIdx + direction >= WEEK_DATES.length
      ? addDays(WEEK_DATES[WEEK_DATES.length - 1], 1)
      : WEEK_DATES[baseIdx + direction];
  const targetIdx = ensureDateInWeek(targetDate);
  t.date = WEEK_DATES[targetIdx];
  const label = getDateLabel(WEEK_DATES[targetIdx]);
  if (targetIdx !== activeDay) {
    buildWeekStrip();
    setActiveDay(targetIdx, { toast: `Movida para ${label}` });
  } else {
    renderAll();
    showDayToast(`Movida para ${label}`);
  }
}

// ─── MONTH VIEW ───────────────────────────────────────────────────────────────
function renderMonthView() {
  const mv = document.getElementById('month-view');
  const MONTH_NAMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                       'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const base = new Date(2026, 4, 1); // May 2026
  base.setMonth(base.getMonth() + taskMonthOffset);
  const year  = base.getFullYear();
  const month = base.getMonth();
  const daysInMonth   = new Date(year, month + 1, 0).getDate();
  const firstWeekday  = new Date(year, month, 1).getDay(); // 0=Sun
  const totalCells    = Math.ceil((firstWeekday + daysInMonth) / 7) * 7;
  const pad = n => String(n).padStart(2, '0');
  const todayParsed = parseDateKey(TODAY);

  let html = `
    <div class="period-nav" style="margin:0 16px 12px">
      <button type="button" data-month-dir="-1">&#8249;</button>
      <div class="period-label">${MONTH_NAMES[month]} ${year}</div>
      <button type="button" data-month-dir="1">&#8250;</button>
    </div>
    <div class="month-day-headers">
      ${['D','S','T','Q','Q','S','S'].map(d=>`<span>${d}</span>`).join('')}
    </div>`;

  for (let w = 0; w * 7 < totalCells; w++) {
    html += `<div class="month-week">`;
    for (let d = 0; d < 7; d++) {
      const dayNum = w * 7 + d - firstWeekday + 1;
      if (dayNum < 1 || dayNum > daysInMonth) { html += `<div class="month-cell empty"></div>`; continue; }
      const ds = `${year}-${pad(month+1)}-${pad(dayNum)}`;
      const dt = tasks.filter(t => t.date === ds);
      const hasDone = dt.some(t => t.done), hasPending = dt.some(t => !t.done);
      const isToday = year === todayParsed.getFullYear() && month === todayParsed.getMonth() && dayNum === todayParsed.getDate();
      html += `
        <div class="month-cell ${isToday?'today':''}" data-month-date="${ds}">
          <span class="cell-num">${dayNum}</span>
          ${(hasDone||hasPending) ? `<div class="cell-dots">
            ${hasPending?`<div class="cell-dot" style="background:${isToday?'rgba(255,255,255,0.7)':PRIORITY.alta.color}"></div>`:''}
            ${hasDone?`<div class="cell-dot" style="background:${isToday?'rgba(255,255,255,0.5)':PRIORITY.baixa.color}"></div>`:''}
          </div>` : ''}
        </div>`;
    }
    html += `</div>`;
  }
  html += `
    <div class="month-legend">
      <div class="legend-item"><div class="legend-dot" style="background:${PRIORITY.alta.color}"></div>Pendente</div>
      <div class="legend-item"><div class="legend-dot" style="background:${PRIORITY.baixa.color}"></div>Concluída</div>
    </div>`;
  mv.innerHTML = html;

  mv.querySelectorAll('[data-month-dir]').forEach(btn => {
    btn.addEventListener('click', () => {
      taskMonthOffset += parseInt(btn.dataset.monthDir);
      renderMonthView();
    });
  });

  mv.querySelectorAll('.month-cell:not(.empty)').forEach(cell => {
    cell.addEventListener('click', () => {
      const dateStr = cell.dataset.monthDate;
      const idx = ensureDateInWeek(dateStr);
      currentView = 'semana';
      buildViewToggle();
      buildWeekStrip();
      setActiveDay(idx);
    });
  });
}

function checkHabit(id) {
  checkHabitDay(id, TODAY_IDX);
}

function checkHabitDay(id, dayIdx) {
  const h = habits.find(h=>h.id===id);
  if (!h) return;
  const week = getHabitWeek(h);
  if (week[dayIdx] === null) return;
  const was = week[dayIdx]===true;
  week[dayIdx] = !was;
  if (habitWeekOffset === 0 && dayIdx === TODAY_IDX) {
    h.streak = was ? Math.max(0, h.streak-1) : h.streak+1;
  }
  renderAll();
  if (selectedHabitId === id) {
    const overlay = document.getElementById('modal-habit-detail');
    if (overlay.classList.contains('open')) openHabitDetail();
  }
}

function toggleHabitHeatmapDay(id, heatmapIdx) {
  const h = habits.find(h=>h.id===id);
  if (!h) return;
  const heatmap = getHabitHeatmap(h);
  if (heatmap[heatmapIdx] === null) return;
  heatmap[heatmapIdx] = !heatmap[heatmapIdx];
  renderAll();
}

function setupHabitDrag(card) {
  let startX = 0, startY = 0, offset = 0, dragging = false, pressed = false, holdTimer = null;
  const id = parseInt(card.dataset.habitOpen);

  const reset = () => {
    clearTimeout(holdTimer);
    pressed = false;
    dragging = false;
    card.classList.remove('drag-ready','dragging');
    card.style.transform = '';
  };

  card.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    if (card.setPointerCapture) card.setPointerCapture(e.pointerId);
    startX = e.clientX;
    startY = e.clientY;
    offset = 0;
    pressed = true;
    holdTimer = setTimeout(() => card.classList.add('drag-ready'), 170);
  });

  card.addEventListener('pointermove', e => {
    if (!pressed) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dy) > 14 && Math.abs(dy) > Math.abs(dx)) {
      clearTimeout(holdTimer);
      return;
    }
    if (Math.abs(dx) < 14) return;
    dragging = true;
    card.classList.remove('drag-ready');
    card.classList.add('dragging');
    offset = Math.max(-128, Math.min(40, dx));
    card.style.transform = `translateX(${offset}px)`;
  });

  card.addEventListener('pointerup', () => {
    clearTimeout(holdTimer);
    if (dragging && offset < -64) {
      card.dataset.suppressClick = 'true';
      deleteHabit(id, true);
      reset();
      return;
    }
    if (dragging) card.dataset.suppressClick = 'true';
    reset();
  });

  card.addEventListener('pointercancel', reset);
}

function attachAppearanceEvents(root) {
  const colorInput = root.querySelector('#appearance-color');
  if (colorInput) {
    colorInput.addEventListener('input', (e) => {
      e.stopPropagation();
      accentColor = colorInput.value;
      applyTheme();
    });
  }
  root.querySelectorAll('[data-theme-choice]').forEach(btn => {
    btn.addEventListener('click', (event) => {
      event.stopPropagation();
      darkTheme = btn.dataset.themeChoice === 'dark';
      applyTheme();
      renderProfile();
    });
  });
  root.querySelectorAll('[data-font-mode]').forEach(btn => {
    btn.addEventListener('click', (event) => {
      event.stopPropagation();
      event.preventDefault();
      fontMode = btn.dataset.fontMode;
      const preset = APPEARANCE_PRESETS.find(item => item.id === fontMode);
      if (preset) accentColor = preset.colors.primary;
      applyTheme();
      renderAll();
    });
  });
}

function setThemeVar(name, value) {
  document.documentElement.style.setProperty(name, value);
  document.body.style.setProperty(name, value);
}

function softColor(color) {
  return `color-mix(in srgb, ${color} 13%, #ffffff)`;
}

function updatePriorityPalette(colors) {
  PRIORITY.alta.color = colors.alta;
  PRIORITY.alta.bg = softColor(colors.alta);
  PRIORITY['média'].color = colors.media;
  PRIORITY['média'].bg = softColor(colors.media);
  PRIORITY.baixa.color = colors.baixa;
  PRIORITY.baixa.bg = softColor(colors.baixa);
}

function getAccentTextColor(color) {
  const hex = color.replace('#', '').trim();
  const normalized = hex.length === 3
    ? hex.split('').map(char => char + char).join('')
    : hex;
  const value = parseInt(normalized, 16);
  if (Number.isNaN(value)) return '#FFFFFF';
  const r = (value >> 16) & 255;
  const g = (value >> 8) & 255;
  const b = value & 255;
  const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return luminance > 0.62 ? '#111110' : '#FFFFFF';
}

function applyTheme() {
  document.body.classList.toggle('dark', darkTheme);
  const selectedPreset = APPEARANCE_PRESETS.find(preset => preset.id === fontMode) || APPEARANCE_PRESETS[0];
  fontMode = selectedPreset.id;
  const colors = { ...selectedPreset.colors, primary: accentColor || selectedPreset.colors.primary };
  const accentText = getAccentTextColor(colors.primary);
  setThemeVar('--bg', colors.bg);
  setThemeVar('--surface', `color-mix(in srgb, ${colors.bg} 36%, #ffffff)`);
  setThemeVar('--ink', colors.primary);
  setThemeVar('--ink-mid', colors.secondary);
  setThemeVar('--ink-faint', colors.secondary);
  setThemeVar('--ink-ghost', colors.divider);
  setThemeVar('--rule', colors.divider);
  setThemeVar('--deep', `color-mix(in srgb, ${colors.bg} 82%, ${colors.divider})`);
  setThemeVar('--accent', colors.primary);
  setThemeVar('--accent-text', accentText);
  setThemeVar('--day-selected', colors.day);
  setThemeVar('--day-selected-text', getAccentTextColor(colors.day));
  setThemeVar('--tabbar', colors.tab);
  setThemeVar('--tabbar-text', getAccentTextColor(colors.tab));
  setThemeVar('--red', colors.alta);
  setThemeVar('--red-soft', softColor(colors.alta));
  setThemeVar('--amber', colors.media);
  setThemeVar('--amb-soft', softColor(colors.media));
  setThemeVar('--green', colors.baixa);
  setThemeVar('--grn-soft', softColor(colors.baixa));
  updatePriorityPalette(colors);
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', colors.tab);
  document.documentElement.style.setProperty('--serif', selectedPreset.title);
  document.documentElement.style.setProperty('--mono', selectedPreset.body);
  document.getElementById('app').dataset.theme = fontMode;
  localStorage.setItem('fd-theme', darkTheme ? 'dark' : 'light');
  localStorage.setItem('fd-accent', accentColor);
  localStorage.setItem('fd-font-mode', fontMode);
}

function handleProfileAction(action) {
  if (action === 'appearance') {
    appearanceOpen = !appearanceOpen;
    renderProfile();
    return;
  }

  if (action === 'notifications') {
    if (!('Notification' in window)) {
      showDayToast('Notificacoes indisponiveis');
      return;
    }
    if (Notification.permission === 'granted') {
      showDayToast('Notificacoes ativas');
      scheduleTaskNotifications();
      renderProfile();
      return;
    }
    if (Notification.permission === 'denied') {
      showDayToast('Notificacoes bloqueadas');
      renderProfile();
      return;
    }
    Notification.requestPermission().then(permission => {
      showDayToast(permission === 'granted' ? 'Notificacoes ativas' : 'Notificacoes desativadas');
      scheduleTaskNotifications();
      renderProfile();
    });
    return;
  }

  if (action === 'update') {
    showDayToast('Verificando atualização...');
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistration().then(reg => {
        if (!reg) { location.reload(); return; }
        reg.update().then(() => {
          if (reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
          } else {
            showDayToast('App já está atualizado');
          }
        }).catch(() => location.reload());
      });
    } else {
      location.reload();
    }
    return;
  }

  if (action === 'account') {
    window.alert('Ana Rodrigues\nana@email.com');
    return;
  }

  if (action === 'logout') {
    if (!window.confirm('Sair e limpar os dados salvos neste aparelho?')) return;
    localStorage.removeItem('fd-tasks');
    localStorage.removeItem('fd-habits');
    localStorage.removeItem('fd-projects');
    tasks = [];
    habits = [];
    PROJECTS.splice(0, PROJECTS.length);
    renderAll();
    showDayToast('Sessao encerrada');
  }
}

    ${task.subtasks.map((s,i) => `
      <div class="subtask-row">
        <button class="sub-tick ${s.done?'checked':''}" data-sub-toggle="${i}">${CHECK_SVG}</button>
        <span class="sub-title">${escapeHTML(s.title || s)}</span>
      </div>`).join('')}
    <button class="dotted-add-btn" id="show-subtask-add" type="button">+</button>
    <div class="detail-add-row collapsed" id="subtask-add-row">
      <input id="new-subtask-title" placeholder="Nova subtarefa..."/>
      <button id="add-subtask-btn" type="button">ADD</button>
    </div>
    <div class="modal-label" style="margin-top:18px;margin-bottom:0">Anexos</div>
    ${task.attachments.map((a,i) => `
      <div class="attachment-row">
        <span>${escapeHTML(a)}</span>
        <button data-remove-attachment="${i}" type="button">REMOVER</button>
      </div>`).join('')}
    <button class="clip-add-btn" id="show-attachment-add" type="button" aria-label="Adicionar anexo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M21.4 11.6 12 21a6 6 0 0 1-8.5-8.5l9.8-9.8a4 4 0 0 1 5.7 5.7l-9.8 9.8a2 2 0 0 1-2.8-2.8l9.4-9.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="detail-add-row collapsed" id="attachment-add-row">
      <input id="new-attachment-name" placeholder="Nome ou link do anexo..."/>
      <button id="add-attachment-btn" type="button">ADD</button>
    </div>`;

  subs.querySelectorAll('[data-sub-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.subToggle);
      const raw = task.subtasks[i];
      if (typeof raw === 'string') task.subtasks[i] = { title: raw, done: true };
      else raw.done = !raw.done;
      openTaskDetail();
      renderAll();
    });
  });
  document.getElementById('show-subtask-add').onclick = () => {
    const row = document.getElementById('subtask-add-row');
    row.classList.toggle('collapsed');
    if (!row.classList.contains('collapsed')) document.getElementById('new-subtask-title').focus();
  };
  document.getElementById('add-subtask-btn').onclick = () => {
    const input = document.getElementById('new-subtask-title');
    const title = input.value.trim();
    if (!title) return;
    task.subtasks.push({ title, done:false });
    openTaskDetail();
    renderAll();
  };
  document.getElementById('show-attachment-add').onclick = () => {
    const row = document.getElementById('attachment-add-row');
    row.classList.toggle('collapsed');
    if (!row.classList.contains('collapsed')) document.getElementById('new-attachment-name').focus();
  };
  document.getElementById('add-attachment-btn').onclick = () => {
    const input = document.getElementById('new-attachment-name');
    const name = input.value.trim();
    if (!name) return;
    task.attachments.push(name);
    openTaskDetail();
    renderAll();
  };
  subs.querySelectorAll('[data-remove-attachment]').forEach(btn => {
    btn.onclick = () => {
      task.attachments.splice(parseInt(btn.dataset.removeAttachment), 1);
      openTaskDetail();
      renderAll();
    };
  });

  document.getElementById('edit-task-btn').onclick = () => {
    startEditTask(task.id);
  };
  document.getElementById('delete-task-btn').onclick = () => {
    deleteTask(task.id, true);
  };

  openModal('modal-task-detail');
}

// ─── HABIT DETAIL MODAL ───────────────────────────────────────────────────────
function openHabitDetail() {
  const h = habits.find(h=>h.id===selectedHabitId);
  if (!h) return;
  hdView = 'semana';

  const todayDone = h.week[TODAY_IDX]===true;
  const doneCount = h.week.filter(d=>d===true).length;
  const totalCount= h.week.filter(d=>d!==null).length;

  const chk = document.getElementById('hd-check');
  chk.className = `habit-detail-check ${todayDone?'done':''}`;
  chk.style.cssText = `--habit-color:${h.color}`;
  chk.innerHTML = CHECK_SVG;
  chk.onclick = () => checkHabit(h.id);

  document.getElementById('hd-title').textContent = h.name;

  const goalBlock = document.getElementById('hd-goal-block');
  goalBlock.style.cssText = `background:${h.color}12;border-left:2.5px solid ${h.color};border-radius:0 10px 10px 0;padding:12px 14px;margin-bottom:20px;margin-left:42px`;
  document.getElementById('hd-goal').textContent = `"${h.goal}"`;

  const strEl = document.getElementById('hd-streak');
  strEl.innerHTML = `<span style="color:${h.color}">${h.streak}</span>`;
  document.getElementById('hd-week-count').innerHTML = `${doneCount}<span>/${totalCount}</span>`;

  // toggle
  const hdTg = document.getElementById('hd-toggle');
  hdTg.querySelectorAll('button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.hdView === hdView);
    btn.onclick = () => {
      hdView = btn.dataset.hdView;
      hdTg.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.hdView===hdView));
      document.getElementById('hd-semana-view').style.display = hdView==='semana' ? 'block' : 'none';
      document.getElementById('hd-mensal-view').style.display = hdView==='mensal' ? 'block' : 'none';
    };
  });

  // week grid
  const semanaView = document.getElementById('hd-semana-view');
  semanaView.style.display = 'block';
  semanaView.innerHTML = `
    <div class="detail-week-grid" style="margin-bottom:20px">
      ${h.week.map((day,i) => {
        const isT = i===TODAY_IDX;
        const clickable = day !== null;
        return `
          <div class="detail-week-cell-wrap">
            <div class="detail-week-cell ${day===true?'done':''} ${isT&&day!==true?'today-cell':''} ${day===null?'future':''}"
                 style="${day===true?`--habit-color:${h.color}`:''}"
                 ${clickable ? `data-habit-detail-day="${h.id}" data-day-idx="${i}"` : ''}>
              ${day===true ? CHECK_SVG_SM : ''}
            </div>
            <span class="detail-week-label ${isT?'today-label':''}">${DAYS_SHORT[i].slice(0,3)}</span>
          </div>`;
      }).join('')}
    </div>`;
  semanaView.querySelectorAll('[data-habit-detail-day]').forEach(cell => {
    cell.addEventListener('click', () => {
      checkHabitDay(parseInt(cell.dataset.habitDetailDay), parseInt(cell.dataset.dayIdx));
    });
  });

  // heatmap
  const mensalView = document.getElementById('hd-mensal-view');
  mensalView.style.display = 'none';
  const weeks2 = [];
  for (let w=0;w<5;w++) weeks2.push(h.heatmap.slice(w*7,w*7+7));
  mensalView.innerHTML = `
    <div class="heatmap" style="--habit-color:${h.color};margin-bottom:20px">
      <div class="heatmap-header">
        <div class="heatmap-header-spacer"></div>
        ${DAYS_LETTER.map(d=>`<span>${d}</span>`).join('')}
      </div>
      ${weeks2.map((week,wi) => `
        <div class="heatmap-row">
          <div class="heatmap-week-label">${MONTH_WEEKS[wi]}</div>
          ${week.map(day=>`<div class="heatmap-cell ${day===true?'done':day===false?'missed':'future'}"></div>`).join('')}
        </div>`).join('')}
    </div>`;

  document.getElementById('hd-close').onclick = () => closeModal('modal-habit-detail');
  document.getElementById('edit-habit-btn').onclick = () => startEditHabit(h.id);
  document.getElementById('delete-habit-btn').onclick = () => deleteHabit(h.id, true);

  openModal('modal-habit-detail');
}

// ─── ADD TASK MODAL ───────────────────────────────────────────────────────────
function buildAddTaskModal() {
  const titleLabel = document.getElementById('task-modal-title');
  const isEditing = editingTaskId !== null;
  document.getElementById('modal-add-task').classList.toggle('editing', isEditing);
  if (titleLabel) titleLabel.textContent = isEditing ? 'Editar tarefa' : 'Nova tarefa';
  document.getElementById('submit-task').textContent = isEditing ? 'SALVAR' : 'CRIAR';
  const advanced = document.getElementById('task-advanced-fields');
  if (advanced) advanced.style.display = 'block';

  // subtasks
  const subList = document.getElementById('task-subtasks-list');
  if (subList) {
    subList.innerHTML = newSubtasks.map((s, i) => `
      <div class="task-sub-item">
        <span style="flex:1">${escapeHTML(typeof s === 'string' ? s : s.title)}</span>
        <button data-remove-sub="${i}" type="button">✕</button>
      </div>`).join('');
    subList.querySelectorAll('[data-remove-sub]').forEach(btn => {
      btn.onclick = () => { newSubtasks.splice(parseInt(btn.dataset.removeSub), 1); buildAddTaskModal(); };
    });
  }
  const subInput = document.getElementById('task-subtask-input');
  if (subInput) {
    subInput.value = '';
    subInput.onkeydown = e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const v = subInput.value.trim();
      if (!v) return;
      newSubtasks.push({ title: v, done: false });
      buildAddTaskModal();
      document.getElementById('task-subtask-input')?.focus();
    };
  }
  const timeInput = document.getElementById('task-time-input');
  if (timeInput) {
    timeInput.value = newTaskTime || '';
    timeInput.onchange = () => { newTaskTime = timeInput.value; };
  }
  const clearTime = document.getElementById('task-time-clear');
  if (clearTime) clearTime.onclick = () => {
    newTaskTime = '';
    if (timeInput) timeInput.value = '';
  };

  // priority buttons
  const pg = document.getElementById('priority-group');
  if (pg) {
    const priorityKeys = ['baixa','média','alta'];
    const priorityIdx = Math.max(0, priorityKeys.indexOf(newPriority));
    const pc = PRIORITY[newPriority] || PRIORITY['média'];
    pg.innerHTML = `
      <div class="priority-grow" style="--priority-color:${pc.color}">
        <button type="button" id="priority-grow-btn">
          <div class="priority-meter">
            ${priorityKeys.map((_,i) => `<span class="${i <= priorityIdx ? 'on' : ''}"></span>`).join('')}
          </div>
          <div class="priority-grow-label">
            <span>${pc.label}</span>
            <small>toque para aumentar</small>
          </div>
        </button>
      </div>`;
    const growBtn = document.getElementById('priority-grow-btn');
    if (growBtn) growBtn.onclick = () => {
      newPriority = priorityKeys[(priorityIdx + 1) % priorityKeys.length];
      buildAddTaskModal();
    };
  }

  // project buttons
  const prg = document.getElementById('project-group');
  if (prg) {
    prg.innerHTML = `
      <select class="task-select" id="task-project-select">
        <option value="">Sem projeto</option>
        ${PROJECTS.map(p => `<option value="${p.id}" ${p.id===newProjectId?'selected':''}>${p.name}</option>`).join('')}
      </select>`;
    const select = document.getElementById('task-project-select');
    if (select) select.onchange = () => {
      newProjectId = select.value ? parseInt(select.value) : null;
    };
  }

  const dg = document.getElementById('task-date-group');
  dg.className = 'task-date-field';
  dg.innerHTML = `
    <div class="task-date-editor">
      <input type="date" id="task-date-input" value="${newTaskDate || ''}"/>
      <button class="task-date-clear" id="task-date-clear" type="button">Sem data</button>
    </div>`;
  const dateInput = document.getElementById('task-date-input');
  const clearDate = document.getElementById('task-date-clear');
  if (dateInput) dateInput.onchange = () => {
    newTaskDate = dateInput.value || null;
    newHasDate = newTaskDate !== null;
    if (newTaskDate) ensureDateInWeek(newTaskDate);
  };
  if (clearDate) clearDate.onclick = () => {
    newTaskDate = null;
    newHasDate = false;
    buildAddTaskModal();
  };

  const rg = document.getElementById('repeat-group');
  if (rg) {
    const activeRepeat = REPEAT_OPTIONS.find(opt => opt.id === newRepeat)?.label || 'Unica';
    rg.innerHTML = `
      <div class="repeat-section">
        <button class="repeat-toggle" id="repeat-toggle" type="button">
          <span>${activeRepeat}</span><span>abrir</span>
        </button>
        <div class="repeat-choice-group collapsed" id="repeat-options">
          ${REPEAT_OPTIONS.map(opt => `
            <button class="choice-btn ${newRepeat===opt.id?'active':''}" data-repeat="${opt.id}">
              ${opt.label}
            </button>`).join('')}
        </div>
      </div>`;
    const toggle = document.getElementById('repeat-toggle');
    const options = document.getElementById('repeat-options');
    if (toggle && options) toggle.onclick = () => options.classList.toggle('collapsed');
    rg.querySelectorAll('[data-repeat]').forEach(btn => {
      btn.onclick = () => {
        newRepeat = btn.dataset.repeat;
        buildAddTaskModal();
      };
    });
  }

  // submit readiness
  const title = document.getElementById('new-task-title').value.trim();
  document.getElementById('submit-task').className = `modal-submit ${title?'ready':''}`;
}

document.getElementById('new-task-title').addEventListener('input', buildAddTaskModal);

document.getElementById('submit-task').addEventListener('click', () => {
  const title = document.getElementById('new-task-title').value.trim();
  if (!title) return;
  let changedTask = null;
  if (editingTaskId) {
    const t = tasks.find(t => t.id === editingTaskId);
    if (t) {
      t.title = title;
      t.priority = newPriority;
      t.projectId = newProjectId;
      t.time = newTaskTime;
      t.date = newTaskDate;
      t.repeat = newRepeat;
      t.subtasks = newSubtasks;
      if (newTaskDate) ensureDateInWeek(newTaskDate);
      changedTask = t;
    }
  } else {
    if (newTaskDate) ensureDateInWeek(newTaskDate);
    changedTask = {
      id: Date.now(),
      title,
      done: false,
      priority: newPriority,
      projectId: newProjectId,
      time: newTaskTime,
      date: newTaskDate,
      repeat: newRepeat,
      subtasks: newSubtasks,
      attachments: [],
    };
    tasks.push(changedTask);
  }
  document.getElementById('new-task-title').value = '';
  editingTaskId = null;
  newRepeat = 'nenhuma';
  newSubtasks = [];
  closeModal('modal-add-task');
  renderAll();
  if (changedTask) requestNotificationsForTask(changedTask);
});

function startEditTask(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  editingTaskId = id;
  newPriority = t.priority;
  newProjectId = t.projectId ?? null;
  newTaskDate = t.date;
  newTaskTime = t.time || '';
  newRepeat = t.repeat || 'nenhuma';
  newSubtasks = (t.subtasks || []).map(s => typeof s === 'string' ? { title: s, done: false } : { ...s });
  document.getElementById('new-task-title').value = t.title;
  closeModal('modal-task-detail');
  buildAddTaskModal();
  openModal('modal-add-task');
}

// ─── ADD HABIT MODAL ──────────────────────────────────────────────────────────
function buildColorSwatches() {
  const input = document.getElementById('habit-color-input');
  const value = document.getElementById('habit-color-value');
  if (!input || !value) return;
  input.value = newHabitColor;
  value.textContent = newHabitColor.toUpperCase();
  input.oninput = () => {
    newHabitColor = input.value;
    value.textContent = newHabitColor.toUpperCase();
  };
}

function buildProjectColorSwatches() {
  const input = document.getElementById('project-color-input');
  const value = document.getElementById('project-color-value');
  if (!input || !value) return;
  input.value = newProjectColor;
  value.textContent = newProjectColor.toUpperCase();
  input.oninput = () => {
    newProjectColor = input.value;
    value.textContent = newProjectColor.toUpperCase();
  };
}

document.getElementById('new-habit-name').addEventListener('input', () => {
  const ready = document.getElementById('new-habit-name').value.trim();
  document.getElementById('submit-habit').className = `modal-submit ${ready?'ready':''}`;
});

document.getElementById('submit-habit').addEventListener('click', () => {
  const name = document.getElementById('new-habit-name').value.trim();
  if (!name) return;
  const habitColorInput = document.getElementById('habit-color-input');
  if (habitColorInput) newHabitColor = habitColorInput.value;
  if (editingHabitId) {
    const h = habits.find(h => h.id === editingHabitId);
    if (h) {
      h.name = name;
      h.goal = document.getElementById('new-habit-goal').value.trim();
      h.cue = document.getElementById('new-habit-cue').value.trim();
      h.color = newHabitColor;
    }
  } else {
    habits.push({
      id: Date.now(),
      name,
      goal: document.getElementById('new-habit-goal').value.trim(),
      cue:  document.getElementById('new-habit-cue').value.trim(),
      color: newHabitColor,
      streak: 0,
      week: Array(7).fill(null),
      heatmap: makeHeatmap(0),
    });
  }
  document.getElementById('new-habit-name').value = '';
  document.getElementById('new-habit-goal').value = '';
  document.getElementById('new-habit-cue').value  = '';
  editingHabitId = null;
  document.getElementById('submit-habit').textContent = 'CRIAR HÁBITO';
  closeModal('modal-add-habit');
  renderAll();
});

document.getElementById('new-project-name').addEventListener('input', () => {
  const ready = document.getElementById('new-project-name').value.trim();
  document.getElementById('submit-project').className = `modal-submit ${ready?'ready':''}`;
});

document.getElementById('submit-project').addEventListener('click', () => {
  const name = document.getElementById('new-project-name').value.trim();
  if (!name) return;
  const colorInput = document.getElementById('project-color-input');
  if (colorInput) newProjectColor = colorInput.value;
  PROJECTS.push({
    id: Date.now(),
    name,
    dot: newProjectColor,
  });
  newProjectId = PROJECTS[PROJECTS.length - 1].id;
  document.getElementById('new-project-name').value = '';
  document.getElementById('submit-project').className = 'modal-submit';
  closeModal('modal-add-project');
  renderAll();
});

function startEditHabit(id) {
  const h = habits.find(h => h.id === id);
  if (!h) return;
  editingHabitId = id;
  newHabitColor = h.color;
  document.getElementById('new-habit-name').value = h.name;
  document.getElementById('new-habit-goal').value = h.goal || '';
  document.getElementById('new-habit-cue').value = h.cue || '';
  document.getElementById('submit-habit').textContent = 'SALVAR';
  document.getElementById('submit-habit').className = 'modal-submit ready';
  buildColorSwatches();
  closeModal('modal-habit-detail');
  openModal('modal-add-habit');
}

function deleteHabit(id, ask = true) {
  const h = habits.find(h => h.id === id);
  if (!h) return;
  if (ask && !confirmDelete(`o hábito "${h.name}"`)) return;
  habits = habits.filter(habit => habit.id !== id);
  closeModal('modal-habit-detail');
  renderAll();
  showDayToast('Habito excluido');
}

// ─── MODAL HELPERS ────────────────────────────────────────────────────────────
function openModal(id) {
  const overlay = document.getElementById(id);
  overlay.classList.add('open');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

// close on overlay click
['modal-add-task','modal-add-habit','modal-task-detail','modal-habit-detail','modal-add-project'].forEach(id => {
  const overlay = document.getElementById(id);
  overlay.addEventListener('click', e => {
    if (e.target === overlay) closeModal(id);
  });
});

// ─── FAB ─────────────────────────────────────────────────────────────────────
document.getElementById('fab').addEventListener('click', () => {
  if (currentNav === 'hoje') {
    newPriority = 'média'; newProjectId = null; newHasDate = false;
    newTaskDate = null;
    newTaskTime = '';
    newRepeat = 'nenhuma';
    newSubtasks = [];
    editingTaskId = null;
    document.getElementById('new-task-title').value = '';
    buildAddTaskModal();
    openModal('modal-add-task');
  } else if (currentNav === 'habitos') {
    editingHabitId = null;
    document.getElementById('new-habit-name').value = '';
    document.getElementById('new-habit-goal').value = '';
    document.getElementById('new-habit-cue').value = '';
    document.getElementById('submit-habit').textContent = 'CRIAR HÁBITO';
    document.getElementById('submit-habit').className = 'modal-submit';
    newHabitColor = '#B07D2A';
    buildColorSwatches();
    openModal('modal-add-habit');
  } else if (currentNav === 'projetos') {
    newProjectColor = COLORS[PROJECTS.length % COLORS.length];
    document.getElementById('new-project-name').value = '';
    document.getElementById('submit-project').className = 'modal-submit';
    buildProjectColorSwatches();
    openModal('modal-add-project');
  }
});

// ─── INIT ────────────────────────────────────────────────────────────────────
loadState();
applyTheme();
buildNav();
rebuildCurrentWeekDates();
buildWeekStrip();
buildViewToggle();
updateHeader();
buildColorSwatches();
buildProjectColorSwatches();
renderAll();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
